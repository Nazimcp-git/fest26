<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alert 2k26 — Score ATM Kiosk</title>
  <!-- Favicons -->
  <link rel="icon" type="image/png" href="../logo/logo.png" />
  <link rel="icon" type="image/webp" href="../logo/logo.webp" />
  <link rel="apple-touch-icon" href="../logo/logo.png" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          animation: {
            'blob': 'blob 8s infinite alternate ease-in-out',
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'ticker': 'ticker 35s linear infinite',
            'fade-up': 'fadeUp 0.5s ease-out forwards',
            'scale-in': 'scaleIn 0.4s ease-out forwards',
            'progress': 'progress 15s linear forwards',
          },
          keyframes: {
            blob: {
              '0%': { transform: 'translate(0,0) scale(1)' },
              '50%': { transform: 'translate(30px,-40px) scale(1.08)' },
              '100%': { transform: 'translate(0,0) scale(1)' }
            },
            ticker: {
              '0%': { transform: 'translateX(0)' },
              '100%': { transform: 'translateX(-50%)' }
            },
            fadeUp: {
              '0%': { opacity: '0', transform: 'translateY(20px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' }
            },
            scaleIn: {
              '0%': { opacity: '0', transform: 'scale(0.95)' },
              '100%': { opacity: '1', transform: 'scale(1)' }
            },
            progress: {
              '0%': { width: '100%' },
              '100%': { width: '0%' }
            }
          }
        }
      }
    }
  </script>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; height: 100vh; width: 100vw; background-color: #030712; user-select: none; }
    .custom-scrollbar::-webkit-scrollbar { display: none; }
    .custom-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
</head>
<body class="font-sans antialiased text-white selection:bg-orange-500 selection:text-white">

  <!-- Branded Loading Screen -->
  <div id="loading-screen" class="fixed inset-0 z-[9999] flex flex-col items-center justify-center bg-gray-950" style="background-image: radial-gradient(at 50% 40%, hsla(28,100%,50%,0.08) 0px, transparent 60%);">
    <style>
      @keyframes horizontalLoad {
        0% { left: -40%; width: 30%; }
        50% { left: 25%; width: 55%; }
        100% { left: 100%; width: 30%; }
      }
      @keyframes loaderPulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.88; transform: scale(0.98); } }
      @keyframes loaderFadeOut { 0% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(0.98); pointer-events: none; visibility: hidden; } }
      .loader-logo { 
        animation: loaderPulse 2.4s ease-in-out infinite; 
        filter: drop-shadow(0 4px 14px rgba(0, 0, 0, 0.55)) drop-shadow(0 1px 2px rgba(0, 0, 0, 0.8));
      }
      .loader-progress-bar { animation: horizontalLoad 1.4s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      .loader-hide { animation: loaderFadeOut 0.4s ease-out forwards; }
    </style>
    <div class="flex flex-col items-center">
      <div class="mb-5 flex items-center justify-center">
        <img src="../logo/logo.webp" onerror="this.onerror=null;this.src='../logo/logo.png'" alt="Alert 2k26" class="loader-logo h-16 sm:h-20 w-auto max-w-[260px] object-contain select-none" style="filter: drop-shadow(0 4px 14px rgba(0, 0, 0, 0.55)) drop-shadow(0 1px 2px rgba(0, 0, 0, 0.8));" />
      </div>
      <h1 class="text-xl sm:text-2xl font-black text-white tracking-tight mb-1" style="font-family: Inter, sans-serif;">Alert 2k26</h1>
      <p class="text-xs sm:text-sm font-medium text-gray-500 tracking-wide" style="font-family: Inter, sans-serif;">Loading Score ATM...</p>
      <!-- Horizontal Loading Bar -->
      <div class="w-48 sm:w-56 h-1.5 bg-gray-800/90 border border-gray-700/50 rounded-full overflow-hidden relative mt-4 shadow-inner">
        <div class="loader-progress-bar absolute top-0 bottom-0 bg-gradient-to-r from-orange-500 via-amber-400 to-orange-500 rounded-full shadow-[0_0_12px_rgba(249,115,22,0.7)]"></div>
      </div>
    </div>
  </div>

  <script>
    // Safety fallback: ensure loading screen dismisses even under slow network
    setTimeout(function() {
      var l = document.getElementById('loading-screen');
      if (l) {
        l.classList.add('loader-hide');
        setTimeout(function() { if (l && l.parentNode) l.remove(); }, 450);
      }
    }, 5000);
  </script>

  <div id="app"></div>

  <script>
    // ── Application State ──
    var CATEGORIES = window.CATEGORIES || ["BIDAYA", "ALIYA", "UOOLA", "THANIYA", "THANAWIYYA", "KULLIYYA"];
    let appData = {
      teams: {},
      students: {},
      programs: {},
      results: {},
      participantRegistrations: {},
      registrations: {},
      registrationPrograms: {},
      teamDirectScores: {},
      teamPenalties: {},
      studentPenalties: {},
      pointsConfig: { first: 5, second: 3, third: 2, a_grade: 1, b_grade: 0 },
      groupPointsConfig: { first: 10, second: 7, third: 5, a_grade: 0, b_grade: 0 },
      teamPointsConfig: { first: 15, second: 10, third: 7, a_grade: 0, b_grade: 0 }
    };

    let activeState = {
      mode: 'idle', // 'idle' | 'profile' | 'not_found'
      scannedCode: '',
      studentId: null,
      autoResetTimer: null,
      countdownInterval: null,
      clockInterval: null
    };

    // Barcode scanner buffer logic
    let scanBuffer = '';
    let lastKeyTime = 0;

    // ── Theme Engine ──
    let currentTheme = localStorage.getItem('fest_theme') || 'dark';

    function toggleTheme() {
      currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
      localStorage.setItem('fest_theme', currentTheme);
      render();
    }

    function getThemeStyles() {
      const isDark = currentTheme === 'dark';
      return {
        isDark,
        bgContainer: isDark ? 'bg-gradient-to-br from-gray-950 via-gray-900 to-gray-950 text-white' : 'bg-gradient-to-br from-gray-50 via-white to-gray-100 text-gray-900',
        titleColor: isDark ? 'text-white' : 'text-gray-900',
        subText: isDark ? 'text-white/40' : 'text-gray-500',
        subTextMuted: isDark ? 'text-white/25' : 'text-gray-400',
        cardBg: isDark ? 'bg-white/[0.04] border-white/10' : 'bg-white border-gray-200 shadow-xl text-gray-900',
        cardBgSubtle: isDark ? 'bg-white/[0.025] border-white/[0.06]' : 'bg-white border-gray-200/90 shadow-md text-gray-900',
        cardBgInner: isDark ? 'bg-white/[0.03] border-white/[0.06]' : 'bg-gray-50 border-gray-200 text-gray-900',
        itemBg: isDark ? 'bg-white/[0.03] border-white/[0.06]' : 'bg-white border-gray-200 shadow-xs text-gray-900',
        inputBg: isDark ? 'bg-white/5 border-white/10 text-white placeholder-white/20' : 'bg-gray-100 border-gray-300 text-gray-900 placeholder-gray-400',
        tickerBar: isDark ? 'border-white/[0.05] bg-black/40' : 'border-gray-200 bg-white/90 shadow-lg',
        tickerText: isDark ? 'text-white/60' : 'text-gray-700',
        tickerScore: isDark ? 'text-white' : 'text-gray-900',
        toggleBtn: isDark ? 'bg-white/10 text-white hover:bg-white/15' : 'bg-gray-900 text-white hover:bg-black shadow-md',
        toggleIcon: isDark ? 'fa-sun text-yellow-400' : 'fa-moon text-amber-300',
        closeBtn: isDark ? 'bg-white/10 text-white/80 hover:bg-white/15' : 'bg-gray-200 text-gray-800 hover:bg-gray-300 shadow-sm'
      };
    }

    // ── Helper Utilities ──
    function sanitize(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[m]));
    }

    function formatTime(ms) {
      const d = new Date(ms || Date.now());
      return d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    function startClock() {
      if (activeState.clockInterval) clearInterval(activeState.clockInterval);
      const clockEl = document.getElementById('live-clock');
      if (clockEl) clockEl.textContent = formatTime();
      activeState.clockInterval = setInterval(() => {
        const el = document.getElementById('live-clock');
        if (el) el.textContent = formatTime();
      }, 1000);
    }

    function resetToIdle() {
      if (activeState.autoResetTimer) clearTimeout(activeState.autoResetTimer);
      if (activeState.countdownInterval) clearInterval(activeState.countdownInterval);
      activeState.mode = 'idle';
      activeState.scannedCode = '';
      activeState.studentId = null;
      render();
    }

    function triggerAutoReset(seconds = 15) {
      if (activeState.autoResetTimer) clearTimeout(activeState.autoResetTimer);
      if (activeState.countdownInterval) clearInterval(activeState.countdownInterval);

      let remaining = seconds;
      const updateEl = () => {
        const el = document.getElementById('auto-reset-countdown');
        if (el) el.textContent = remaining + 's';
      };
      updateEl();

      activeState.countdownInterval = setInterval(() => {
        remaining--;
        if (remaining <= 0) {
          clearInterval(activeState.countdownInterval);
        } else {
          updateEl();
        }
      }, 1000);

      activeState.autoResetTimer = setTimeout(() => {
        resetToIdle();
      }, seconds * 1000);
    }

    function getStudentProfileDetails(studentId) {
      if (!studentId) return null;
      const cleanTarget = String(studentId).trim().toLowerCase();
      const cleanNum = /^\d+$/.test(cleanTarget) ? parseInt(cleanTarget, 10) : null;

      // 1. CHEST NUMBER FIRST (If searched target matches any student's chest number)
      let studentEntry = Object.entries(appData.students || {}).find(([id, s]) => {
        if (!s) return false;
        const chest = String(s.chestNo != null ? s.chestNo : (s.chest || '')).trim().toLowerCase();
        if (chest && chest === cleanTarget) return true;
        if (cleanNum !== null && /^\d+$/.test(chest) && parseInt(chest, 10) === cleanNum) return true;
        return false;
      });

      // 2. Direct key or internal ID lookup if no student has that chest number
      if (!studentEntry) {
        if (appData.students[studentId]) {
          studentEntry = [studentId, appData.students[studentId]];
        } else {
          studentEntry = Object.entries(appData.students || {}).find(([id, s]) => {
            if (!s) return false;
            return id === studentId || s.id === studentId ||
                   String(id).trim().toLowerCase() === cleanTarget ||
                   String(s.id || '').trim().toLowerCase() === cleanTarget;
          });
        }
      }

      if (!studentEntry) return null;

      const [resolvedStudentKey, student] = studentEntry;
      const resolvedStudentId = String(student.id || resolvedStudentKey).trim();
      const resolvedChestNo = String(student.chestNo != null ? student.chestNo : (student.chest || '')).trim();
      const resolvedChestNum = (/^\d+$/).test(resolvedChestNo) ? parseInt(resolvedChestNo, 10) : null;

      const team = appData.teams[student.teamId] || { name: 'Unknown Team' };
      const partMap = {};

      const matchParticipant = (p) => {
        if (!p || typeof p !== 'object') return false;

        // Check studentId/key first with EXACT case (Firebase push IDs are case-sensitive!)
        const pSid = String(p.studentId != null ? p.studentId : (p.id != null ? p.id : '')).trim();
        if (pSid) {
          if (pSid === resolvedStudentKey) return true;
          if (resolvedStudentId && pSid === resolvedStudentId) return true;
        }

        // Check chest number (numeric/alphanumeric labels)
        const pChest = String(p.chestNo != null ? p.chestNo : (p.chest != null ? p.chest : '')).trim();
        if (pChest && resolvedChestNo) {
          if (pChest.toLowerCase() === resolvedChestNo.toLowerCase()) return true;
          if (resolvedChestNum !== null && /^\d+$/.test(pChest) && parseInt(pChest, 10) === resolvedChestNum) return true;
        }

        return false;
      };

      const isRegisteredStudent = (item) => {
        if (!item) return false;
        if (typeof item === 'object') return matchParticipant(item);
        const rawStr = String(item).trim();
        if (!rawStr) return false;

        // 1. Match student key or internal ID EXACTLY (Case-sensitive!)
        if (rawStr === resolvedStudentKey || (resolvedStudentId && rawStr === resolvedStudentId)) {
          return true;
        }

        // 2. Match chest number ONLY if rawStr does NOT exist as another student's database key
        const lowerStr = rawStr.toLowerCase();
        if (resolvedChestNo && lowerStr === resolvedChestNo.toLowerCase()) {
          if (appData.students[rawStr] && rawStr !== resolvedStudentKey) return false;
          return true;
        }
        if (resolvedChestNum !== null && /^\d+$/.test(rawStr) && parseInt(rawStr, 10) === resolvedChestNum) {
          if (appData.students[rawStr] && rawStr !== resolvedStudentKey) return false;
          return true;
        }

        return false;
      };

      // Strict Category Matching Rule: An ALIYA student can NEVER participate in a THANIYA or any non-matching category program
      const isProgramCategoryEligible = (progCategory, studentCategory) => {
        if (!studentCategory) return false;
        if (!progCategory) return false;
        const pCat = String(progCategory).trim().toUpperCase();
        const sCat = String(studentCategory).trim().toUpperCase();
        if (pCat === 'GENERAL' || pCat === 'ALL' || sCat === 'GENERAL') return true;
        return pCat === sCat;
      };

      // 1. Programs registered under appData.participantRegistrations (Portal A)
      Object.entries(appData.participantRegistrations || {}).forEach(([progId, teamsObj]) => {
        if (!teamsObj || typeof teamsObj !== 'object') return;
        const p = appData.programs?.[progId] || {};
        const progCat = p.category || '';

        // Strict category filter
        if (!isProgramCategoryEligible(progCat, student.category)) return;

        // Check if student is registered under their own team ONLY
        if (!student.teamId || !teamsObj[student.teamId]) return;
        const teamRegsList = Array.isArray(teamsObj[student.teamId]) ? teamsObj[student.teamId] : Object.values(teamsObj[student.teamId]);

        if (teamRegsList.some(item => isRegisteredStudent(item))) {
          partMap[progId] = {
            programId: progId,
            programName: p.name || 'Program',
            category: p.category || student.category || 'GENERAL',
            programType: p.programType || 'individual',
            stageType: p.stageType || 'stage',
            status: 'registered',
            position: 'none',
            grade: 'none',
            points: 0,
            isPublished: false
          };
        }
      });

      // 2. Programs registered under appData.registrations (Portal B)
      Object.entries(appData.registrations || {}).forEach(([regKey, regVal]) => {
        if (!regVal || typeof regVal !== 'object') return;

        const entries = (regVal.programId && (regVal.studentId || regVal.chestNo || regVal.id))
          ? [regVal]
          : Object.values(regVal).filter(v => v && typeof v === 'object');

        entries.forEach(reg => {
          const progId = reg.programId || regKey;
          const p = appData.programs?.[progId] || {};
          const progCat = reg.category || p.category;

          // Strict category filter
          if (!isProgramCategoryEligible(progCat, student.category)) return;
          if (reg.teamId && student.teamId && reg.teamId !== student.teamId) return;
          if (reg.teamName && team.name && reg.teamName.trim().toLowerCase() !== team.name.trim().toLowerCase()) return;

          if (matchParticipant(reg) || isRegisteredStudent(reg.studentId) || isRegisteredStudent(reg.chestNo)) {
            if (!partMap[progId]) {
              partMap[progId] = {
                programId: progId,
                programName: p.name || reg.programName || 'Program',
                category: p.category || reg.category || student.category || 'GENERAL',
                programType: p.programType || reg.programType || 'individual',
                stageType: p.stageType || reg.stageType || 'stage',
                status: 'registered',
                position: 'none',
                grade: 'none',
                points: 0,
                isPublished: false
              };
            }
          }
        });
      });

      // 3. Published Results & Point Calculations
      // CRITICAL POLICY: Never reveal any unpublished results or points anywhere!
      let individualPoints = 0;
      Object.entries(appData.results || {}).forEach(([resId, r]) => {
        if (!r) return;
        const isPublished = String(r.status || '').trim().toLowerCase() === 'published';

        // STRICT POLICY: If result is NOT published, completely skip position, grade, and points!
        if (!isPublished) return;

        const progId = r.programId || resId;
        const pInfo = appData.programs?.[progId] || {};
        const progCat = r.category || pInfo.category;

        // Strict category filter: Candidate in ALIYA can never receive THNAIYA results!
        if (!isProgramCategoryEligible(progCat, student.category)) return;

        // Safely extract participants list whether Array or Object
        let participantsList = [];
        if (Array.isArray(r.participants)) {
          participantsList = r.participants;
        } else if (r.participants && typeof r.participants === 'object') {
          participantsList = Object.values(r.participants);
        }

        const pt = participantsList.find(p => matchParticipant(p));

        if (pt) {
          const cfg = r.programType === 'group' 
            ? (appData.groupPointsConfig || { first: 10, second: 7, third: 5, a_grade: 0, b_grade: 0 })
            : r.programType === 'team' 
              ? (appData.teamPointsConfig || { first: 15, second: 10, third: 7, a_grade: 0, b_grade: 0 })
              : (appData.pointsConfig || { first: 5, second: 3, third: 2, a_grade: 1, b_grade: 0 });

          let pts = 0;
          if (pt.position && pt.position !== 'none' && cfg[pt.position]) pts += Number(cfg[pt.position]) || 0;
          if (pt.grade && pt.grade !== 'none' && cfg[pt.grade]) pts += Number(cfg[pt.grade]) || 0;

          if (r.programType !== 'group' && r.programType !== 'team') {
            individualPoints += pts;
          }

          const hasPrize = (pt.position && pt.position !== 'none') || (pt.grade && pt.grade !== 'none');

          partMap[progId] = {
            programId: progId,
            programName: r.programName || pInfo.name || 'Program',
            category: r.category || pInfo.category || student.category || 'GENERAL',
            programType: r.programType || pInfo.programType || 'individual',
            stageType: r.stageType || pInfo.stageType || 'stage',
            position: pt.position || 'none',
            grade: pt.grade || 'none',
            points: pts,
            status: hasPrize ? 'prized' : 'participated',
            isPublished: true
          };
        } else if (partMap[progId]) {
          if (partMap[progId].status !== 'prized') {
            partMap[progId].status = 'participated';
            partMap[progId].isPublished = true;
          }
        }
      });

      const allPrograms = Object.values(partMap);
      // ONLY published results with prize can appear in prizedPrograms
      const prizedPrograms = allPrograms.filter(p => p.status === 'prized' && p.isPublished === true);

      // Student Penalties
      let penaltyTotal = 0;
      const penaltiesList = [];
      Object.values(appData.studentPenalties || {}).forEach(pen => {
        if (!pen) return;
        const penSid = String(pen.studentId != null ? pen.studentId : (pen.id || '')).trim();
        const penChest = String(pen.studentChestNo != null ? pen.studentChestNo : (pen.chestNo || '')).trim();
        let matchesPen = false;

        if (penSid && (penSid === resolvedStudentKey || (resolvedStudentId && penSid === resolvedStudentId))) {
          matchesPen = true;
        } else if (penChest && resolvedChestNo) {
          if (penChest.toLowerCase() === resolvedChestNo.toLowerCase()) matchesPen = true;
          if (resolvedChestNum !== null && /^\d+$/.test(penChest) && parseInt(penChest, 10) === resolvedChestNum) matchesPen = true;
        }

        if (matchesPen) {
          penaltyTotal += (Number(pen.points) || 0);
          penaltiesList.push(pen);
        }
      });

      const netPoints = Math.max(0, individualPoints - penaltyTotal);

      // Category Rank (STRICTLY FROM PUBLISHED RESULTS)
      const categoryStudents = Object.entries(appData.students || {})
        .map(([id, s]) => ({ id, ...s }))
        .filter(s => s && s.category === student.category)
        .map(s => {
          let pts = 0;
          const sChestStr = String(s.chestNo != null ? s.chestNo : (s.chest || '')).trim().toLowerCase();
          const sChestNum = /^\d+$/.test(sChestStr) ? parseInt(sChestStr, 10) : null;
          const sIdKey = String(s.id || '').trim().toLowerCase();

          const matchesStudent = (p) => {
            if (!p || typeof p !== 'object') return false;
            const pSid = String(p.studentId != null ? p.studentId : (p.id || '')).trim().toLowerCase();
            if (pSid && (pSid === sIdKey || (s.id && pSid === String(s.id).trim().toLowerCase()))) return true;
            const pChest = String(p.chestNo != null ? p.chestNo : (p.chest || '')).trim().toLowerCase();
            if (pChest && sChestStr) {
              if (pChest === sChestStr) return true;
              if (sChestNum !== null && /^\d+$/.test(pChest) && parseInt(pChest, 10) === sChestNum) return true;
            }
            return false;
          };

          Object.values(appData.results || {}).forEach(r => {
            if (!r || r.programType === 'group' || r.programType === 'team') return;
            if (String(r.status || '').trim().toLowerCase() !== 'published') return;
            
            const cfg = appData.pointsConfig || { first: 5, second: 3, third: 2, a_grade: 1, b_grade: 0 };
            let pList = Array.isArray(r.participants) ? r.participants : (r.participants && typeof r.participants === 'object' ? Object.values(r.participants) : []);

            pList.forEach(p => {
              if (matchesStudent(p)) {
                if (p.position && p.position !== 'none' && cfg[p.position]) pts += Number(cfg[p.position]) || 0;
                if (p.grade && p.grade !== 'none' && cfg[p.grade]) pts += Number(cfg[p.grade]) || 0;
              }
            });
          });

          Object.values(appData.studentPenalties || {}).forEach(pen => {
            if (!pen) return;
            const penSid = String(pen.studentId || '').trim().toLowerCase();
            const penChest = String(pen.studentChestNo || pen.chestNo || '').trim().toLowerCase();
            let m = false;
            if (penSid && (penSid === sIdKey || (s.id && penSid === String(s.id).trim().toLowerCase()))) m = true;
            else if (penChest && sChestStr) {
              if (penChest === sChestStr) m = true;
              if (sChestNum !== null && /^\d+$/.test(penChest) && parseInt(penChest, 10) === sChestNum) m = true;
            }
            if (m) pts -= (Number(pen.points) || 0);
          });
          return { id: s.id, chestNo: s.chestNo, points: Math.max(0, pts) };
        })
        .sort((a, b) => b.points - a.points);

      const rankIndex = categoryStudents.findIndex(s => s.id === resolvedStudentKey || s.id === resolvedStudentId || (s.chestNo && s.chestNo === resolvedChestNo));
      const rank = rankIndex !== -1 ? rankIndex + 1 : '—';

      return {
        student,
        team,
        netPoints,
        grossPoints: individualPoints,
        penaltyTotal,
        penaltiesList,
        prizedPrograms,
        allPrograms,
        rank,
        totalCategoryStudents: categoryStudents.length
      };
    }

    // ── Get Team Scores for Ticker (PUBLISHED RESULTS ONLY) ──
    function getTeamScores() {
      const teams = appData.teams || {};
      const penalties = {};

      Object.values(appData.teamPenalties || {}).forEach(p => {
        if (p && p.teamId) {
          if (!penalties[p.teamId]) penalties[p.teamId] = 0;
          penalties[p.teamId] += (Number(p.points) || 0);
        }
      });

      // Calculate team points SOLELY from published results
      // CRITICAL POLICY: NEVER use teamDirectScores or unpublished results!
      const teamPoints = {};
      Object.keys(teams).forEach(tid => { teamPoints[tid] = 0; });

      Object.values(appData.results || {}).forEach(r => {
        if (!r || String(r.status || '').trim().toLowerCase() !== 'published') return;

        const cfg = r.programType === 'group' 
          ? (appData.groupPointsConfig || { first: 10, second: 7, third: 5, a_grade: 0, b_grade: 0 })
          : r.programType === 'team' 
            ? (appData.teamPointsConfig || { first: 15, second: 10, third: 7, a_grade: 0, b_grade: 0 })
            : (appData.pointsConfig || { first: 5, second: 3, third: 2, a_grade: 1, b_grade: 0 });

        let pList = Array.isArray(r.participants) ? r.participants : (r.participants && typeof r.participants === 'object' ? Object.values(r.participants) : []);

        pList.forEach(p => {
          if (!p) return;
          let pts = 0;
          if (p.position && p.position !== 'none' && cfg[p.position]) pts += Number(cfg[p.position]) || 0;
          if (p.grade && p.grade !== 'none' && cfg[p.grade]) pts += Number(cfg[p.grade]) || 0;
          if (pts <= 0) return;

          // Find teamId
          let tId = p.teamId || r.teamId;
          if (!tId) {
            // Direct key lookup in appData.students first
            let st = p.studentId && appData.students ? appData.students[p.studentId] : null;
            if (!st) {
              const pChest = String(p.chestNo != null ? p.chestNo : (p.chest || '')).trim().toLowerCase();
              const chestNum = /^\d+$/.test(pChest) ? parseInt(pChest, 10) : null;
              if (pChest) {
                st = Object.values(appData.students || {}).find(s => {
                  if (!s) return false;
                  const sChest = String(s.chestNo || '').trim().toLowerCase();
                  if (sChest && sChest === pChest) return true;
                  if (chestNum !== null && /^\d+$/.test(sChest) && parseInt(sChest, 10) === chestNum) return true;
                  return false;
                });
              }
            }
            if (st && st.teamId) tId = st.teamId;
          }

          if (tId && teamPoints[tId] !== undefined) {
            teamPoints[tId] += pts;
          }
        });
      });

      const arr = Object.entries(teams).map(([id, t]) => {
        const total = Math.max(0, (teamPoints[id] || 0) - (penalties[id] || 0));
        return { id, name: t.name, totalPoints: total };
      });

      arr.sort((a, b) => b.totalPoints - a.totalPoints);
      return arr;
    }

    // ── Handle Scanned Code Lookup ──
    function processScannedCode(code) {
      const cleanCode = String(code || '').trim().toLowerCase();
      if (!cleanCode) return;

      const cleanNum = /^\d+$/.test(cleanCode) ? parseInt(cleanCode, 10) : null;

      // 1. SEARCH BY CHEST NUMBER FIRST (Chest number is unique to each student)
      let studentEntry = Object.entries(appData.students || {}).find(([id, s]) => {
        if (!s) return false;
        const chest = String(s.chestNo != null ? s.chestNo : (s.chest || '')).trim().toLowerCase();
        if (chest && chest === cleanCode) return true;
        if (cleanNum !== null && /^\d+$/.test(chest) && parseInt(chest, 10) === cleanNum) return true;
        return false;
      });

      // 2. Only if NO student has this chest number, check database key or internal ID
      if (!studentEntry) {
        studentEntry = Object.entries(appData.students || {}).find(([id, s]) => {
          if (!s) return false;
          const studentKey = String(id || '').trim().toLowerCase();
          const studentId = String(s.id || '').trim().toLowerCase();
          return studentKey === cleanCode || studentId === cleanCode;
        });
      }

      if (studentEntry) {
        const [id, student] = studentEntry;
        activeState.mode = 'profile';
        activeState.scannedCode = code;
        activeState.studentId = id;
        triggerAutoReset(15);
      } else {
        activeState.mode = 'not_found';
        activeState.scannedCode = code;
        activeState.studentId = null;
        triggerAutoReset(4);
      }
      render();
    }

                    <div class="grid grid-cols-3 gap-2">
                      <div class="${theme.cardBgInner} rounded-xl p-2.5 text-center border border-white/5">
                        <span class="text-[9px] font-bold ${theme.subText} uppercase tracking-wider block">Cat. Rank</span>
                        <div class="text-lg sm:text-xl font-black text-amber-400 mt-0.5 leading-tight">#${rank}</div>
                        <span class="text-[8px] ${theme.subTextMuted} font-medium block">of ${totalCategoryStudents}</span>
                      </div>
                      <div class="${theme.cardBgInner} rounded-xl p-2.5 text-center border border-white/5">
                        <span class="text-[9px] font-bold ${theme.subText} uppercase tracking-wider block">Enrolled</span>
                        <div class="text-lg sm:text-xl font-black ${theme.titleColor} mt-0.5 leading-tight">${allPrograms.length}</div>
                        <span class="text-[8px] ${theme.subTextMuted} font-medium block">Events</span>
                      </div>
                      <div class="${theme.cardBgInner} rounded-xl p-2.5 text-center border border-white/5">
                        <span class="text-[9px] font-bold ${theme.subText} uppercase tracking-wider block">Prizes</span>
                        <div class="text-lg sm:text-xl font-black text-orange-400 mt-0.5 leading-tight">${prizedPrograms.length}</div>
                        <span class="text-[8px] ${theme.subTextMuted} font-medium block">Awards</span>
                      </div>
                    </div>

                    <form onsubmit="event.preventDefault(); processScannedCode(document.getElementById('kiosk-quick-chest').value);" class="flex items-center gap-2">
                      <input type="text" id="kiosk-quick-chest" placeholder="Scan next ID card / enter chest..." 
                        class="w-full px-3.5 py-2 rounded-xl ${theme.inputBg} text-xs outline-none focus:border-orange-500 text-center font-bold tracking-wider">
                      <button type="submit" class="px-4 py-2 bg-orange-500 hover:bg-orange-600 text-white font-bold rounded-xl text-xs transition-all shadow-md shadow-orange-500/20 flex-shrink-0">
                        Scan
                      </button>
                    </form>
                  </div>

                </section>

                <!-- 2. RIGHT PANEL (8 Cols, 2 Sub-Columns Side-by-Side: Honors & Full Roster) -->
                <section class="col-span-12 lg:col-span-8 grid grid-cols-1 md:grid-cols-2 gap-3 sm:gap-4 h-full min-h-0 overflow-hidden">
                  
                  <!-- Sub-Col 1: Published Honors & Achievements -->
                  <div class="flex flex-col h-full min-h-0 ${theme.cardBgSubtle} rounded-2xl p-4 border overflow-hidden shadow-lg">
                    <div class="flex items-center justify-between pb-3 border-b border-white/5 flex-shrink-0 mb-3">
                      <div class="flex items-center gap-2">
                        <div class="w-7 h-7 rounded-lg bg-amber-500/15 text-amber-400 flex items-center justify-center text-xs">
                          <i class="fas fa-trophy"></i>
                        </div>
                        <div>
                          <h3 class="text-xs font-bold uppercase tracking-wider ${theme.titleColor}">Published Achievements</h3>
                          <p class="text-[9px] ${theme.subText}">Winners & Positions</p>
                        </div>
                      </div>
                      <span class="px-2 py-0.5 rounded-lg text-xs font-black bg-amber-500/15 text-amber-400 border border-amber-500/30">
                        ${prizedPrograms.length}
                      </span>
                    </div>

                    <div class="flex-grow min-h-0 overflow-y-auto space-y-2 pr-1 custom-scrollbar">
                      ${prizedRowsHtml}
                    </div>
                  </div>

                  <!-- Sub-Col 2: All Enrolled Programs Roster -->
                  <div class="flex flex-col h-full min-h-0 ${theme.cardBgSubtle} rounded-2xl p-4 border overflow-hidden shadow-lg">
                    <div class="flex items-center justify-between pb-3 border-b border-white/5 flex-shrink-0 mb-3">
                      <div class="flex items-center gap-2">
                        <div class="w-7 h-7 rounded-lg bg-blue-500/15 text-blue-400 flex items-center justify-center text-xs">
                          <i class="fas fa-list-check"></i>
                        </div>
                        <div>
                          <h3 class="text-xs font-bold uppercase tracking-wider ${theme.titleColor}">Enrolled Events Roster</h3>
                          <p class="text-[9px] ${theme.subText}">All Registered Competitions</p>
                        </div>
                      </div>
                      <span class="px-2 py-0.5 rounded-lg text-xs font-black bg-blue-500/15 text-blue-400 border border-blue-500/30">
                        ${allPrograms.length}
                      </span>
                    </div>

                    <div class="flex-grow min-h-0 overflow-y-auto space-y-2 pr-1 custom-scrollbar">
                      ${registeredRowsHtml}
                    </div>
                  </div>

                </section>

              </div>
            </main>

            <!-- Bottom Ticker -->
            <footer class="h-10 border-t ${theme.tickerBar} flex-shrink-0 z-20 flex items-center overflow-hidden">
              <div class="flex-shrink-0 px-4 h-full bg-gradient-to-r from-orange-500 to-amber-600 flex items-center">
                <span class="text-white text-[10px] font-black uppercase tracking-widest flex items-center gap-1.5">
                  <i class="fas fa-ranking-star"></i> Leaderboard
                </span>
              </div>
              <div class="flex-grow overflow-hidden">
                <div class="flex items-center animate-ticker whitespace-nowrap">
                  ${tickerItems}
                  <div class="w-16 flex-shrink-0"></div>
                  ${tickerItems}
                </div>
              </div>
            </footer>

          </div>`;
        return;
      }
    }

    // ── Global Barcode Listener ──
    window.addEventListener('keydown', e => {
      // Don't capture keys if user is typing into an input element manually
      if (document.activeElement && ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) {
        return;
      }

      const currentTime = Date.now();
      
      // Reset buffer if delay between keystrokes is long (> 500ms)
      if (currentTime - lastKeyTime > 500) {
        scanBuffer = '';
      }
      lastKeyTime = currentTime;

      if (e.key === 'Enter') {
        if (scanBuffer.length > 0) {
          processScannedCode(scanBuffer);
          scanBuffer = '';
        }
      } else if (e.key.length === 1) {
        scanBuffer += e.key;
      }
    });

    // ── Firebase Realtime Sync ──
    const atmCollections = [
      'teams', 'students', 'programs',
      'participantRegistrations', 'registrations',
      'teamPenalties', 'studentPenalties',
      'pointsConfig', 'groupPointsConfig', 'teamPointsConfig'
    ];
    atmCollections.forEach(col => {
      db.ref(col).on('value', snap => {
        appData[col] = snap.val() || {};
        render();
      });
    });
    db.ref('registrationPrograms').on('value', snap => {
      appData.registrationPrograms = snap.val() || {};
      render();
    });
    db.ref('results').orderByChild('status').equalTo('published').on('value', snap => {
      appData.results = snap.val() || {};
      render();
    }, err => {
      document.getElementById('app').innerHTML = `
        <div class="h-screen bg-gray-950 flex items-center justify-center">
          <div class="text-center">
            <i class="fas fa-wifi text-4xl text-red-500/50 mb-4"></i>
            <h2 class="text-xl font-bold text-white/50 mb-2">Connection Error</h2>
            <p class="text-white/25 text-sm mb-6">Unable to connect to database.</p>
            <button onclick="location.reload()" class="px-6 py-2.5 bg-white/10 text-white/60 rounded-xl font-bold text-sm hover:bg-white/15">Retry</button>
          </div>
        </div>`;
    });
  </script>
</body>
</html>
