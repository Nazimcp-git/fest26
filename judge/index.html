<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ART FEST 2K25 — Judge Portal</title>
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

  <!-- Tailwind (pre-built) -->
  <link rel="stylesheet" href="../results/styles/tailwind.css" />

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/security.js"></script>


  <style>
    html, body { margin: 0; padding: 0; background-color: #fafafa; font-family: 'Inter', sans-serif; }
    ::selection { background: rgba(251,146,60,0.2); color: #9a3412; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 10px; }
    .custom-scrollbar:hover::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.25); }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in { animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  </style>
</head>
<body class="bg-[#fafafa] text-gray-900 antialiased min-h-screen">

  <div id="app">
    <!-- Initial Loader -->
    <div class="h-screen flex items-center justify-center">
      <div class="text-center">
        <div class="w-12 h-12 border-3 border-orange-500/20 border-t-orange-600 rounded-full animate-spin mx-auto mb-4"></div>
        <p class="text-xs font-bold uppercase tracking-widest text-gray-400">Loading Judge Portal...</p>
      </div>
    </div>
  </div>

  <script>
    // Application State
    let appData = {
      programs: {},
      students: {},
      teams: {},
      participantRegistrations: {},
      results: {},
      judgeCodes: {}
    };    let judgeSession = typeof SecurityEngine !== 'undefined' ? SecurityEngine.verifySession('artfest_judge_session') : JSON.parse(sessionStorage.getItem('artfest_judge_session') || 'null');
    let selectedProgramId = null;
    let tempParticipants = [];
    let currentCategoryFilter = 'All';
    let currentStatusFilter = 'All';

    function sanitize(str) {
      if (!str) return '';
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    // Toast Notification Engine
    const Toast = {
      show(msg, type = 'info') {
        const colors = {
          success: 'bg-emerald-600 text-white',
          error: 'bg-red-600 text-white',
          info: 'bg-gray-900 text-white'
        };
        const toast = document.createElement('div');
        toast.className = `fixed bottom-6 right-6 px-6 py-3.5 rounded-2xl shadow-2xl ${colors[type]} text-sm font-bold tracking-wide z-[9999] animate-fade-in flex items-center gap-3`;
        toast.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle'} text-lg"></i> ${sanitize(msg)}`;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3500);
      }
    };

    // Toggle passcode visibility
    function toggleCodeVisibility() {
      const input = document.getElementById('judge-code-input');
      const icon = document.querySelector('#toggle-code-btn i');
      if (!input || !icon) return;
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fas fa-eye-slash text-sm';
      } else {
        input.type = 'password';
        icon.className = 'fas fa-eye text-sm';
      }
    }

    // Listen for Realtime DB Changes
    db.ref().on('value', snapshot => {
      const raw = snapshot.val() || {};
      appData = {
        programs: raw.programs || {},
        students: raw.students || {},
        teams: raw.teams || {},
        participantRegistrations: raw.participantRegistrations || {},
        results: raw.results || {},
        teacherJudges: raw.teacherJudges || {},
        judgeCodes: raw.judgeCodes || {}
      };

      // Keep active session assignedPrograms in sync with admin database changes
      if (judgeSession && judgeSession.code) {
        const currentTeacher = Object.values(appData.teacherJudges || {}).find(tj => tj && tj.code && tj.code.toUpperCase() === judgeSession.code.toUpperCase());
        if (currentTeacher) {
          judgeSession.name = currentTeacher.name || judgeSession.name;
          judgeSession.assignedPrograms = currentTeacher.assignedPrograms || [];
          sessionStorage.setItem('artfest_judge_session', JSON.stringify(judgeSession));
        }
      }

      render();
    });

    // Handle Judge Login — Code-only, secure authentication with SHA-256
    async function handleJudgeLogin(e) {
      e.preventDefault();
      const codeInput = document.getElementById('judge-code-input').value.trim().toUpperCase();
      const errEl = document.getElementById('login-error');

      if (!codeInput) {
        errEl.textContent = 'Please enter your assigned access code.';
        errEl.classList.remove('hidden');
        return;
      }

      const codeHash = await SecurityEngine.hashPasscode(codeInput);

      // 1. Check configured teacher judges by passcode or hash
      const teacherMatch = Object.values(appData.teacherJudges || {}).find(tj => {
        if (!tj || !tj.code) return false;
        const c = tj.code.toUpperCase();
        return c === codeInput || c === codeHash;
      });

      if (teacherMatch) {
        judgeSession = {
          code: teacherMatch.code.toUpperCase(),
          name: teacherMatch.name,
          assignedPrograms: teacherMatch.assignedPrograms || [],
          loggedInAt: Date.now()
        };
        sessionStorage.setItem('artfest_judge_session', JSON.stringify(judgeSession));
        Toast.show(`Welcome ${teacherMatch.name}! Your judging session is ready.`, 'success');
        render();
        return;
      }

      // 2. Check admin/global SHA-256 hashes (cryptographically secure)
      const globalCodeHashes = [
        '5dfc92691f7fa0a4f9f8dd9b05b69b1720baad084182c7c4d492cbbab1f23333', // PIN: 850392
        '835d6dc88b708bc646d6db82c853ef4182fabbd4a8de59c213f2b5ab3ae7d9be', // ADMIN
        '64e48f3bf07307f751c02213b95e0b5e1e8351597dfbe12bce5cbf115591ce3f', // ADMIN2026
        'ad0ee11b4ee66abb29207fdb6f105cb2b771cc549e7917b239b4cab56c9bfa5d', // ADMIN2025
        'be5aa6e7e0036550d40ac77e3f5f7e7b2e04d5ad7d00f11e259538852a9ef017', // JUDGE
        '85f4a8c06e53b3f06d18eb254ab50b240b706f523754ea85a32eb669ef85a242', // JUDGE2026
        'e09d0ec5b93fa93d2c6429c8965c34117e0e7454273ba540313f1bfd341915a1', // JUDGE2025
        'b73bb2cc8f6b985f6f31f67ea753f59beeb442149fc71788799bb23172ec2020', // ART FEST
        'b7a26a755f920f697bf83f7a0037746b0c7c0baaf4e0dbdbad93913a01bd96b2', // ARTFEST
        '3510af5f5287cc747c0701eedc1c8285799a08a02b277bd2a81433cfc6192ddd', // ARTFEST2026
        'e8a411e3e61fbbd175d356c7a349ca725dae4ff41a0387b5c9260684fb0c2ef6', // ARTFEST2025
        '542fcaea5bb1c9e731206706ff06a4833575826a86915c76016abeb02379cc41', // LEGACY CODE
        'b37f4f0db1c97cca96a1da6af60aa6676c9b0a568501f06cbae398310d2c2c70', // LEGACY CODE
        'a6813bfb35439cefa5c9ec65a085d774771e1f1a5bbbc1e6fef95b77e8055627',
        '468e8ca0217038e8ec43fef825c04b8b64e03b306b9a896d859733a1e34551d7',
        '8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918',
        'c5539eb87431e51b1424ed0f0a514d3a8241b9d4df2e923e20023a9d5dd408d6'
      ];

      if (globalCodeHashes.includes(codeHash)) {
        judgeSession = {
          code: codeInput,
          name: 'Admin Judge',
          assignedPrograms: [], // Empty = all programs (admin mode)
          loggedInAt: Date.now()
        };
        sessionStorage.setItem('artfest_judge_session', JSON.stringify(judgeSession));
        Toast.show('Authenticated as Admin Judge.', 'success');
        render();
        return;
      }

      errEl.textContent = 'Invalid access code. Please verify your assigned judge code.';
      errEl.classList.remove('hidden');
    }

    function handleLogout() {
      judgeSession = null;
      selectedProgramId = null;
      sessionStorage.removeItem('artfest_judge_session');
      Toast.show('Logged out from Judge Portal.', 'info');
      render();
    }

    // Select Program to Judge
    function selectProgramForJudging(progId) {
      selectedProgramId = progId;
      const prog = appData.programs[progId];
      if (!prog) return;

      // Check if result already exists for this program
      const existingResult = Object.values(appData.results || {}).find(r => r.programId === progId);
      
      // Load participants from participantRegistrations
      // Firebase RTDB may store arrays as objects with numeric keys {0: "id1", 1: "id2"}
      const registeredStudentIds = [];
      const programRegs = appData.participantRegistrations?.[progId];
      
      if (programRegs && typeof programRegs === 'object') {
        Object.entries(programRegs).forEach(([teamId, teamRegs]) => {
          // Normalize: could be an array, an object with numeric keys, or a single string
          let studentIds = [];
          if (Array.isArray(teamRegs)) {
            studentIds = teamRegs;
          } else if (teamRegs && typeof teamRegs === 'object') {
            // Firebase converted array to object: {0: "id1", 1: "id2"}
            studentIds = Object.values(teamRegs);
          } else if (typeof teamRegs === 'string') {
            studentIds = [teamRegs];
          }

          studentIds.forEach(sid => {
            if (sid && typeof sid === 'string' && !registeredStudentIds.includes(sid)) {
              registeredStudentIds.push(sid);
            }
          });
        });
      }

      if (existingResult && existingResult.participants && existingResult.participants.length > 0) {
        // Load existing result participants
        tempParticipants = existingResult.participants.map(p => ({
          studentId: p.studentId || '',
          chestNo: p.chestNo || '',
          name: p.name || '',
          teamId: p.teamId || '',
          className: p.className || '',
          category: p.category || '',
          position: p.position || 'none',
          grade: p.grade || 'none',
          marks: p.marks || ''
        }));

        // Also add any newly registered students that aren't already in the existing result
        registeredStudentIds.forEach(sid => {
          if (!tempParticipants.some(p => p.studentId === sid)) {
            const s = appData.students[sid];
            if (s) {
              tempParticipants.push({
                studentId: sid,
                chestNo: s.chestNo || 'N/A',
                name: s.name || 'Unknown Student',
                teamId: s.teamId || '',
                className: s.className || '',
                category: s.category || prog.category || 'GENERAL',
                position: 'none',
                grade: 'none',
                marks: ''
              });
            }
          }
        });
      } else {
        // Load from registrations
        tempParticipants = registeredStudentIds.map(sid => {
          const s = appData.students[sid];
          return {
            studentId: sid,
            chestNo: s?.chestNo || 'N/A',
            name: s?.name || 'Unknown Student',
            teamId: s?.teamId || '',
            className: s?.className || '',
            category: s?.category || prog.category || 'GENERAL',
            position: 'none',
            grade: 'none',
            marks: ''
          };
        }).sort((a, b) => (parseInt(a.chestNo) || 0) - (parseInt(b.chestNo) || 0));
      }

      render();
    }

    // Add Participant manually if needed
    function addManualParticipant(chestNoInput) {
      const chestNo = String(chestNoInput || '').trim();
      if (!chestNo) return;

      const studentEntry = Object.entries(appData.students || {}).find(([id, s]) => s && String(s.chestNo).trim() === chestNo);
      if (!studentEntry) {
        Toast.show(`No student found with Chest No "${chestNo}"`, 'error');
        return;
      }

      const [sid, s] = studentEntry;
      if (tempParticipants.some(p => p.studentId === sid)) {
        Toast.show(`Student ${s.name} (Chest #${s.chestNo}) is already in the participants list.`, 'info');
        return;
      }

      const prog = appData.programs[selectedProgramId];
      tempParticipants.push({
        studentId: sid,
        chestNo: s.chestNo,
        name: s.name,
        teamId: s.teamId,
        className: s.className || '',
        category: s.category || prog?.category || 'GENERAL',
        position: 'none',
        grade: 'none',
        marks: ''
      });
      Toast.show(`Added ${s.name} (Chest #${s.chestNo}) to program.`, 'success');
      render();
    }

    function removeParticipant(index) {
      tempParticipants.splice(index, 1);
      render();
    }

    // Submit Judgement Results to Admin
    async function submitJudgeResults(e) {
      e.preventDefault();
      if (!selectedProgramId) return;

      const prog = appData.programs[selectedProgramId];
      if (!prog) return;

      if (tempParticipants.length === 0) {
        Toast.show("Please add at least one participant before submitting results.", "error");
        return;
      }

      const judgeName = document.getElementById('judge-name-input')?.value.trim() || `Judge (${judgeSession.code})`;
      const judgeRemarks = document.getElementById('judge-remarks-input')?.value.trim() || '';

      // Collect updated positions and grades — ONLY include students who achieved a position, grade, or score
      const finalParticipants = tempParticipants.map((p, idx) => {
        const posEl = document.getElementById(`judge-pos-${idx}`);
        const gradeEl = document.getElementById(`judge-grade-${idx}`);
        const marksEl = document.getElementById(`judge-marks-${idx}`);
        return {
          ...p,
          position: posEl ? posEl.value : (p.position || 'none'),
          grade: gradeEl ? gradeEl.value : (p.grade || 'none'),
          marks: marksEl ? marksEl.value : (p.marks || '')
        };
      }).filter(p => {
        const hasPos = p.position && p.position !== 'none';
        const hasGrade = p.grade && p.grade !== 'none';
        const hasMarks = p.marks !== undefined && p.marks !== null && String(p.marks).trim() !== '';
        return hasPos || hasGrade || hasMarks;
      });

      if (finalParticipants.length === 0) {
        Toast.show("Please assign a position, grade, or score to at least one participant before submitting.", "error");
        return;
      }

      // Find if result entry exists
      const existingEntry = Object.entries(appData.results || {}).find(([id, r]) => r.programId === selectedProgramId);
      const resultKey = existingEntry ? existingEntry[0] : db.ref('results').push().key;

      const resultPayload = {
        programId: selectedProgramId,
        programName: prog.name,
        category: prog.category,
        stageType: prog.stageType || 'stage',
        programType: prog.programType || 'individual',
        participants: finalParticipants,
        status: 'submitted_by_judge',
        submittedByJudge: true,
        judgeCode: judgeSession.code,
        judgeName: judgeName,
        judgeRemarks: judgeRemarks,
        timestamp: Date.now()
      };

      try {
        await db.ref(`results/${resultKey}`).set(resultPayload);
        
        // Send alert notification to Admin
        await db.ref('notifications').push({
          type: 'judge_submission',
          programId: selectedProgramId,
          programName: prog.name,
          judgeName: judgeName,
          timestamp: Date.now()
        });

        Toast.show(`Judgement submitted successfully for ${prog.name}! Admin notified.`, 'success');
        selectedProgramId = null;
        tempParticipants = [];
        render();
      } catch (err) {
        console.error("Failed to submit result:", err);
        Toast.show("Submission error: " + err.message, "error");
      }
    }

    // MAIN RENDER FUNCTION
    function render() {
      const appEl = document.getElementById('app');

      // 1. LOGIN SCREEN
      if (!judgeSession) {
        appEl.innerHTML = `
          <div class="min-h-screen flex flex-col justify-center items-center px-6 py-12 relative overflow-hidden bg-gradient-to-br from-gray-900 via-gray-950 to-black text-white">
            
            <!-- Background Glow Blobs -->
            <div class="absolute top-1/4 left-1/4 w-[500px] h-[500px] bg-orange-500/10 rounded-full blur-[160px] pointer-events-none"></div>
            <div class="absolute bottom-1/4 right-1/4 w-[400px] h-[400px] bg-amber-500/10 rounded-full blur-[160px] pointer-events-none"></div>

            <div class="w-full max-w-md relative z-10 animate-fade-in">
              
              <!-- Brand Header -->
              <div class="text-center mb-8">
                <div class="w-16 h-16 rounded-3xl bg-gradient-to-br from-orange-500 to-amber-600 flex items-center justify-center mx-auto mb-4 shadow-xl shadow-orange-500/20">
                  <i class="fas fa-shield-halved text-white text-2xl"></i>
                </div>
                <h1 class="font-display text-4xl font-black tracking-tight text-white">ART FEST 2K25</h1>
                <p class="text-orange-400 font-bold text-xs uppercase tracking-[0.2em] mt-1">Secure Judge Portal</p>
              </div>

              <!-- Login Card -->
              <div class="bg-white/10 backdrop-blur-2xl border border-white/15 rounded-3xl p-8 shadow-2xl">
                <div class="flex items-center gap-3 mb-6">
                  <div class="w-10 h-10 rounded-xl bg-orange-500/20 text-orange-400 flex items-center justify-center">
                    <i class="fas fa-lock text-lg"></i>
                  </div>
                  <div>
                    <h2 class="text-lg font-bold text-white">Judge Authentication</h2>
                    <p class="text-xs text-gray-400 font-medium">Enter the access code provided by event administration.</p>
                  </div>
                </div>

                <form onsubmit="handleJudgeLogin(event)" class="space-y-4">
                  <div>
                    <label class="block text-[10px] font-bold uppercase tracking-wider text-gray-300 mb-2">Access Code</label>
                    <div class="relative flex items-center">
                      <i class="fas fa-key text-gray-400 absolute left-4"></i>
                      <input type="password" id="judge-code-input" required placeholder="Enter your passcode" autocomplete="off"
                        class="w-full bg-white/10 border border-white/20 rounded-2xl pl-11 pr-12 py-3.5 text-white font-mono font-bold text-base placeholder-gray-500 focus:outline-none focus:border-orange-500 transition-all uppercase tracking-wider">
                      <button type="button" onclick="toggleCodeVisibility()" id="toggle-code-btn" class="absolute right-4 text-gray-400 hover:text-white transition-colors">
                        <i class="fas fa-eye text-sm"></i>
                      </button>
                    </div>
                  </div>

                  <div id="login-error" class="hidden p-3 rounded-xl bg-red-500/20 border border-red-500/30 text-red-300 text-xs font-medium text-center"></div>

                  <button type="submit" class="w-full py-4 bg-gradient-to-r from-orange-500 to-amber-600 text-white font-bold rounded-2xl shadow-lg shadow-orange-500/25 hover:shadow-orange-500/40 transition-all flex items-center justify-center gap-2">
                    <i class="fas fa-right-to-bracket"></i> Authenticate & Enter
                  </button>
                </form>

                <div class="mt-6 pt-6 border-t border-white/10 text-center">
                  <p class="text-[11px] text-gray-500 font-medium"><i class="fas fa-info-circle mr-1"></i>Access codes are assigned by the event administration team.</p>
                </div>
              </div>

            </div>
          </div>`;
        return;
      }

      // 2. JUDGE DASHBOARD & PROGRAM SELECTOR
      const assignedProgramIds = judgeSession.assignedPrograms || [];
      const isRestricted = Array.isArray(assignedProgramIds) && assignedProgramIds.length > 0;

      const programsArray = Object.entries(appData.programs || {}).map(([id, p]) => {
        const result = Object.values(appData.results || {}).find(r => r.programId === id);
        
        // Count registered participants
        const regCount = Object.values(appData.participantRegistrations?.[id] || {}).reduce((acc, list) => {
          if (Array.isArray(list)) return acc + list.length;
          if (list && typeof list === 'object') return acc + Object.keys(list).length;
          if (typeof list === 'string') return acc + 1;
          return acc;
        }, 0);

        let status = 'pending'; // 'pending' | 'submitted_by_judge' | 'published'
        if (result) {
          status = result.status === 'published' ? 'published' : result.status === 'submitted_by_judge' ? 'submitted_by_judge' : 'pending';
        }

        return { id, ...p, status, result, regCount };
      });

      // Filter Programs for current teacher judge
      const filteredPrograms = programsArray.filter(p => {
        if (isRestricted && !assignedProgramIds.includes(p.id)) return false;
        if (currentCategoryFilter !== 'All' && p.category !== currentCategoryFilter) return false;
        if (currentStatusFilter !== 'All') {
          if (currentStatusFilter === 'Pending' && p.status !== 'pending') return false;
          if (currentStatusFilter === 'Submitted' && p.status !== 'submitted_by_judge') return false;
          if (currentStatusFilter === 'Published' && p.status !== 'published') return false;
        }
        return true;
      });

      // RENDER PROGRAM JUDGING SCREEN IF PROGRAM SELECTED
      if (selectedProgramId && appData.programs[selectedProgramId]) {
        const selectedProg = appData.programs[selectedProgramId];
        const existingResult = Object.values(appData.results || {}).find(r => r.programId === selectedProgramId);

        const rowsHtml = tempParticipants.length === 0 ? `
          <tr>
            <td colspan="6" class="py-12 text-center text-gray-400 font-medium">
              <i class="fas fa-users-slash text-3xl mb-2 block opacity-40"></i>
              No participants registered yet for this program. Use the quick add input below to add students by Chest Number.
            </td>
          </tr>` : tempParticipants.map((p, idx) => {
            const team = appData.teams[p.teamId] || { name: 'Unknown Team' };
            return `
              <tr class="border-b border-gray-200/60 hover:bg-white/60 transition-colors">
                <td class="px-5 py-4 w-16 text-center font-mono font-black text-orange-600 text-base">
                  #${sanitize(p.chestNo)}
                </td>
                <td class="px-5 py-4">
                  <p class="font-bold text-gray-900 text-sm">${sanitize(p.name)}</p>
                  <p class="text-[11px] text-gray-500 font-medium">Class ${sanitize(p.className || 'N/A')}</p>
                </td>
                <td class="px-5 py-4">
                  <span class="px-3 py-1 rounded-xl text-xs font-bold bg-white text-gray-800 border border-gray-200 shadow-2xs">${sanitize(team.name)}</span>
                </td>
                <td class="px-5 py-4">
                  <select id="judge-pos-${idx}" class="bg-white border border-gray-200 rounded-xl px-3 py-2 text-xs font-bold text-gray-900 focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 outline-none">
                    <option value="none" ${p.position === 'none' ? 'selected' : ''}>No Position</option>
                    <option value="first" ${p.position === 'first' ? 'selected' : ''}>🥇 1st Position</option>
                    <option value="second" ${p.position === 'second' ? 'selected' : ''}>🥈 2nd Position</option>
                    <option value="third" ${p.position === 'third' ? 'selected' : ''}>🥉 3rd Position</option>
                  </select>
                </td>
                <td class="px-5 py-4">
                  <select id="judge-grade-${idx}" class="bg-white border border-gray-200 rounded-xl px-3 py-2 text-xs font-bold text-gray-900 focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 outline-none">
                    <option value="none" ${p.grade === 'none' ? 'selected' : ''}>No Grade</option>
                    <option value="a_grade" ${p.grade === 'a_grade' ? 'selected' : ''}>⭐ A Grade</option>
                    <option value="b_grade" ${p.grade === 'b_grade' ? 'selected' : ''}>✨ B Grade</option>
                  </select>
                </td>
                <td class="px-5 py-4 text-right">
                  <button type="button" onclick="removeParticipant(${idx})" class="w-8 h-8 rounded-xl bg-red-500/10 text-red-600 hover:bg-red-500 hover:text-white transition-all">
                    <i class="fas fa-trash-can text-xs"></i>
                  </button>
                </td>
              </tr>`;
          }).join('');

        appEl.innerHTML = `
          <div class="min-h-screen bg-[#fafafa] pb-20 animate-fade-in max-w-6xl mx-auto px-6 py-8">
            
            <!-- Top Navigation & Program Title -->
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
              <button onclick="selectedProgramId = null; render();" class="inline-flex items-center gap-2 text-xs font-bold text-gray-500 hover:text-gray-900 transition-colors">
                <i class="fas fa-arrow-left"></i> Back to Program List
              </button>

              <div class="flex items-center gap-3">
                <span class="px-3.5 py-1.5 rounded-xl bg-gray-900 text-white font-mono font-bold text-xs">
                  Judge: ${sanitize(judgeSession.code)}
                </span>
                <button onclick="handleLogout()" class="px-3.5 py-1.5 rounded-xl bg-red-500/10 text-red-600 hover:bg-red-500 hover:text-white font-bold text-xs transition-all">
                  Logout
                </button>
              </div>
            </div>

            <!-- Program Header Banner -->
            <div class="bg-gradient-to-br from-gray-900 via-gray-950 to-black text-white rounded-[2.5rem] p-8 shadow-xl mb-8 relative overflow-hidden">
              <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 relative z-10">
                <div>
                  <div class="flex items-center gap-3 mb-2">
                    <span class="px-3 py-1 rounded-xl text-xs font-black uppercase tracking-widest bg-orange-500/20 text-orange-400 border border-orange-500/30">
                      ${sanitize(selectedProg.category)}
                    </span>
                    <span class="px-3 py-1 rounded-xl text-xs font-bold bg-white/10 text-gray-300">
                      ${selectedProg.stageType === 'non-stage' ? 'Non-Stage Event' : 'Stage Event'}
                    </span>
                    ${existingResult ? `<span class="px-3 py-1 rounded-xl text-xs font-bold ${existingResult.status === 'published' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-amber-500/20 text-amber-400'}"><i class="fas fa-clock mr-1"></i>${existingResult.status.toUpperCase()}</span>` : ''}
                  </div>
                  <h1 class="text-3xl sm:text-4xl font-black font-display tracking-tight text-white">${sanitize(selectedProg.name)}</h1>
                  <p class="text-xs text-gray-400 font-medium mt-1">${tempParticipants.length} registered participants loaded for evaluation</p>
                </div>
              </div>
            </div>

            <!-- Participants Table Form -->
            <form onsubmit="submitJudgeResults(event)" class="space-y-6">
              
              <div class="bg-white/60 backdrop-blur-xl border border-white/60 rounded-3xl overflow-hidden shadow-lg shadow-black/5">
                <div class="p-6 border-b border-black/5 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                  <div>
                    <h2 class="text-lg font-bold text-gray-900 tracking-tight">Participant Evaluation Sheet</h2>
                    <p class="text-xs text-gray-500 font-medium">Select 1st, 2nd, 3rd winners and A/B grades for participants.</p>
                  </div>

                  <!-- Quick Add Participant Input -->
                  <div class="flex items-center gap-2">
                    <input type="text" id="quick-chest-input" placeholder="Enter Chest No..." 
                      class="px-4 py-2 bg-white border border-gray-200 rounded-xl text-xs font-bold text-gray-900 placeholder-gray-400 focus:outline-none focus:border-orange-500 w-36">
                    <button type="button" onclick="addManualParticipant(document.getElementById('quick-chest-input').value)" class="px-4 py-2 bg-gray-900 hover:bg-black text-white font-bold rounded-xl text-xs transition-colors">
                      + Add Participant
                    </button>
                  </div>
                </div>

                <div class="overflow-x-auto">
                  <table class="w-full text-left border-collapse">
                    <thead class="bg-black/5 border-b border-black/5 text-gray-600">
                      <tr>
                        <th class="px-5 py-3.5 text-[10px] font-bold uppercase tracking-widest text-center">Chest No</th>
                        <th class="px-5 py-3.5 text-[10px] font-bold uppercase tracking-widest">Student Name</th>
                        <th class="px-5 py-3.5 text-[10px] font-bold uppercase tracking-widest">Team</th>
                        <th class="px-5 py-3.5 text-[10px] font-bold uppercase tracking-widest">Position Winner</th>
                        <th class="px-5 py-3.5 text-[10px] font-bold uppercase tracking-widest">Grade Awarded</th>
                        <th class="px-5 py-3.5 text-[10px] font-bold uppercase tracking-widest text-right">Action</th>
                      </tr>
                    </thead>
                    <tbody class="divide-y divide-black/5">
                      ${rowsHtml}
                    </tbody>
                  </table>
                </div>
              </div>

              <!-- Judge Identification & Submit Button -->
              <div class="bg-white/60 backdrop-blur-xl border border-white/60 rounded-3xl p-6 shadow-lg shadow-black/5 flex flex-col sm:flex-row items-center justify-between gap-6">
                <div class="w-full sm:w-1/2 space-y-3">
                  <div>
                    <label class="block text-[10px] font-bold uppercase tracking-wider text-gray-500 mb-1">Judge Name / Identification</label>
                    <input type="text" id="judge-name-input" placeholder="e.g. Judge Dr. Ahmed" value="${sanitize(existingResult?.judgeName || '')}" 
                      class="w-full bg-white border border-gray-200 rounded-xl px-4 py-2.5 text-xs font-bold text-gray-900 placeholder-gray-400 focus:outline-none focus:border-orange-500">
                  </div>
                </div>

                <button type="submit" class="w-full sm:w-auto px-10 py-4 bg-gradient-to-r from-orange-500 to-amber-600 hover:from-orange-600 hover:to-amber-700 text-white font-bold rounded-2xl shadow-xl shadow-orange-500/25 transition-all text-sm flex items-center justify-center gap-2">
                  <i class="fas fa-paper-plane"></i> Submit Results to Admin Panel
                </button>
              </div>

            </form>

          </div>`;
        return;
      }

      // 3. PROGRAM LISTING & DASHBOARD VIEW
      const programCardsHtml = filteredPrograms.length === 0 ? `
        <div class="col-span-full py-16 text-center text-gray-500 bg-white/60 backdrop-blur-xl rounded-3xl border border-white/60 shadow-sm">
          <i class="fas fa-folder-open text-4xl text-gray-300 mb-3"></i>
          <p class="font-bold">No programs match the selected filters.</p>
        </div>` : filteredPrograms.map(p => {
          let statusBadge = '';
          if (p.status === 'published') {
            statusBadge = `<span class="px-3 py-1 rounded-xl text-[10px] font-black uppercase tracking-wider bg-emerald-500/10 text-emerald-700 border border-emerald-500/20"><i class="fas fa-check-circle mr-1"></i>Published</span>`;
          } else if (p.status === 'submitted_by_judge') {
            statusBadge = `<span class="px-3 py-1 rounded-xl text-[10px] font-black uppercase tracking-wider bg-amber-500/10 text-amber-700 border border-amber-500/20"><i class="fas fa-gavel mr-1"></i>Submitted by Judge</span>`;
          } else {
            statusBadge = `<span class="px-3 py-1 rounded-xl text-[10px] font-bold uppercase tracking-wider bg-gray-100 text-gray-600 border border-gray-200"><i class="fas fa-hourglass-half mr-1"></i>Ready for Judging</span>`;
          }

          return `
            <div onclick="selectProgramForJudging('${p.id}')" class="bg-gradient-to-br from-white/80 to-white/40 backdrop-blur-xl border border-white/80 rounded-3xl p-6 shadow-sm hover:shadow-md hover:-translate-y-1 transition-all cursor-pointer group flex flex-col justify-between">
              <div>
                <div class="flex justify-between items-start mb-4">
                  <span class="px-2.5 py-1 rounded-lg text-[10px] font-black uppercase tracking-wider bg-orange-500/10 text-orange-600 border border-orange-500/20">${sanitize(p.category)}</span>
                  ${statusBadge}
                </div>
                <h3 class="text-xl font-black text-gray-900 tracking-tight group-hover:text-orange-600 transition-colors mb-2">${sanitize(p.name)}</h3>
                <p class="text-xs text-gray-500 font-medium">${p.regCount} Registered Participants</p>
              </div>

              <div class="mt-6 pt-4 border-t border-black/5 flex items-center justify-between text-xs font-bold text-orange-600">
                <span>Open Evaluation Sheet →</span>
                <i class="fas fa-chevron-right text-xs group-hover:translate-x-1 transition-transform"></i>
              </div>
            </div>`;
        }).join('');

      appEl.innerHTML = `
        <div class="min-h-screen bg-[#fafafa] pb-20 animate-fade-in max-w-6xl mx-auto px-6 py-8">
          
          <!-- Top Bar -->
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8 pb-6 border-b border-gray-200">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-orange-500 to-amber-600 flex items-center justify-center text-white shadow-md">
                <i class="fas fa-chalkboard-user"></i>
              </div>
              <div>
                <div class="flex items-center gap-2">
                  <h1 class="text-2xl font-black font-display text-gray-900 tracking-tight">${sanitize(judgeSession.name || 'Judge')}</h1>
                  <span class="px-2.5 py-0.5 rounded-full text-[10px] font-black uppercase tracking-wider ${isRestricted ? 'bg-orange-500/10 text-orange-600 border border-orange-500/20' : 'bg-gray-900 text-white'}">
                    ${isRestricted ? `${assignedProgramIds.length} Programs Assigned` : 'Global Mode'}
                  </span>
                </div>
                <p class="text-xs text-gray-500 font-medium">Select a program from your assigned list to evaluate participants & record winners.</p>
              </div>
            </div>

            <div class="flex items-center gap-3">
              <span class="px-3.5 py-2 rounded-xl bg-gray-900 text-white font-mono font-bold text-xs shadow-xs">
                Code: ${sanitize(judgeSession.code)}
              </span>
              <button onclick="handleLogout()" class="px-4 py-2 rounded-xl bg-red-500/10 text-red-600 hover:bg-red-500 hover:text-white font-bold text-xs transition-all">
                Switch Teacher / Logout
              </button>
            </div>
          </div>

          <!-- Category & Status Filters -->
          <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8">
            <!-- Category Filter Tabs -->
            <div class="flex items-center gap-2 overflow-x-auto max-w-full pb-2 custom-scrollbar">
              ${['All', ...CATEGORIES].map(c => `
                <button onclick="currentCategoryFilter = '${c}'; render();" 
                  class="px-4 py-2 rounded-xl text-xs font-bold transition-all ${currentCategoryFilter === c ? 'bg-orange-500 text-white shadow-md shadow-orange-500/20' : 'bg-white text-gray-600 border border-gray-200 hover:bg-gray-50'}">
                  ${c}
                </button>
              `).join('')}
            </div>

            <!-- Status Filter -->
            <div class="flex items-center gap-2 bg-white border border-gray-200 rounded-xl p-1 shadow-2xs">
              ${['All', 'Pending', 'Submitted', 'Published'].map(s => `
                <button onclick="currentStatusFilter = '${s}'; render();" 
                  class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${currentStatusFilter === s ? 'bg-gray-900 text-white' : 'text-gray-600 hover:bg-gray-100'}">
                  ${s}
                </button>
              `).join('')}
            </div>
          </div>

          <!-- Programs Grid -->
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            ${programCardsHtml}
          </div>

        </div>`;
    }

    // Initial render call
    render();
  </script>
</body>
</html>
