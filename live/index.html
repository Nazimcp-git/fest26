<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ART FEST 2K25 — Live Results</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Tailwind (pre-built) -->
  <link rel="stylesheet" href="../results/styles/tailwind.css" />
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; height: 100vh; }
    .anim-stagger-1 { animation-delay: 0.1s; }
    .anim-stagger-2 { animation-delay: 0.2s; }
    .anim-stagger-3 { animation-delay: 0.3s; }
    .anim-stagger-4 { animation-delay: 0.4s; }
    .anim-stagger-5 { animation-delay: 0.5s; }
    .anim-stagger-6 { animation-delay: 0.6s; }
  </style>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
</head>
<body class="font-sans antialiased">

  <div id="app"></div>

  <script>
    // ── Constants ──
    var CATEGORIES = window.CATEGORIES || ["BIDAYA","ALIYA","UOOLA","THANIYA","THANAWIYYA","KULLIYYA"];

    const CAT_ACCENTS = {
      'BIDAYA':     { gradient: 'from-emerald-500 to-teal-400',  glow: 'shadow-emerald-500/30', text: 'text-emerald-400', bg: 'bg-emerald-500/15', border: 'border-emerald-500/30', dot: 'bg-emerald-500' },
      'ALIYA':      { gradient: 'from-sky-500 to-cyan-400',      glow: 'shadow-sky-500/30',     text: 'text-sky-400',     bg: 'bg-sky-500/15',     border: 'border-sky-500/30',     dot: 'bg-sky-500' },
      'UOOLA':      { gradient: 'from-violet-500 to-purple-400', glow: 'shadow-violet-500/30',  text: 'text-violet-400',  bg: 'bg-violet-500/15',  border: 'border-violet-500/30',  dot: 'bg-violet-500' },
      'THANIYA':    { gradient: 'from-amber-500 to-yellow-400',  glow: 'shadow-amber-500/30',   text: 'text-amber-400',   bg: 'bg-amber-500/15',   border: 'border-amber-500/30',   dot: 'bg-amber-500' },
      'THANAWIYYA': { gradient: 'from-rose-500 to-pink-400',     glow: 'shadow-rose-500/30',    text: 'text-rose-400',    bg: 'bg-rose-500/15',    border: 'border-rose-500/30',    dot: 'bg-rose-500' },
      'KULLIYYA':   { gradient: 'from-indigo-500 to-blue-400',   glow: 'shadow-indigo-500/30',  text: 'text-indigo-400',  bg: 'bg-indigo-500/15',  border: 'border-indigo-500/30',  dot: 'bg-indigo-500' }
    };
    const DEFAULT_ACCENT = { gradient: 'from-orange-500 to-amber-400', glow: 'shadow-orange-500/30', text: 'text-orange-400', bg: 'bg-orange-500/15', border: 'border-orange-500/30', dot: 'bg-orange-500' };

    const POS_STYLE = {
      'first':  { icon: 'fa-trophy', color: 'text-yellow-400', bg: 'bg-yellow-500/20', border: 'border-yellow-500/40', label: '1ST PLACE' },
      'second': { icon: 'fa-medal',  color: 'text-gray-300',   bg: 'bg-gray-500/20',   border: 'border-gray-400/40',   label: '2ND PLACE' },
      'third':  { icon: 'fa-medal',  color: 'text-amber-600',  bg: 'bg-amber-600/20',  border: 'border-amber-600/40',  label: '3RD PLACE' }
    };
    const GRADE_STYLE = {
      'a_grade': { label: 'A GRADE', color: 'text-emerald-400', bg: 'bg-emerald-500/20', border: 'border-emerald-500/40', icon: 'fa-award' },
      'b_grade': { label: 'B GRADE', color: 'text-blue-400',    bg: 'bg-blue-500/20',    border: 'border-blue-500/40',    icon: 'fa-award' }
    };

    // ── Helpers ──
    function sanitize(str) {
      if (typeof str !== 'string') return '';
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
      return str.replace(/[&<>"']/g, c => map[c]);
    }

    function formatTime(ts) {
      if (!ts) return '';
      return new Date(ts).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
    }

    function formatDate(ts) {
      if (!ts) return '';
      return new Date(ts).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
    }

    // ── State ──
    let appData = {};
    let lastRenderedId = null;

    // ── Theme State ──
    let currentTheme = localStorage.getItem('fest_theme') || 'dark';

    function toggleTheme() {
      currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
      localStorage.setItem('fest_theme', currentTheme);
      render();
    }

    function getThemeStyles() {
      const isDark = currentTheme === 'dark';
      return {
        isDark,
        bgContainer: isDark ? 'bg-gradient-to-br from-gray-950 via-gray-900 to-gray-950 text-white' : 'bg-gradient-to-br from-gray-50 via-white to-gray-100 text-gray-900',
        headerTitle: isDark ? 'text-white' : 'text-gray-900',
        subText: isDark ? 'text-white/35' : 'text-gray-500',
        subTextMuted: isDark ? 'text-white/20' : 'text-gray-400',
        cardBg: isDark ? 'bg-white/[0.035] border-white/[0.07]' : 'bg-white border-gray-200 shadow-md',
        avatarBg: isDark ? 'bg-white/[0.06] border-white/[0.08]' : 'bg-gray-100 border-gray-200',
        avatarText: isDark ? 'text-white/50' : 'text-gray-700',
        titleColor: isDark ? 'text-white' : 'text-gray-900',
        sidebarCard: isDark ? 'bg-white/[0.025] border-white/[0.05]' : 'bg-white border-gray-200 shadow-sm',
        sidebarTitle: isDark ? 'text-white/25' : 'text-gray-400',
        sidebarItemTitle: isDark ? 'text-white/60' : 'text-gray-700',
        sidebarItemSub: isDark ? 'text-white/25' : 'text-gray-400',
        tickerBar: isDark ? 'border-white/[0.05] bg-black/30' : 'border-gray-200 bg-white/90 shadow-lg',
        tickerText: isDark ? 'text-white/60' : 'text-gray-700',
        tickerScore: isDark ? 'text-white' : 'text-gray-900',
        toggleBtn: isDark ? 'bg-white/10 text-white hover:bg-white/15' : 'bg-gray-900 text-white hover:bg-black shadow-md',
        toggleIcon: isDark ? 'fa-sun text-yellow-400' : 'fa-moon text-amber-300'
      };
    }

    // ── Live Clock ──
    function startClock() {
      const update = () => {
        const el = document.getElementById('live-clock');
        if (el) el.textContent = new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      };
      update();
      setInterval(update, 1000);
    }

    // ── Get stored team scores ──
    function getTeamScores() {
      const teams = appData.teams || {};
      const students = appData.students || {};
      const directScores = appData.teamDirectScores || {};
      const penalties = {};

      Object.values(appData.teamPenalties || {}).forEach(p => {
        if (!penalties[p.teamId]) penalties[p.teamId] = 0;
        penalties[p.teamId] += p.points;
      });

      const arr = Object.entries(teams).map(([id, t]) => {
        const stored = directScores[id] || {};
        let total = 0;
        CATEGORIES.forEach(cat => { total += (stored[cat] || 0); });

        Object.entries(students).forEach(([sid, s]) => {
          if (s.teamId === id) total += (s.totalPoints || 0);
        });

        total -= (penalties[id] || 0);
        return { id, name: t.name, totalPoints: total };
      });

      arr.sort((a, b) => b.totalPoints - a.totalPoints);
      return arr;
    }

    // ── Render ──
    function render() {
      const results = Object.entries(appData.results || {})
        .map(([id, r]) => ({ id, ...r }))
        .filter(r => r.status === 'published' && r.participants && r.participants.length > 0)
        .sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

      const latest = results[0];
      const teamsArray = getTeamScores();
      const appEl = document.getElementById('app');
      const theme = getThemeStyles();

      // ── Empty State ──
      if (!latest) {
        appEl.innerHTML = `
          <div class="h-screen ${theme.bgContainer} flex items-center justify-center relative overflow-hidden">
            <div class="text-center relative z-10 animate-fade-up" style="opacity:0">
              <div class="w-28 h-28 rounded-full ${theme.cardBg} flex items-center justify-center mx-auto mb-8">
                <i class="fas fa-bullhorn text-5xl ${theme.subText}"></i>
              </div>
              <h1 class="text-5xl font-black ${theme.subText} tracking-tighter mb-3">Awaiting Results</h1>
              <p class="text-lg ${theme.subText} font-medium">Results will appear here when announced</p>
              <div class="mt-8 flex items-center gap-3 justify-center">
                <button onclick="toggleTheme()" class="px-4 py-2 ${theme.toggleBtn} rounded-xl font-bold text-xs flex items-center gap-2 transition-all">
                  <i class="fas ${theme.toggleIcon}"></i> ${theme.isDark ? 'Light Theme' : 'Dark Theme'}
                </button>
              </div>
            </div>
          </div>`;
        lastRenderedId = null;
        return;
      }

      const accent = CAT_ACCENTS[latest.category] || DEFAULT_ACCENT;
      const shouldAnimate = lastRenderedId !== latest.id;
      lastRenderedId = latest.id;
      const animClass = shouldAnimate ? 'animate-fade-up' : '';
      const animStyle = shouldAnimate ? 'opacity:0' : '';

      // Sort participants: position priority
      const posOrder = { 'first': 1, 'second': 2, 'third': 3 };
      const sorted = [...(latest.participants || [])].sort((a, b) => {
        return (posOrder[a.position] || 99) - (posOrder[b.position] || 99);
      });

      const count = sorted.length;
      const isCompact = count > 3;
      const isGrid = count > 5;

      const cardPad    = isCompact ? 'p-3'    : 'p-4';
      const avatarSize = isCompact ? 'w-10 h-10' : 'w-12 h-12';
      const avatarText = isCompact ? 'text-sm' : 'text-base';
      const nameSize   = isCompact ? 'text-base' : 'text-lg';
      const teamSize   = isCompact ? 'text-xs'  : 'text-sm';
      const badgePad   = isCompact ? 'px-3 py-1.5' : 'px-4 py-2';
      const badgeIcon  = isCompact ? 'text-sm'  : 'text-base';
      const badgeText  = isCompact ? 'text-xs'  : 'text-sm';
      const gapSize    = isGrid ? 'gap-2' : 'gap-2.5';
      const titleSize  = count > 6 ? 'text-3xl lg:text-4xl' : 'text-4xl lg:text-5xl';
      const headerMb   = isCompact ? 'mb-4' : 'mb-5';

      // Build participants
      const participantsHtml = sorted.map((p, idx) => {
        const student = (appData.students || {})[p.studentId];
        const teamName = student ? (appData.teams || {})[student.teamId]?.name || 'Unknown' : 'Unknown';
        const displayName = latest.programType !== 'individual' ? `${p.name} & Team` : p.name;
        const chestNo = student ? student.chestNo : '';
        const className = student ? student.className : '';

        let badges = '';
        const pos = POS_STYLE[p.position];
        const grd = GRADE_STYLE[p.grade];

        if (pos) {
          badges += `
            <div class="flex items-center gap-2 ${pos.bg} ${pos.border} border rounded-xl ${badgePad}">
              <i class="fas ${pos.icon} ${badgeIcon} ${pos.color}"></i>
              <span class="${badgeText} font-black ${pos.color} tracking-wider">${pos.label}</span>
            </div>`;
        }
        if (grd) {
          badges += `
            <div class="flex items-center gap-2 ${grd.bg} ${grd.border} border rounded-xl ${badgePad}">
              <i class="fas ${grd.icon} ${badgeIcon} ${grd.color}"></i>
              <span class="${badgeText} font-black ${grd.color} tracking-wider">${grd.label}</span>
            </div>`;
        }
        if (!badges) {
          badges = `
            <div class="flex items-center gap-2 bg-white/5 border border-white/10 rounded-xl ${badgePad}">
              <i class="fas fa-user ${badgeIcon} ${theme.subText}"></i>
              <span class="${badgeText} font-bold ${theme.subText} tracking-wider">PARTICIPANT</span>
            </div>`;
        }

        const delay = shouldAnimate ? `anim-stagger-${Math.min(idx + 1, 6)}` : '';

        return `
          <div class="${shouldAnimate ? 'animate-scale-in opacity-0' : ''} ${delay} ${theme.cardBg} rounded-xl ${cardPad}">
            <div class="flex items-center justify-between gap-3">
              <div class="flex items-center gap-3 min-w-0">
                <div class="${avatarSize} rounded-lg ${theme.avatarBg} flex items-center justify-center flex-shrink-0 relative overflow-hidden group">
                  <img src="https://raw.githubusercontent.com/Nazimcp-git/azinco/refs/heads/main/images/${encodeURIComponent(chestNo)}.jpg" alt="${sanitize(displayName)}"
                    class="w-full h-full object-cover rounded-lg"
                    onerror="this.style.display='none'; if(this.nextElementSibling) this.nextElementSibling.style.display='flex';" />
                  <div class="w-full h-full rounded-lg flex items-center justify-center ${theme.avatarBg}">
                    <span class="${avatarText} font-black ${theme.avatarText}">${sanitize(chestNo)}</span>
                  </div>
                </div>
                <div class="min-w-0">
                  <h3 class="${nameSize} font-black ${theme.titleColor} tracking-tight truncate">${sanitize(displayName)}</h3>
                  <p class="${teamSize} ${theme.subText} font-medium truncate">${sanitize(teamName)}${className ? ` · ${sanitize(className)}` : ''}</p>
                </div>
              </div>
              <div class="flex flex-wrap gap-2 flex-shrink-0">
                ${badges}
              </div>
            </div>
          </div>`;
      }).join('');

      const participantContainer = isGrid
        ? `<div class="grid grid-cols-2 ${gapSize} overflow-hidden flex-grow">${participantsHtml}</div>`
        : `<div class="flex flex-col ${gapSize} overflow-hidden flex-grow">${participantsHtml}</div>`;

      // Team ticker
      const tickerItems = teamsArray.map((t, i) => {
        const mColors = ['text-yellow-400', 'text-gray-300', 'text-amber-600'];
        const mc = mColors[i] || theme.subText;
        return `
          <div class="flex items-center gap-3 px-5 flex-shrink-0">
            <i class="fas fa-${i < 3 ? 'medal' : 'flag'} ${mc}"></i>
            <span class="${theme.tickerText} font-bold whitespace-nowrap text-sm">${sanitize(t.name)}</span>
            <span class="${theme.tickerScore} font-black text-lg">${t.totalPoints}</span>
          </div>`;
      }).join('<div class="w-px h-5 bg-gray-400/20 flex-shrink-0"></div>');

      // Recent results
      const recentCount = isCompact ? 4 : 6;
      const recentResults = results.slice(1, 1 + recentCount);
      const recentHtml = recentResults.map(r => {
        const rAccent = CAT_ACCENTS[r.category] || DEFAULT_ACCENT;
        const winners = (r.participants || []).filter(p => p.position && p.position !== 'none').slice(0, 1);
        const winnerName = winners.length > 0 ? sanitize(winners[0].name) : '';
        return `
          <div class="py-2 border-b ${theme.isDark ? 'border-white/[0.04]' : 'border-gray-100'} last:border-0">
            <div class="flex items-center gap-2">
              <div class="w-1.5 h-1.5 rounded-full ${rAccent.dot} flex-shrink-0"></div>
              <p class="text-xs font-bold ${theme.sidebarItemTitle} truncate">${sanitize(r.programName)}</p>
            </div>
            <div class="flex items-center gap-2 ml-3.5 mt-0.5">
              <span class="text-[9px] font-bold ${theme.sidebarItemSub} uppercase tracking-widest">${sanitize(r.category)}</span>
              ${winnerName ? `<span class="text-[9px] ${theme.sidebarItemSub}">· ${winnerName}</span>` : ''}
            </div>
          </div>`;
      }).join('');

      // ── Full Layout — exactly 100vh ──
      appEl.innerHTML = `
        <div class="h-screen ${theme.bgContainer} relative overflow-hidden flex flex-col">

          <!-- Ambient Glow -->
          <div class="absolute inset-0 pointer-events-none">
            <div class="absolute top-[-20%] left-[-10%] w-[60%] h-[60%] bg-gradient-to-r ${accent.gradient} opacity-[0.04] rounded-full blur-[200px] animate-blob"></div>
            <div class="absolute bottom-[-20%] right-[-10%] w-[50%] h-[50%] bg-gradient-to-l ${accent.gradient} opacity-[0.03] rounded-full blur-[200px] animate-blob" style="animation-delay:4s"></div>
          </div>

          <!-- Content -->
          <div class="relative z-10 flex flex-col h-screen">

            <!-- Top Bar -->
            <div class="flex items-center justify-between px-8 py-3 flex-shrink-0">
              <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-lg bg-gradient-to-br ${accent.gradient} flex items-center justify-center shadow-lg ${accent.glow}">
                  <i class="fas fa-trophy text-white text-sm"></i>
                </div>
                <span class="${theme.titleColor} font-black text-base tracking-tight">ART FEST 2K25</span>
                <span class="${theme.subText} text-xs font-medium hidden sm:inline">Result Announcement</span>
              </div>

              <div class="flex items-center gap-3">
                <!-- Theme Switcher Toggle Button -->
                <button onclick="toggleTheme()" class="px-3 py-1.5 ${theme.toggleBtn} rounded-xl font-bold text-xs flex items-center gap-2 transition-all">
                  <i class="fas ${theme.toggleIcon}"></i>
                  <span class="hidden sm:inline">${theme.isDark ? 'Light' : 'Dark'} Theme</span>
                </button>

                <div class="flex items-center gap-1.5 bg-red-500/15 border border-red-500/30 rounded-lg px-3 py-1">
                  <div class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></div>
                  <span class="text-red-400 text-[10px] font-bold uppercase tracking-widest">Live</span>
                </div>
                <div class="${theme.subText} text-xs font-medium tabular-nums" id="live-clock"></div>
              </div>
            </div>

            <!-- Main Content -->
            <div class="flex-grow flex px-8 pb-2 overflow-hidden min-h-0">
              <div class="w-full max-w-[1600px] mx-auto flex gap-6 min-h-0">

                <!-- Left: Main Result -->
                <div class="flex-grow min-w-0 flex flex-col min-h-0">
                  <!-- Program Header -->
                  <div class="${headerMb} flex-shrink-0 ${animClass}" style="${animStyle}">
                    <div class="flex flex-wrap items-center gap-2 mb-2">
                      <span class="px-3 py-1 rounded-lg text-[10px] font-black uppercase tracking-[0.2em] ${accent.bg} ${accent.border} border ${accent.text}">
                        ${sanitize(latest.category)}
                      </span>
                      <span class="px-2.5 py-1 rounded-lg text-[10px] font-bold uppercase tracking-widest ${theme.cardBg}">
                        ${latest.stageType === 'non-stage' ? 'Non-Stage' : 'Stage'}
                      </span>
                      <span class="px-2.5 py-1 rounded-lg text-[10px] font-bold uppercase tracking-widest ${theme.cardBg}">
                        ${latest.programType === 'individual' ? 'Individual' : latest.programType === 'group' ? 'Group' : 'Team'}
                      </span>
                      <span class="${theme.subTextMuted} text-xs font-medium ml-auto">${formatDate(latest.timestamp)} · ${formatTime(latest.timestamp)}</span>
                    </div>
                    <h1 class="${titleSize} font-black ${theme.titleColor} tracking-tighter leading-[0.95]">
                      ${sanitize(latest.programName)}
                    </h1>
                    <div class="h-1 w-24 rounded-full bg-gradient-to-r ${accent.gradient} mt-3 shadow-lg ${accent.glow}"></div>
                  </div>

                  <!-- Participants -->
                  ${participantContainer}
                </div>

                <!-- Right: Recent Results Sidebar -->
                ${recentHtml ? `
                <div class="w-64 flex-shrink-0 hidden lg:flex flex-col min-h-0">
                  <div class="${theme.sidebarCard} rounded-xl p-4 flex flex-col flex-grow overflow-hidden min-h-0">
                    <h4 class="text-[10px] font-bold ${theme.sidebarTitle} uppercase tracking-[0.2em] mb-3 flex-shrink-0 flex items-center gap-2">
                      <i class="fas fa-history ${theme.subTextMuted} text-[9px]"></i>
                      Recent Results
                    </h4>
                    <div class="overflow-hidden flex-grow min-h-0">
                      ${recentHtml}
                    </div>
                  </div>
                </div>` : ''}

              </div>
            </div>

            <!-- Bottom Ticker -->
            <div class="border-t ${theme.tickerBar} flex-shrink-0">
              <div class="flex items-center h-11 overflow-hidden">
                <div class="flex-shrink-0 px-4 py-1.5 bg-gradient-to-r ${accent.gradient}">
                  <span class="text-white text-[10px] font-black uppercase tracking-[0.15em]">Scores</span>
                </div>
                <div class="flex-grow overflow-hidden">
                  <div class="flex items-center animate-ticker">
                    ${tickerItems}
                    <div class="w-20 flex-shrink-0"></div>
                    ${tickerItems}
                  </div>
                </div>
              </div>
            </div>

          </div>
        </div>`;

      startClock();
    }

    // ── Firebase Realtime Sync ──
    db.ref().on('value', snapshot => {
      const raw = snapshot.val() || {};
      appData = {
        teams:            raw.teams            || {},
        students:         raw.students         || {},
        programs:         raw.programs         || {},
        results:          raw.results          || {},
        teamDirectScores: raw.teamDirectScores || {},
        teamPenalties:    raw.teamPenalties    || {}
      };
      render();
    }, err => {
      document.getElementById('app').innerHTML = `
        <div class="min-h-screen bg-gray-950 flex items-center justify-center">
          <div class="text-center">
            <i class="fas fa-wifi text-4xl text-red-500/50 mb-4"></i>
            <h2 class="text-xl font-bold text-white/50 mb-2">Connection Error</h2>
            <p class="text-white/25 text-sm mb-6">Unable to connect to the database.</p>
            <button onclick="location.reload()" class="px-6 py-2.5 bg-white/10 text-white/60 rounded-xl font-bold text-sm hover:bg-white/15 transition-colors">Retry</button>
          </div>
        </div>`;
    });
  </script>

</body>
</html>
