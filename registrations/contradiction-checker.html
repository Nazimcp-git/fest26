        // Get participants enrolled in a program based on selected source
        function getProgramParticipants(programId, source = activeSource) {
            const map = new Map(); // studentId -> { studentId, student, teamName, teamId, source }

            // 1. Participant Registrations (Rosters)
            if (source === 'participants' || source === 'unified') {
                const progRegs = appData.participantRegistrations?.[programId] || {};
                if (typeof progRegs === 'object' && progRegs !== null) {
                    Object.entries(progRegs).forEach(([teamId, sIds]) => {
                        if (Array.isArray(sIds)) {
                            sIds.forEach(sid => {
                                if (sid && !map.has(sid)) {
                                    const student = appData.students?.[sid] || { name: 'Unknown', chestNo: 'N/A' };
                                    const team = appData.teams?.[teamId] || appData.teams?.[student.teamId];
                                    map.set(sid, {
                                        studentId: sid,
                                        student,
                                        teamName: team?.name || 'Unknown',
                                        teamId: student.teamId || teamId,
                                        source: 'Participant Roster'
                                    });
                                }
                            });
                        }
                    });
                }
            }

            // 2. Item Registrations (if chosen)
            if (source === 'items' || source === 'unified') {
                const itemRegs = Object.values(appData.registrations || {});
                itemRegs.filter(r => r.programId === programId).forEach(r => {
                    const sid = r.studentId;
                    if (sid && !map.has(sid)) {
                        const student = appData.students?.[sid] || { name: r.studentName || 'Unknown', chestNo: 'N/A' };
                        map.set(sid, {
                            studentId: sid,
                            student,
                            teamName: r.teamName || appData.teams?.[student.teamId]?.name || 'Unknown',
                            teamId: student.teamId,
                            source: 'Item Registration'
                        });
                    }
                });
            }

            return Array.from(map.values()).sort((a, b) => {
                const chestA = parseInt(a.student.chestNo) || 0;
                const chestB = parseInt(b.student.chestNo) || 0;
                if (chestA !== chestB) return chestA - chestB;
                return (a.student.name || '').localeCompare(b.student.name || '');
            });
        }

        // Build a global map of studentId -> array of programIds enrolled
        function buildStudentProgramMap(source = activeSource) {
            const studentProgMap = new Map(); // studentId -> Set of programIds

            function addEntry(studentId, programId) {
                if (!studentId || !programId) return;
                if (!studentProgMap.has(studentId)) {
                    studentProgMap.set(studentId, new Set());
                }
                studentProgMap.get(studentId).add(programId);
            }

            if (source === 'participants' || source === 'unified') {
                for (const [pid, teams] of Object.entries(appData.participantRegistrations || {})) {
                    if (typeof teams === 'object' && teams !== null) {
                        for (const [tid, sids] of Object.entries(teams)) {
                            if (Array.isArray(sids)) {
                                sids.forEach(sid => addEntry(sid, pid));
                            }
                        }
                    }
                }
            }

            if (source === 'items' || source === 'unified') {
                for (const reg of Object.values(appData.registrations || {})) {
                    if (reg && reg.studentId && reg.programId) {
                        addEntry(reg.studentId, reg.programId);
                    }
                }
            }

            return studentProgMap;
        }

                try {
                    currentUser = JSON.parse(storedUser);
                } catch(e) {
                    currentUser = null;
                }
            }
            return currentUser && currentUser.type === 'admin';

            const allPrograms = Object.entries(appData.programs || {}).map(([id, p]) => ({ id, ...p }));
            
            // Filter programs for the selector
            const filteredPrograms = allPrograms.filter(p => {
                if (compareCategoryFilter !== 'ALL' && p.category !== compareCategoryFilter) return false;
                if (compareStageFilter !== 'ALL') {
                    const isStage = String(p.stageType || '').toLowerCase() === 'stage';

            const studentProgMap = buildStudentProgramMap(activeSource);

            // Compile list of students with >= 2 programs

            studentProgMap.forEach((pidsSet, sid) => {

                    const progList = Array.from(pidsSet).map(pid => ({ id: pid, ...(allPrograms[pid] || { name: 'Unknown' }) }));
                    
                    // Count stage programs
                    const stageCount = progList.filter(p => String(p.stageType || '').toLowerCase() === 'stage').length;

                    clashList.push({
                        studentId: sid,
                        student,
                        teamName,
                        teamId: student.teamId,
                        programs: progList,
                        programCount: progList.length,
                        stageCount,
                        isStageClash: stageCount >= 2
                    });
                }
            });

            // Filter clashList

                if (autoTeamFilter !== 'ALL' && item.teamName !== autoTeamFilter) return false;
                if (autoSeverityFilter === 'STAGE_CLASH' && !item.isStageClash) return false;
                if (autoSeverityFilter === 'HEAVY_LOAD' && item.programCount < 4) return false;
                if (autoCategoryFilter !== 'ALL') {
                    const hasCategory = item.programs.some(p => p.category === autoCategoryFilter);
                    if (!hasCategory) return false;
                }
                if (autoSearchQuery) {
                    const q = autoSearchQuery.toLowerCase();
                    const name = (item.student.name || '').toLowerCase();
                    const chest = String(item.student.chestNo || '').toLowerCase();
                    if (!name.includes(q) && !chest.includes(q)) return false;
                }
                return true;
            }).sort((a, b) => {
                // Prioritize stage clashes, then by program count
                if (a.isStageClash !== b.isStageClash) return a.isStageClash ? -1 : 1;
                return b.programCount - a.programCount;
            });

            const totalStageClashes = clashList.filter(c => c.isStageClash).length;
            const totalCandidatesInClashes = clashList.length;

                        <span class="text-xs text-red-600 font-medium">Registered in 2+ On-Stage items (Schedule Risk)</span>
                    </div>

                    <div class="bg-white/70 backdrop-blur-xl border border-white/60 p-5 rounded-3xl shadow-sm">
                        <span class="text-xs font-bold text-gray-400 uppercase tracking-wider">Filtered Matches</span>
                        <div class="text-3xl font-black text-orange-600 mt-1">${filteredClashes.length}</div>
                        <span class="text-xs text-gray-500 font-medium">Currently displayed in report</span>
                    </div>
                </div>

                <!-- Clashes List -->
                <div class="bg-white/70 backdrop-blur-xl border border-white/60 p-6 rounded-3xl shadow-lg space-y-4">
                    <div class="flex items-center justify-between pb-3 border-b border-gray-100">
                        <h3 class="text-lg font-bold text-gray-900 flex items-center gap-2">
                            <i class="fas fa-list-check text-orange-500"></i>
                            Candidate Clash Inventory (${filteredClashes.length})
                        </h3>
                        <span class="text-xs text-gray-400">Sorted by critical clash severity</span>
                    </div>

                    <div class="space-y-3">
                        ${filteredClashes.length === 0 ? `
                            <div class="py-12 text-center text-sm text-gray-400">No candidates match the active filters.</div>
                        ` : filteredClashes.map(item => `
                            <div class="p-4 rounded-2xl bg-white/80 border ${item.isStageClash ? 'border-red-300 bg-red-50/30' : 'border-gray-200/80'} shadow-2xs hover:shadow-sm transition-all">
                                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-3 border-b border-gray-100">
                                    <div class="flex items-center gap-3">
                                        <div class="w-10 h-10 rounded-2xl ${item.isStageClash ? 'bg-red-500 text-white shadow-md shadow-red-500/20' : 'bg-orange-100 text-orange-600'} flex items-center justify-center font-black text-xs flex-shrink-0">
                                            #${item.student.chestNo || 'N/A'}
                                        </div>
                                        <div>
                                            <div class="flex items-center gap-2">
                                                <h4 class="font-black text-gray-900 text-base">${item.student.name || 'Unknown'}</h4>
                                                ${getTeamBadge(item.teamName)}
                                            </div>
                                            <span class="text-xs text-gray-500">Class: ${item.student.className || 'N/A'} &bull; Category: ${item.student.category || 'N/A'}</span>
                                        </div>
                                    </div>

                                    <div class="flex flex-wrap items-center gap-2">
                                        ${item.isStageClash ? `
                                            <span class="px-2.5 py-1 rounded-xl text-xs font-black bg-red-100 text-red-700 border border-red-200 flex items-center gap-1.5 animate-pulse">
                                                <i class="fas fa-exclamation-triangle"></i> Stage Conflict (${item.stageCount} Stage Items)
                                            </span>
                                        ` : ''}
                                        <span class="px-2.5 py-1 rounded-xl text-xs font-black bg-orange-100 text-orange-800 border border-orange-200">
                                            ${item.programCount} Programs Total
                                        </span>
                                        <button onclick="inspectStudent('${item.studentId}')" class="px-3 py-1 rounded-xl text-xs font-bold text-gray-600 bg-gray-100 hover:bg-gray-200 transition-colors cursor-pointer" title="Inspect full student record">
                                            <i class="fas fa-eye mr-1"></i> Inspect
                                        </button>
                                    </div>
                                </div>

                                <!-- Program Badges -->
                                <div class="pt-3">
                                    <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider block mb-1.5">Registered In:</span>
                                    <div class="flex flex-wrap gap-2">
                                        ${item.programs.map(p => `
                                            <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-xl text-xs font-bold ${
                                                String(p.stageType || '').toLowerCase() === 'stage' 
                                                    ? 'bg-purple-50 text-purple-800 border border-purple-200' 
                                                    : 'bg-gray-50 text-gray-700 border border-gray-200'
                                            }">
                                                <i class="fas ${String(p.stageType || '').toLowerCase() === 'stage' ? 'fa-theater-masks text-purple-500' : 'fa-file-alt text-gray-400'} text-[10px]"></i>
                                                ${p.name}
                                                <span class="text-[10px] opacity-70">(${p.category})</span>
                                            </span>
                                        `).join('')}
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            </div>
            `;
        }

        // ==========================================
        // TAB 3: PAIRWISE COLLISION MATRIX
        // ==========================================
        function renderCollisionMatrixTab() {
            const studentProgMap = buildStudentProgramMap(activeSource);
            const allPrograms = appData.programs || {};

            // Calculate overlap between all program pairs
            const pairMap = new Map(); // "pidA|pidB" -> count

            studentProgMap.forEach((pidsSet) => {
                const arr = Array.from(pidsSet);
                for (let i = 0; i < arr.length; i++) {
                    for (let j = i + 1; j < arr.length; j++) {
                        const pidA = arr[i] < arr[j] ? arr[i] : arr[j];
                        const pidB = arr[i] < arr[j] ? arr[j] : arr[i];
                        const key = `${pidA}|${pidB}`;
                        pairMap.set(key, (pairMap.get(key) || 0) + 1);
                    }
                }
            });

            // Convert to array and sort descending
            const collisionPairs = Array.from(pairMap.entries())
                .map(([key, count]) => {
                    const [pidA, pidB] = key.split('|');
                    return {
                        pidA,
                        pidB,
                        progA: allPrograms[pidA] || { name: 'Unknown' },
                        progB: allPrograms[pidB] || { name: 'Unknown' },
                        count
                    };
                })
                .sort((a, b) => b.count - a.count)
                .slice(0, 50); // top 50 pairs

            return `
            <div class="space-y-6">
                <div class="bg-white/70 backdrop-blur-xl border border-white/60 p-6 rounded-3xl shadow-lg no-print">
                    <div class="flex items-center justify-between">
                        <div>
                            <h2 class="text-xl font-bold text-gray-900 flex items-center gap-2">
                                <i class="fas fa-table-cells text-orange-500"></i>
                                Program Collision Ranking (Top Overlapping Pairs)
                            </h2>
                            <p class="text-xs text-gray-500 mt-0.5">
                                Identifies the program pairs that share the highest number of common students. Crucial for scheduling committees to avoid timetable clashes!
                            </p>
                        </div>
                    </div>
                </div>

                <div class="bg-white/70 backdrop-blur-xl border border-white/60 p-6 rounded-3xl shadow-lg space-y-3">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        ${collisionPairs.length === 0 ? `
                            <div class="col-span-2 py-12 text-center text-sm text-gray-400">No program collisions found.</div>
                        ` : collisionPairs.map(item => `
                            <div class="p-4 rounded-2xl bg-white/80 border border-gray-200/80 shadow-2xs hover:shadow-md transition-all flex flex-col justify-between">
                                <div class="flex items-center justify-between gap-3 mb-3">
                                    <span class="px-2.5 py-1 rounded-xl text-xs font-black ${
                                        item.count >= 4 ? 'bg-red-100 text-red-700 border border-red-200' : 'bg-orange-100 text-orange-700 border border-orange-200'
                                    }">
                                        ${item.count} Shared Candidate${item.count > 1 ? 's' : ''}
                                    </span>
                                    <button onclick="comparePair('${item.pidA}', '${item.pidB}')" class="px-3 py-1 rounded-xl text-xs font-bold text-orange-600 bg-orange-50 hover:bg-orange-100 border border-orange-200 transition-colors flex items-center gap-1 cursor-pointer" title="Directly compare these two programs">
                                        <i class="fas fa-code-compare"></i> Compare Roster
                                    </button>
                                </div>

                                <div class="grid grid-cols-2 gap-3 p-3 bg-gray-50/80 rounded-xl border border-gray-100">
                                    <div>
                                        <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider block mb-0.5">Program 1</span>
                                        <h5 class="font-bold text-gray-900 text-xs truncate" title="${item.progA.name}">${item.progA.name}</h5>
                                        <div class="flex items-center gap-1 mt-1">
                                            <span class="text-[10px] text-gray-500">${item.progA.category}</span>
                                            ${getStageBadge(item.progA.stageType)}
                                        </div>
                                    </div>
                                    <div>
                                        <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider block mb-0.5">Program 2</span>
                                        <h5 class="font-bold text-gray-900 text-xs truncate" title="${item.progB.name}">${item.progB.name}</h5>
                                        <div class="flex items-center gap-1 mt-1">
                                            <span class="text-[10px] text-gray-500">${item.progB.category}</span>
                                            ${getStageBadge(item.progB.stageType)}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            </div>
            `;
        }

        // ==========================================
        // TAB 4: CANDIDATE INSPECTOR
        // ==========================================
        function renderInspectorTab() {
            const allStudents = Object.entries(appData.students || {}).map(([id, s]) => ({ id, ...s }));
            const studentProgMap = buildStudentProgramMap(activeSource);
            const allPrograms = appData.programs || {};

            let matchingStudents = [];
            if (inspectorSearchQuery) {
                const q = inspectorSearchQuery.toLowerCase();
                matchingStudents = allStudents.filter(s => {
                    const name = (s.name || '').toLowerCase();
                    const chest = String(s.chestNo || '').toLowerCase();
                    return name.includes(q) || chest.includes(q);
                }).slice(0, 10);
            }

            const targetStudentId = inspectorSelectedStudentId || (matchingStudents[0]?.id);
            const targetStudent = targetStudentId ? appData.students?.[targetStudentId] : null;
            const targetTeam = targetStudent ? appData.teams?.[targetStudent.teamId] : null;
            const enrolledProgIds = targetStudentId ? Array.from(studentProgMap.get(targetStudentId) || []) : [];
            const enrolledPrograms = enrolledProgIds.map(pid => ({ id: pid, ...(allPrograms[pid] || { name: 'Unknown' }) }));
            const stageProgramsCount = enrolledPrograms.filter(p => String(p.stageType || '').toLowerCase() === 'stage').length;

            return `
            <div class="space-y-6">
                <!-- Search Student Input -->
                <div class="bg-white/70 backdrop-blur-xl border border-white/60 p-6 rounded-3xl shadow-lg no-print">
                    <h2 class="text-xl font-bold text-gray-900 flex items-center gap-2 mb-2">
                        <i class="fas fa-id-card text-orange-500"></i>
                        Candidate Profile & Registration Inspector
                    </h2>
                    <p class="text-xs text-gray-500 mb-4">
                        Look up any student by Chest Number or Name to inspect their full program portfolio and identify if they have duplicate or clashing events.
                    </p>

                    <div class="relative max-w-xl">
                        <i class="fas fa-search absolute left-4 top-3.5 text-gray-400 text-sm"></i>
                        <input type="text" placeholder="Type candidate name or chest number (e.g. 169 or ABAN)..." 
                            value="${inspectorSearchQuery}" oninput="setInspectorSearch(this.value)"
                            class="w-full pl-10 pr-4 py-3 bg-white/90 border border-gray-200 rounded-2xl text-sm font-bold text-gray-900 focus:outline-none focus:ring-2 focus:ring-orange-500 shadow-sm">
                    </div>

                    <!-- Autocomplete Matches -->
                    ${matchingStudents.length > 0 ? `
                        <div class="mt-3 flex flex-wrap gap-2">
                            ${matchingStudents.map(s => `
                                <button onclick="selectInspectorStudent('${s.id}')" class="px-3 py-1.5 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5 cursor-pointer ${
                                    s.id === targetStudentId 
                                        ? 'bg-orange-500 text-white shadow-sm' 
                                        : 'bg-white text-gray-700 hover:bg-orange-50 hover:text-orange-600 border border-gray-200'
                                }">
                                    <span>#${s.chestNo || 'N/A'}</span>
                                    <span>${s.name}</span>
                                    <span class="text-[10px] opacity-75">(${appData.teams?.[s.teamId]?.name || 'N/A'})</span>
                                </button>
                            `).join('')}
                        </div>
                    ` : ''}
                </div>

                <!-- Inspector Card -->
                ${targetStudent ? `
                    <div class="bg-white/70 backdrop-blur-xl border border-white/60 p-6 rounded-3xl shadow-lg space-y-6">
                        <!-- Profile Header -->
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-gray-100">
                            <div class="flex items-center gap-4">
                                <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-orange-500 to-amber-500 text-white flex items-center justify-center font-black text-lg shadow-md shadow-orange-500/20">
                                    #${targetStudent.chestNo || 'N/A'}
                                </div>
                                <div>
                                    <div class="flex items-center gap-2">
                                        <h3 class="text-2xl font-black text-gray-900">${targetStudent.name || 'Unknown'}</h3>
                                        ${getTeamBadge(targetTeam?.name)}
                                    </div>
                                    <p class="text-xs text-gray-500 mt-0.5">
                                        Category: <strong class="text-gray-700">${targetStudent.category || 'N/A'}</strong> &bull; 
                                        Class: <strong class="text-gray-700">${targetStudent.className || 'N/A'}</strong>
                                    </p>
                                </div>
                            </div>

                            <div class="flex items-center gap-2">
                                ${stageProgramsCount >= 2 ? `
                                    <span class="px-3 py-1.5 rounded-xl text-xs font-black bg-red-100 text-red-700 border border-red-200 flex items-center gap-1.5">
                                        <i class="fas fa-exclamation-triangle"></i> Stage Conflict Risk
                                    </span>
                                ` : ''}
                                <span class="px-3 py-1.5 rounded-xl text-xs font-black bg-orange-100 text-orange-800 border border-orange-200">
                                    ${enrolledPrograms.length} Registered Events
                                </span>
                            </div>
                        </div>

                        <!-- Enrolled Programs List -->
                        <div>
                            <h4 class="text-sm font-bold text-gray-800 mb-3 flex items-center gap-2">
                                <i class="fas fa-list-ol text-orange-500"></i>
                                Registered Programs (${enrolledPrograms.length})
                            </h4>
                            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                                ${enrolledPrograms.length === 0 ? `
                                    <div class="col-span-3 py-8 text-center text-xs text-gray-400">Candidate is not registered in any program.</div>
                                ` : enrolledPrograms.map((p, idx) => `
                                    <div class="p-3.5 rounded-2xl bg-white/90 border border-gray-200/80 shadow-2xs flex flex-col justify-between">
                                        <div>
                                            <div class="flex items-center justify-between gap-2 mb-1.5">
                                                <span class="text-[10px] font-black text-gray-400">#${idx + 1}</span>
                                                ${getStageBadge(p.stageType)}
                                            </div>
                                            <h5 class="font-black text-gray-900 text-sm truncate" title="${p.name}">${p.name}</h5>
                                        </div>
                                        <div class="mt-2 pt-2 border-t border-gray-100 flex items-center justify-between text-xs text-gray-500">
                                            <span>Category: <strong class="text-gray-700">${p.category}</strong></span>
                                            <span class="text-[10px] text-gray-400 font-medium">${p.registrationType || 'individual'}</span>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                ` : `
                    <div class="bg-white/60 backdrop-blur-xl border border-white/60 p-12 rounded-3xl shadow-lg text-center">
                        <i class="fas fa-user-search text-3xl text-gray-300 mb-3"></i>
                        <p class="text-sm font-bold text-gray-500">Search for a candidate above to view their details.</p>
                    </div>
                `}
            </div>
            `;
        }

        // --- RENDER APP ---
        function renderApp() {
            const appEl = document.getElementById('app');
            if (!checkAuth()) {
                appEl.innerHTML = renderLoginGate();
            } else {
                appEl.innerHTML = AppShell(renderDashboard());
            }
            dismissLoader();
        }

        // --- GLOBAL EXPOSED ACTIONS ---
        window.setActiveTab = function(tab) {
            activeTab = tab;
            renderApp();
        };

        window.setDataSource = function(src) {
            activeSource = src;
            renderApp();
        };

        window.toggleProgramSelection = function(progId) {
            if (selectedProgramIds.includes(progId)) {
                selectedProgramIds = selectedProgramIds.filter(id => id !== progId);
            } else {
                selectedProgramIds.push(progId);
            }
            renderApp();
        };

        window.clearSelectedPrograms = function() {
            selectedProgramIds = [];
            renderApp();
        };

        window.setCompareCategory = function(cat) {
            compareCategoryFilter = cat;
            renderApp();
        };

        window.setCompareStage = function(stage) {
            compareStageFilter = stage;
            renderApp();
        };

        window.setCompareSearch = function(q) {
            compareSearchQuery = q || '';
            renderApp();
        };

        window.setAutoTeam = function(team) {
            autoTeamFilter = team;
            renderApp();
        };

        window.setAutoSeverity = function(sev) {
            autoSeverityFilter = sev;
            renderApp();
        };

        window.setAutoCategory = function(cat) {
            autoCategoryFilter = cat;
            renderApp();
        };

        window.setAutoSearch = function(q) {
            autoSearchQuery = q || '';
            renderApp();
        };

        window.setInspectorSearch = function(q) {
            inspectorSearchQuery = q || '';
            renderApp();
        };

        window.selectInspectorStudent = function(sid) {
            inspectorSelectedStudentId = sid;
            renderApp();
        };

        window.inspectStudent = function(sid) {
            inspectorSelectedStudentId = sid;
            activeTab = 'inspector';
            renderApp();
        };

        window.comparePair = function(pidA, pidB) {
            selectedProgramIds = [pidA, pidB];
            activeTab = 'compare';
            renderApp();
        };

        window.exportClashesCSV = function() {
            const studentProgMap = buildStudentProgramMap(activeSource);
            const allPrograms = appData.programs || {};
            let rows = [["Chest No", "Student Name", "Team", "Category", "Total Programs", "Stage Programs", "Programs List"]];

            studentProgMap.forEach((pidsSet, sid) => {
                if (pidsSet.size >= 2) {
                    const student = appData.students?.[sid] || { name: 'Unknown', chestNo: 'N/A' };
                    const team = appData.teams?.[student.teamId];
                    const progList = Array.from(pidsSet).map(pid => allPrograms[pid]?.name || 'Unknown');
                    const stageCount = Array.from(pidsSet).filter(pid => String(allPrograms[pid]?.stageType || '').toLowerCase() === 'stage').length;
                    
                    rows.push([
                        `"${student.chestNo || 'N/A'}"`,
                        `"${student.name || 'Unknown'}"`,
                        `"${team?.name || 'Unknown'}"`,
                        `"${student.category || 'N/A'}"`,
                        pidsSet.size,
                        stageCount,
                        `"${progList.join('; ')}"`
                    ]);
                }
            });

            const csvContent = "data:text/csv;charset=utf-8," + rows.map(e => e.join(",")).join("\n");
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `Alert2k26_Contradictions_${Date.now()}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        // --- EVENT HANDLERS ---
        document.addEventListener('submit', async (e) => {
            if (e.target.id === 'admin-login-form') {
                e.preventDefault();
                const input = document.getElementById('admin-passcode-input');
                const errorEl = document.getElementById('admin-login-error');
                const code = (input.value || '').trim().toUpperCase();

                try {
                    const codeHash = await SecurityEngine.hashPasscode(code);
                    const user = ACCESS_CODE_HASHES[codeHash];
                    if (user && user.type === 'admin') {
                        currentUser = user;
                        sessionStorage.setItem('user', JSON.stringify(user));
                        renderApp();
                    } else {
                        errorEl.textContent = "Invalid Admin passcode or PIN.";
                    }
                } catch(err) {
                    errorEl.textContent = "Authentication error: " + err.message;
                }
            }
        });

        document.addEventListener('click', (e) => {
            if (e.target.closest('#logout-btn')) {
                currentUser = null;
                sessionStorage.removeItem('user');
                renderApp();
            }
        });

        // --- FIREBASE SYNC & INITIALIZATION ---
        function init() {
            // Check session
            const storedUser = sessionStorage.getItem('user');
            if (storedUser) {
                try {
                    currentUser = JSON.parse(storedUser);
                } catch(e) {}
            }

            // Realtime DB Sync
            db.ref().on('value', snapshot => {
                const data = snapshot.val() || {};
                appData = {
                    students: data.students || {},
                    teams: data.teams || {},
                    programs: data.programs || {},
                    participantRegistrations: data.participantRegistrations || {},
                    registrations: data.registrations || {}
                };

                // Protect active inputs from clobbering
                const activeEl = document.activeElement;
                if (activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'SELECT')) {
                    return;
                }

                renderApp();
            }, err => {
                console.error("Firebase sync error:", err);
                dismissLoader();
            });
        }

        init();
    </script>
</body>
</html>
