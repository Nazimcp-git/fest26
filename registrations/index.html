<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Hub - PORU 2K25</title>
    <!-- Fonts & Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Toggle Switch Styles */
        .toggle-checkbox:checked { right: 0; border-color: #f97316; }
        .toggle-checkbox:checked + .toggle-label { background-color: #f97316; }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    animation: {
                        'fade-in': 'fadeIn 0.2s ease-out forwards',
                        'blob': 'blob 7s infinite alternate ease-in-out',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(4px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' }
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#f5f3ef] font-sans text-gray-800 antialiased selection:bg-orange-200 overflow-y-scroll relative" style="background-image: radial-gradient(at 0% 0%, hsla(28,100%,74%,0.15) 0px, transparent 50%), radial-gradient(at 100% 0%, hsla(189,100%,56%,0.15) 0px, transparent 50%), radial-gradient(at 100% 100%, hsla(355,100%,93%,0.15) 0px, transparent 50%), radial-gradient(at 0% 100%, hsla(340,100%,76%,0.15) 0px, transparent 50%);">

    <!-- Aurora Background -->
    <div class="fixed inset-0 pointer-events-none z-0">
        <div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] rounded-full bg-pink-400/30 mix-blend-multiply filter blur-[120px] animate-blob"></div>
        <div class="absolute top-[-10%] right-[-10%] w-[50%] h-[50%] rounded-full bg-orange-400/30 mix-blend-multiply filter blur-[120px] animate-blob" style="animation-delay: 2s;"></div>
        <div class="absolute bottom-[-20%] left-[20%] w-[50%] h-[50%] rounded-full bg-teal-400/30 mix-blend-multiply filter blur-[120px] animate-blob" style="animation-delay: 4s;"></div>
    </div>

    <div id="app" class="min-h-screen relative z-10"></div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/security.js"></script>

    <script type="module">
        const ACCESS_CODE_HASHES = {
            // 6-Digit Team PINs
            "48290cf691c41cbc99b2396d2e5313ccfba91987b384e6d8f08b951fa5045e83": { type: "team", teamName: "TEAM A" }, // PIN: 482915
            "3b2c2d4629b9403fc17bb4bced473a355883cce7e3e923b08b13a5bbbf3bbc10": { type: "team", teamName: "TEAM B" }, // PIN: 739104
            "1364a68762bb5b4d24d2c207cfc965402b246321dfbbc967ce939496cddba79f": { type: "team", teamName: "TEAM C" }, // PIN: 615829
            "cf43d0df19e76fca2ffd3ff541db9d9f322f55d9c37f202b76c60d58b5847557": { type: "team", teamName: "TEAM D" }, // PIN: 924371
            
            // Admin PINs & Passcodes
            "5dfc92691f7fa0a4f9f8dd9b05b69b1720baad084182c7c4d492cbbab1f23333": { type: "admin" }, // PIN: 850392
            "835d6dc88b708bc646d6db82c853ef4182fabbd4a8de59c213f2b5ab3ae7d9be": { type: "admin" }, // ADMIN
            "64e48f3bf07307f751c02213b95e0b5e1e8351597dfbe12bce5cbf115591ce3f": { type: "admin" }, // ADMIN2026
            "ad0ee11b4ee66abb29207fdb6f105cb2b771cc549e7917b239b4cab56c9bfa5d": { type: "admin" }, // ADMIN2025
            "c5539eb87431e51b1424ed0f0a514d3a8241b9d4df2e923e20023a9d5dd408d6": { type: "admin" },
            "8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918": { type: "admin" }
        };

        let appData = { settings: { portals: { item: false, participant: false } } };
        let currentUser = null;

        const AppShell = (content) => `
            <div class="min-h-screen flex flex-col">
                <nav class="fixed top-4 left-1/2 -translate-x-1/2 w-[calc(100%-2rem)] max-w-6xl bg-white/20 backdrop-blur-3xl backdrop-saturate-[2.5] border-[0.5px] border-white/60 shadow-[0_8px_32px_0_rgba(0,0,0,0.05),inset_0_1px_1px_rgba(255,255,255,0.8)] rounded-[2rem] z-50 transition-all">
                    <div class="px-6">
                        <div class="flex items-center justify-between h-16">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-[1.25rem] bg-orange-500/10 text-orange-600 border border-orange-500/20 flex items-center justify-center">
                                    <i class="fas fa-layer-group text-sm"></i>
                                </div>
                                <span class="font-bold text-gray-900 text-lg tracking-tight">Registration Hub</span>
                            </div>
                            ${currentUser ? `<button id="logout-btn" class="px-4 py-2 rounded-xl text-sm font-bold text-red-600 hover:text-red-700 hover:bg-red-50 transition-colors border border-transparent hover:border-red-100"><i class="fas fa-sign-out-alt mr-1.5"></i>Logout</button>` : ''}
                        </div>
                    </div>
                </nav>
                <main id="main-content" class="flex-grow pt-28 pb-10">
                    <div class="max-w-7xl mx-auto sm:px-6 lg:px-8 px-6 animate-fade-in">
                        ${content}
                    </div>
                </main>
            </div>
        `;

        function renderLoginPage() {
            return `
                <div class="flex items-center justify-center min-h-screen animate-fade-in">
                    <div class="w-full max-w-md p-8 space-y-6 bg-white/60 backdrop-blur-xl border border-white/60 rounded-3xl shadow-[0_8px_32px_0_rgba(0,0,0,0.08)]">
                        <div class="flex flex-col items-center">
                            <div class="w-16 h-16 rounded-2xl bg-orange-500/10 text-orange-600 flex items-center justify-center mb-4">
                                <i class="fas fa-lock text-3xl"></i>
                            </div>
                            <h2 class="text-center text-3xl font-black text-gray-900 tracking-tight">Central Login</h2>
                            <p class="mt-2 text-center text-sm font-medium text-gray-500">Access all registration portals.</p>
                        </div>
                        <form id="login-form" class="mt-8 space-y-6">
                            <div>
                                <input id="access-code-input" type="password" required class="appearance-none block w-full px-4 py-3.5 bg-white/50 border border-white/60 rounded-xl shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-orange-500 focus:bg-white sm:text-sm font-medium transition-all" placeholder="Enter Access Code">
                            </div>
                            <div>
                                <button type="submit" class="w-full flex justify-center py-3.5 px-4 border border-transparent text-sm font-bold rounded-xl text-white bg-gradient-to-r from-orange-500 to-orange-600 hover:from-orange-600 hover:to-orange-700 shadow-md hover:shadow-lg transition-all transform hover:-translate-y-0.5">Secure Login</button>
                            </div>
                            <p id="login-error" class="text-red-500 text-sm mt-2 text-center font-medium"></p>
                        </form>
                    </div>
                </div>
            `;
        }

        function renderHub() {
            const isItemEnabled = appData.settings?.portals?.item;
            const isParticipantEnabled = appData.settings?.portals?.participant;
            const isAdmin = currentUser.type === 'admin';

            let adminControls = '';
            if (isAdmin) {
                adminControls = `
                    <div class="bg-white/60 backdrop-blur-xl border border-white/60 p-6 rounded-3xl shadow-lg mb-8 animate-fade-in">
                        <h2 class="text-2xl font-bold mb-4"><i class="fas fa-sliders-h text-orange-500 mr-2"></i>Portal Access Controls</h2>
                        <p class="text-gray-600 mb-6">Master switches to open or close the registration portals for all teams.</p>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="flex items-center justify-between p-4 bg-white/50 rounded-2xl border border-gray-100 shadow-sm">
                                <div>
                                    <h4 class="font-bold text-gray-800">Item Registration Portal</h4>
                                    <p class="text-xs text-gray-500 mt-1">Allow teams to register items/events.</p>
                                </div>
                                <div class="relative inline-block w-12 h-6 align-middle select-none transition duration-200 ease-in">
                                    <input type="checkbox" name="portal-toggle" data-portal="item" id="toggle-item" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer" ${isItemEnabled ? 'checked' : ''}/>
                                    <label for="toggle-item" class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 cursor-pointer"></label>
                                </div>
                            </div>
                            
                            <div class="flex items-center justify-between p-4 bg-white/50 rounded-2xl border border-gray-100 shadow-sm">
                                <div>
                                    <h4 class="font-bold text-gray-800">Participant Registration Portal</h4>
                                    <p class="text-xs text-gray-500 mt-1">Allow teams to register students to events.</p>
                                </div>
                                <div class="relative inline-block w-12 h-6 align-middle select-none transition duration-200 ease-in">
                                    <input type="checkbox" name="portal-toggle" data-portal="participant" id="toggle-participant" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer" ${isParticipantEnabled ? 'checked' : ''}/>
                                    <label for="toggle-participant" class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 cursor-pointer"></label>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }

            const itemCard = `
                <a href="${(isAdmin || isItemEnabled) ? 'item-registration-portal.html' : '#'}" 
                   class="group relative bg-white/60 backdrop-blur-xl border border-white/60 p-8 rounded-3xl shadow-lg transition-all ${(!isAdmin && !isItemEnabled) ? 'opacity-50 cursor-not-allowed' : 'hover:-translate-y-1 hover:shadow-xl'}">
                    <div class="w-14 h-14 rounded-2xl bg-blue-500/10 text-blue-600 flex items-center justify-center mb-6 group-hover:scale-110 transition-transform">
                        <i class="fas fa-edit text-2xl"></i>
                    </div>
                    <h3 class="text-2xl font-bold text-gray-900 mb-2">Item Registration</h3>
                    <p class="text-gray-600 mb-6">Manage program registrations, limits, and team assignments.</p>
                    
                    ${(!isAdmin && !isItemEnabled) 
                        ? `<span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold bg-red-100 text-red-700"><i class="fas fa-lock mr-1.5"></i> Currently Closed</span>` 
                        : `<span class="text-blue-600 font-bold text-sm flex items-center group-hover:text-blue-700">Enter Portal <i class="fas fa-arrow-right ml-2 transform group-hover:translate-x-1 transition-transform"></i></span>`
                    }
                </a>
            `;

            const participantCard = `
                <a href="${(isAdmin || isParticipantEnabled) ? 'student-participation-registration.html' : '#'}" 
                   class="group relative bg-white/60 backdrop-blur-xl border border-white/60 p-8 rounded-3xl shadow-lg transition-all ${(!isAdmin && !isParticipantEnabled) ? 'opacity-50 cursor-not-allowed' : 'hover:-translate-y-1 hover:shadow-xl'}">
                    <div class="w-14 h-14 rounded-2xl bg-green-500/10 text-green-600 flex items-center justify-center mb-6 group-hover:scale-110 transition-transform">
                        <i class="fas fa-user-plus text-2xl"></i>
                    </div>
                    <h3 class="text-2xl font-bold text-gray-900 mb-2">Participant Registration</h3>
                    <p class="text-gray-600 mb-6">Assign students to their respective events and manage rosters.</p>
                    
                    ${(!isAdmin && !isParticipantEnabled) 
                        ? `<span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold bg-red-100 text-red-700"><i class="fas fa-lock mr-1.5"></i> Currently Closed</span>` 
                        : `<span class="text-green-600 font-bold text-sm flex items-center group-hover:text-green-700">Enter Portal <i class="fas fa-arrow-right ml-2 transform group-hover:translate-x-1 transition-transform"></i></span>`
                    }
                </a>
            `;

            return `
                <header class="mb-8">
                    <h1 class="text-4xl font-black text-gray-900 tracking-tight">Welcome, ${currentUser.type === 'admin' ? 'Admin' : currentUser.teamName}</h1>
                    <p class="mt-2 text-lg text-gray-600 font-medium">Select a portal to continue.</p>
                </header>
                ${adminControls}
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    ${itemCard}
                    ${participantCard}
                </div>
            `;
        }

        function renderApp() {
            const appContainer = document.getElementById('app');
            if (!currentUser) {
                appContainer.innerHTML = renderLoginPage();
            } else {
                appContainer.innerHTML = AppShell(renderHub());
            }
        }

        // --- EVENT LISTENERS ---
        document.addEventListener('submit', async (e) => {
            if (e.target.id === 'login-form') {
                e.preventDefault();
                const input = document.getElementById('access-code-input');
                const errorEl = document.getElementById('login-error');
                const code = input.value.trim().toUpperCase();
                
                const codeHash = await SecurityEngine.hashPasscode(code);
                const user = ACCESS_CODE_HASHES[codeHash];
                if (user) {
                    currentUser = user;
                    sessionStorage.setItem('user', JSON.stringify(user));
                    renderApp();
                } else {
                    errorEl.textContent = "Invalid access code.";
                }
            }
        });

        document.addEventListener('click', (e) => {
            if (e.target.id === 'logout-btn') {
                currentUser = null;
                sessionStorage.removeItem('user');
                renderApp();
            }
        });

        document.addEventListener('change', e => {
            if (e.target.matches('.toggle-checkbox[name="portal-toggle"]')) {
                const portal = e.target.dataset.portal;
                const isEnabled = e.target.checked;
                db.ref(`settings/portals/${portal}`).set(isEnabled);
            }
        });

        // --- INITIALIZATION ---
        function initializeApp() {
            const storedUser = sessionStorage.getItem('user');
            if (storedUser) {
                currentUser = JSON.parse(storedUser);
            }

            db.ref('settings/portals').on('value', snapshot => {
                const data = snapshot.val() || {};
                appData.settings.portals = data;
                renderApp();
            });
        }

        initializeApp();
    </script>
</body>
</html>
