<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Program Registration Portal</title>
    <link rel="stylesheet" href="../results/styles/tailwind.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .program-select-btn.active {
            box-shadow: 0 0 0 3px #f97316; /* orange-500 */
            transform: scale(1.02);
            background-color: #fffaf5;
        }

        .admin-tab.active {
            border-color: #f97316;
            color: #f97316;
            background-color: #fffaf5;
        }

        /* Style for the details/summary accordion */
        details>summary {
            list-style: none;
        }

        details>summary::-webkit-details-marker {
            display: none;
        }

        details>summary .icon {
            transition: transform 0.2s;
        }

        details[open]>summary .icon {
            transform: rotate(90deg);
        }

        /* Print Styles */
        @media print {
    body > *:not(#print-area) {
        display: none !important;
    }
    #print-area {
        display: block !important;
    }

    /* This prevents elements like tables or divs from splitting across two pages */
    div, table, h3 {
        page-break-inside: avoid !important;
    }
    
    @page {
        size: A4;
        margin: 0.5cm;
    }
}

        /* Animation for detail view */
        .detail-view {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s ease-in-out;
        }

        .detail-view.visible {
            max-height: 1500px;
            /* Adjust as needed */
        }

        #modal-container.hidden {
            display: none;
        }

        /* Toggle Switch Styles */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #f97316;
        }

        .toggle-checkbox:checked+.toggle-label {
            background-color: #f97316;
        }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        if (typeof tailwind !== 'undefined') {
            tailwind.config = {
                theme: {
                    extend: {
                        fontFamily: { sans: ['Inter', 'sans-serif'] },
                        animation: {
                            'fade-in': 'fadeIn 0.2s ease-out forwards',
                            'blob': 'blob 7s infinite alternate ease-in-out',
                        },
                        keyframes: {
                            fadeIn: {
                                '0%': { opacity: '0', transform: 'translateY(4px)' },
                                '100%': { opacity: '1', transform: 'translateY(0)' },
                            },
                            blob: {
                                '0%': { transform: 'translate(0px, 0px) scale(1)' },
                                '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                                '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                                '100%': { transform: 'translate(0px, 0px) scale(1)' }
                            }
                        }
                    }
                }
            };
        }
    </script>
</head>

<body class="bg-[#f5f3ef] font-sans text-gray-800 antialiased selection:bg-orange-200 overflow-y-scroll relative" style="background-image: radial-gradient(at 0% 0%, hsla(28,100%,74%,0.15) 0px, transparent 50%), radial-gradient(at 100% 0%, hsla(189,100%,56%,0.15) 0px, transparent 50%), radial-gradient(at 100% 100%, hsla(355,100%,93%,0.15) 0px, transparent 50%), radial-gradient(at 0% 100%, hsla(340,100%,76%,0.15) 0px, transparent 50%);">

    <!-- Aurora Background -->
    <div class="fixed inset-0 pointer-events-none z-0">
        <div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] rounded-full bg-pink-400/30 mix-blend-multiply filter blur-[120px] animate-blob"></div>
        <div class="absolute top-[-10%] right-[-10%] w-[50%] h-[50%] rounded-full bg-orange-400/30 mix-blend-multiply filter blur-[120px] animate-blob" style="animation-delay: 2s;"></div>
        <div class="absolute bottom-[-20%] left-[20%] w-[50%] h-[50%] rounded-full bg-teal-400/30 mix-blend-multiply filter blur-[120px] animate-blob" style="animation-delay: 4s;"></div>
    </div>

    <div id="app" class="min-h-screen relative z-10">
    </div>

    <div id="print-area" class="hidden"></div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/security.js"></script>

    <script type="module">
        // --- TEAM & ADMIN PASSWORDS (HASHED FOR SECURITY) ---
       const ACCESS_CODE_HASHES = {
            // 6-Digit Team PINs
            "48290cf691c41cbc99b2396d2e5313ccfba91987b384e6d8f08b951fa5045e83": { type: "team", teamName: "LIBERA" }, // PIN: 482915
            "3b2c2d4629b9403fc17bb4bced473a355883cce7e3e923b08b13a5bbbf3bbc10": { type: "team", teamName: "RELETIA" }, // PIN: 739104
            "1364a68762bb5b4d24d2c207cfc965402b246321dfbbc967ce939496cddba79f": { type: "team", teamName: "OPERA" }, // PIN: 615829
            "cf43d0df19e76fca2ffd3ff541db9d9f322f55d9c37f202b76c60d58b5847557": { type: "team", teamName: "ALETHEIA" }, // PIN: 924371
            
            // Admin PINs & Passcodes
            "5dfc92691f7fa0a4f9f8dd9b05b69b1720baad084182c7c4d492cbbab1f23333": { type: "admin" }, // PIN: 850392
            "64e48f3bf07307f751c02213b95e0b5e1e8351597dfbe12bce5cbf115591ce3f": { type: "admin" } // ADMIN2026
        };

        // --- APPLICATION STATE ---
        let appData = { students: {}, teams: {}, programs: {}, registrationProgramss: {}, registrations: {} };
        let currentUser = null;
        let selectedProgramId = null;
        let selectedCategory = null;
        let activeAdminTab = 'overview';

        // --- UI COMPONENTS & TEMPLATES ---
        const AppShell = (content) => `
        <div class="min-h-screen flex flex-col">
            <nav class="fixed top-4 left-1/2 -translate-x-1/2 w-[calc(100%-2rem)] max-w-6xl bg-white/20 backdrop-blur-3xl backdrop-saturate-[2.5] border-[0.5px] border-white/60 shadow-[0_8px_32px_0_rgba(0,0,0,0.05),inset_0_1px_1px_rgba(255,255,255,0.8)] rounded-[2rem] z-50 transition-all">
                <div class="px-6">
                    <div class="flex items-center justify-between h-16">
                        <div class="flex items-center gap-3">
                            <a href="index.html" class="w-10 h-10 rounded-[1.25rem] bg-gray-500/10 text-gray-600 hover:text-gray-900 hover:bg-white/50 border border-transparent hover:border-white/60 flex items-center justify-center transition-all">
                                <i class="fas fa-arrow-left text-sm"></i>
                            </a>
                            <div class="w-10 h-10 rounded-[1.25rem] bg-orange-500/10 text-orange-600 border border-orange-500/20 flex items-center justify-center ml-2">
                                <i class="fas fa-edit text-sm"></i>
                            </div>
                            <span class="font-bold text-gray-900 text-lg tracking-tight hidden sm:block">Item Registration</span>
                        </div>
                        ${currentUser ? `<button id="logout-btn" class="px-4 py-2 rounded-xl text-sm font-bold text-red-600 hover:text-red-700 hover:bg-red-50 transition-colors border border-transparent hover:border-red-100"><i class="fas fa-sign-out-alt mr-1.5"></i>Logout</button>` : ''}
                    </div>
                </div>
            </nav>
            <main id="main-content" class="flex-grow pt-28 pb-10">
                <div class="max-w-7xl mx-auto sm:px-6 lg:px-8 px-6 animate-fade-in">
                    ${content}
                </div>
            </main>
            <div id="modal-container" class="hidden"></div>
        </div>
    `;

        // --- HELPER FUNCTIONS ---
        function getDataAsArray(entity) {
            if (!appData[entity]) return [];
            return Object.entries(appData[entity]).map(([id, value]) => ({ id, ...value }));
        }

        // --- RENDER FUNCTIONS ---
        // ... (All your existing render functions like renderApp, renderLoginPage, etc. remain here unchanged) ...
        function renderApp() {
            const appContainer = document.getElementById('app');

            let content = '';
            if (currentUser.type === 'admin') {
                content = renderAdminPortal();
            } else if (currentUser.type === 'team') {
                content = renderTeamPortal();
            }
            appContainer.innerHTML = AppShell(content);
        }

        function renderLoginPage() {
            return `
            <div class="flex items-center justify-center min-h-screen animate-fade-in">
                <div class="w-full max-w-md p-8 space-y-6 bg-white/60 backdrop-blur-xl border border-white/60 rounded-3xl shadow-[0_8px_32px_0_rgba(0,0,0,0.08)]">
                    <div class="flex flex-col items-center">
                        <div class="w-16 h-16 rounded-2xl bg-orange-500/10 text-orange-600 flex items-center justify-center mb-4">
                            <i class="fas fa-edit text-3xl"></i>
                        </div>
                        <h2 class="text-center text-3xl font-black text-gray-900 tracking-tight">Item Registration</h2>
                        <p class="mt-2 text-center text-sm font-medium text-gray-500">Enter your access code to continue.</p>
                    </div>
                    <form id="login-form" class="mt-8 space-y-6">
                        <div>
                            <input id="access-code-input" type="password" required class="appearance-none block w-full px-4 py-3.5 bg-white/50 border border-white/60 rounded-xl shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-orange-500 focus:bg-white sm:text-sm font-medium transition-all" placeholder="Access Code">
                        </div>
                        <div>
                            <button type="submit" class="w-full flex justify-center py-3.5 px-4 border border-transparent text-sm font-bold rounded-xl text-white bg-gradient-to-r from-orange-500 to-orange-600 hover:from-orange-600 hover:to-orange-700 shadow-md hover:shadow-lg transition-all transform hover:-translate-y-0.5">Login</button>
                        </div>
                        <p id="login-error" class="text-red-500 text-sm mt-2 text-center font-medium"></p>
                    </form>
                </div>
            </div>
        `;
        }

        function renderAdminPortal() {
            let content = '';
            switch (activeAdminTab) {
                case 'overview':
                    content = renderAdminOverview();
                    break;
                case 'settings':
                    content = renderAdminSettings();
                    break;
            }
            return `
            <div>
                <header class="mb-8">
                    <h1 class="text-4xl font-bold text-gray-900">Admin Panel</h1>
                    <p class="mt-2 text-lg text-gray-600">Manage programs and monitor registration progress.</p>
                </header>
                <div class="border-b border-gray-200 mb-6">
                    <nav id="admin-tabs" class="-mb-px flex space-x-8" aria-label="Tabs">
                        <button data-tab="overview" class="admin-tab whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm ${activeAdminTab === 'overview' ? 'active' : ''}">Overview</button>
                        <button data-tab="settings" class="admin-tab whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm ${activeAdminTab === 'settings' ? 'active' : ''}">Settings</button>
                    </nav>
                </div>
                <main>
                   ${content}
                </main>
            </div>
        `;
        }

        function renderAdminSummary() {
            const teams = getDataAsArray('teams');
            const activeProgramIds = Object.keys(appData.registrationProgramss || {});
            const allActivePrograms = getDataAsArray('programs').filter(p => activeProgramIds.includes(p.id));
            const totalActivePrograms = allActivePrograms.length;
            const allRegistrations = getDataAsArray('registrations');

            if (totalActivePrograms === 0) {
                return `
                <div class="bg-white/60 backdrop-blur-xl border border-white/60 p-6 rounded-3xl shadow-lg mb-8">
                    <h2 class="text-2xl font-bold mb-2">Team Registration Summary</h2>
                    <p class="text-gray-500">No programs are active for registration. Go to Settings to activate them.</p>
                </div>
            `;
            }

            const summaryCards = teams.map(team => {
                const teamActiveRegistrations = allRegistrations.filter(r =>
                    r.teamName === team.name && activeProgramIds.includes(r.programId)
                );
                const registeredProgramIds = new Set(teamActiveRegistrations.map(r => r.programId));

                const registeredCount = registeredProgramIds.size;
                const pendingCount = totalActivePrograms - registeredCount;
                const totalParticipants = teamActiveRegistrations.length;
                const percentage = totalActivePrograms > 0 ? (registeredCount / totalActivePrograms) * 100 : 0;

                const pendingPrograms = allActivePrograms
                    .filter(p => !registeredProgramIds.has(p.id))
                    .map(p => `<li class="text-sm text-gray-600">${p.name} <span class="text-xs text-gray-400">- ${p.category}</span></li>`)
                    .join('');

                const completedPrograms = allActivePrograms
                    .filter(p => registeredProgramIds.has(p.id))
                    .map(p => `<li class="text-sm text-gray-600">${p.name} <span class="text-xs text-gray-400">- ${p.category}</span></li>`)
                    .join('');

                return `
                <div class="bg-white/60 backdrop-blur-xl border border-white/60 p-6 rounded-3xl shadow-lg flex flex-col">
                    <h3 class="text-2xl font-bold text-indigo-700">${team.name}</h3>
                    <div class="border-t border-gray-200 mt-4 pt-4">
                        <div class="grid grid-cols-2 gap-4 text-center">
                            <div>
                                <p class="text-3xl font-bold text-green-600">${registeredCount}</p>
                                <p class="text-sm font-medium text-gray-500 uppercase tracking-wider">Registered</p>
                            </div>
                            <div>
                                <p class="text-3xl font-bold text-red-600">${pendingCount}</p>
                                <p class="text-sm font-medium text-gray-500 uppercase tracking-wider">Pending</p>
                            </div>
                        </div>
                    </div>
                    <div class="mt-4">
                        <div class="w-full bg-gray-200 rounded-full h-5">
                            <div class="bg-indigo-600 h-5 rounded-full text-xs font-medium text-blue-100 text-center p-0.5 leading-none" style="width: ${percentage}%">
                                ${Math.round(percentage)}%
                            </div>
                        </div>
                    </div>
                    <div class="mt-4 border-t border-gray-200 pt-2">
                         <p class="text-center text-sm text-gray-600 font-semibold">Total Participants Registered: ${totalParticipants}</p>
                    </div>
                    <div class="mt-4 flex-grow space-y-2">
                        <details class="bg-gray-50 rounded-lg">
                            <summary class="p-3 cursor-pointer font-semibold text-gray-700 flex justify-between items-center">
                                View Pending Programs (${pendingCount})
                                <i class="fas fa-chevron-right icon"></i>
                            </summary>
                            <div class="p-3 border-t border-gray-200">
                                ${pendingCount > 0 ? `<ul class="list-disc list-inside space-y-1">${pendingPrograms}</ul>` : '<p class="text-sm text-gray-500">No pending programs. Well done!</p>'}
                            </div>
                        </details>
                         <details class="bg-gray-50 rounded-lg">
                            <summary class="p-3 cursor-pointer font-semibold text-gray-700 flex justify-between items-center">
                                View Completed Programs (${registeredCount})
                                <i class="fas fa-chevron-right icon"></i>
                            </summary>
                            <div class="p-3 border-t border-gray-200">
                                ${registeredCount > 0 ? `<ul class="list-disc list-inside space-y-1">${completedPrograms}</ul>` : '<p class="text-sm text-gray-500">No programs registered yet.</p>'}
                            </div>
                        </details>
                    </div>
                </div>
            `;
            }).join('');

            return `
            <div class="mb-8">
                <h2 class="text-3xl font-bold mb-4">Team Registration Summary</h2>
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    ${summaryCards}
                </div>
            </div>
        `;
        }

        function renderAdminOverview() {
            const activeRegProgramIds = Object.keys(appData.registrationProgramss || {});
            const activePrograms = getDataAsArray('programs').filter(p => activeRegProgramIds.includes(p.id)).sort((a, b) => a.name.localeCompare(b.name));
            const allRegistrations = getDataAsArray('registrations');

            return `
            ${renderAdminSummary()} 
            <div class="bg-white/60 backdrop-blur-xl border border-white/60 p-6 sm:p-8 rounded-3xl shadow-lg">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                    <div>
                        <h2 class="text-2xl font-black text-gray-900 tracking-tight">Active Registration Programs</h2>
                        <p class="text-sm font-medium text-gray-500 mt-0.5">Click any program below to view details or manage team registrations in a full-screen popup.</p>
                    </div>
                    <button id="print-all-registrations-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2.5 text-sm font-bold rounded-xl shadow-sm transition-all flex items-center gap-2">
                        <i class="fas fa-print"></i>
                        <span>Print All Registrations</span>
                    </button>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3.5 max-h-[500px] overflow-y-auto p-1">
                    ${activePrograms.length === 0 ? `<div class="col-span-full py-12 text-center text-gray-400 font-medium">No programs are active for registration. Go to Settings to activate them.</div>` :
                    activePrograms.map(p => {
                        const isStage = (p.stageType || 'stage') !== 'non-stage';
                        const regCount = allRegistrations.filter(r => r.programId === p.id).length;
                        return `
                        <button type="button" class="program-select-btn text-left p-4 rounded-2xl bg-white/80 hover:bg-white border border-gray-100 hover:border-orange-300 shadow-sm hover:shadow-md transition-all duration-200 group flex flex-col justify-between" data-program-id="${p.id}">
                            <div>
                                <div class="flex items-center justify-between gap-2 mb-1.5">
                                    <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${isStage ? 'bg-purple-50 text-purple-700 border border-purple-100' : 'bg-amber-50 text-amber-700 border border-amber-100'}">
                                        ${isStage ? 'Stage' : 'Non-Stage'}
                                    </span>
                                    <span class="text-[11px] font-bold text-gray-400 bg-gray-50 px-2 py-0.5 rounded-md">${p.category}</span>
                                </div>
                                <h4 class="font-bold text-gray-900 text-sm group-hover:text-orange-600 transition-colors line-clamp-2">${p.name}</h4>
                            </div>
                            <div class="mt-3 pt-2.5 border-t border-gray-100 flex items-center justify-between text-xs">
                                <span class="text-gray-500 font-medium"><i class="fas fa-users mr-1 text-gray-400"></i>${regCount} Total</span>
                                <span class="text-orange-600 font-bold group-hover:translate-x-0.5 transition-transform">Manage <i class="fas fa-chevron-right text-[10px] ml-0.5"></i></span>
                            </div>
                        </button>
                        `;
                    }).join('')}
                </div>
            </div>
        `;
        }

        function renderAdminSettings() {
            const allPrograms = getDataAsArray('programs').sort((a, b) => a.category.localeCompare(b.category) || a.name.localeCompare(b.name));
            const activeRegProgramIds = Object.keys(appData.registrationProgramss || {});

            return `
            <div class="bg-white/60 backdrop-blur-xl border border-white/60 p-6 rounded-3xl shadow-lg">
                <h2 class="text-2xl font-bold mb-4">Registration Program Settings</h2>
                <p class="text-gray-600 mb-6">Use the toggles to activate or deactivate programs for team registration and set the registration form type.</p>
                <div class="space-y-4">
                    ${allPrograms.map(p => {
                const isActive = activeRegProgramIds.includes(p.id);
                const regType = p.registrationType || 'full';
                return `
                        <div class="flex flex-col md:flex-row justify-between md:items-center bg-gray-50 p-4 rounded-md gap-4">
                            <div>
                                <p class="font-semibold">${p.name}</p>
                                <p class="text-sm text-gray-500">${p.category}</p>
                            </div>
                            <div class="flex items-center gap-4">
                                <div>
                                    <label for="type-select-${p.id}" class="text-sm font-medium text-gray-700">Form Type</label>
                                    <select id="type-select-${p.id}" data-program-id="${p.id}" class="reg-type-select mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-md">
                                        <option value="full" ${regType === 'full' ? 'selected' : ''}>Full</option>
                                        <option value="titleOnly" ${regType === 'titleOnly' ? 'selected' : ''}>Title Only</option>
                                        <option value="titleAndLink" ${regType === 'titleAndLink' ? 'selected' : ''}>Title & Link</option>
                                    </select>
                                </div>
                                 <div class="flex items-center pt-5">
                                    <label for="reg-toggle-${p.id}" class="text-sm font-medium text-gray-700">Registration On</label>
                                    <div class="relative inline-block w-10 ml-2 align-middle select-none transition duration-200 ease-in">
                                        <input type="checkbox" name="reg-toggle" id="reg-toggle-${p.id}" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer"
                                               data-program-id="${p.id}" ${isActive ? 'checked' : ''}/>
                                        <label for="reg-toggle-${p.id}" class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 cursor-pointer"></label>
                                    </div>
                                </div>
                            </div>
                        </div>
                        `
            }).join('')}
                </div>
            </div>
        `;
        }

        function renderTeamSummary(teamName) {
            const activeProgramIds = Object.keys(appData.registrationProgramss || {});
            const totalActivePrograms = activeProgramIds.length;

            if (totalActivePrograms === 0) return '';

            const allRegistrations = getDataAsArray('registrations');

            const teamRegistrations = allRegistrations.filter(r =>
                r.teamName === teamName && activeProgramIds.includes(r.programId)
            );

            const registeredProgramIds = new Set(teamRegistrations.map(r => r.programId));
            const registeredCount = registeredProgramIds.size;
            const pendingCount = totalActivePrograms - registeredCount;

            let stageTotal = 0, stageReg = 0;
            let nonStageTotal = 0, nonStageReg = 0;

            activeProgramIds.forEach(id => {
                const prog = appData.programs[id];
                if (!prog) return;
                const isStage = (prog.stageType || 'stage') !== 'non-stage';
                if (isStage) {
                    stageTotal++;
                    if (registeredProgramIds.has(id)) stageReg++;
                } else {
                    nonStageTotal++;
                    if (registeredProgramIds.has(id)) nonStageReg++;
                }
            });

            return `
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div class="bg-white/60 backdrop-blur-xl border border-white/60 p-6 rounded-2xl shadow-md text-center">
                    <p class="text-4xl font-bold text-gray-800">${totalActivePrograms}</p>
                    <p class="text-sm font-medium text-gray-500 uppercase tracking-wider mb-2">Total Active Programs</p>
                    <div class="flex justify-center gap-2 text-xs font-semibold">
                        <span class="text-purple-700 bg-purple-50 px-2 py-0.5 rounded-full border border-purple-100">Stage: ${stageTotal}</span>
                        <span class="text-amber-700 bg-amber-50 px-2 py-0.5 rounded-full border border-amber-100">Non-Stage: ${nonStageTotal}</span>
                    </div>
                </div>
                <div class="bg-white/60 backdrop-blur-xl border border-white/60 p-6 rounded-2xl shadow-md text-center">
                    <p class="text-4xl font-bold text-green-600">${registeredCount}</p>
                    <p class="text-sm font-medium text-gray-500 uppercase tracking-wider mb-2">You've Registered For</p>

         */
        function generateTeamPrintByProgramHTML(teamName) {
    const teamRegistrations = getDataAsArray('registrations').filter(r => r.teamName === teamName);

    // Group registrations by program ID for easy processing
    const regsByProgram = teamRegistrations.reduce((acc, reg) => {
        if (!acc[reg.programId]) {
            acc[reg.programId] = [];
        }
        acc[reg.programId].push(reg);
        return acc;
    }, {});

    // Sort programs alphabetically by name
    const sortedProgramIds = Object.keys(regsByProgram).sort((a, b) => {
        const progA = appData.programs[a];
        const progB = appData.programs[b];
        if (!progA || !progB) return 0;
        return progA.name.localeCompare(progB.name);
    });

    let contentHTML = '';
    if (sortedProgramIds.length === 0) {
        contentHTML = '<p style="text-align: center; font-size: 14pt; color: #6B7280;">Your team has no registrations to display.</p>';
    } else {
        contentHTML = sortedProgramIds.map(progId => {
            const program = appData.programs[progId];
            const registrations = regsByProgram[progId];
            return `
                <div style="margin-top: 25px; page-break-inside: avoid;">
                    <h3 style="font-size: 15pt; font-weight: 700; color: #115E59; border-bottom: 2px solid #CCFBF1; padding-bottom: 5px; margin-bottom: 12px;">
                        ${program.name} <span style="font-weight: normal; color: #6B7280; font-size: 12pt;">(${program.category})</span>
                    </h3>
                    <table style="width: 100%; border-collapse: collapse; font-size: 12pt;">
                        ${registrations.map(reg => `
                            <tr>
                                <td style="padding: 6px 0; width: 40%; font-weight: 600;">${reg.studentName}</td>
                                <td style="padding: 6px 0; color: #4B5563;">"${reg.pieceTitle || 'N/A'}"</td>
                            </tr>
                        `).join('')}
                    </table>
                </div>
            `;
        }).join('');
    }

    // Return the complete HTML document with a header
    return `
        <div style="font-family: 'Segoe UI', Arial, sans-serif; box-sizing: border-box; padding: 1cm;">
            <header style="border-bottom: 3px solid #0D9488; padding-bottom: 12px; margin-bottom: 25px;">
                <h1 style="font-size: 24pt; margin: 0; font-weight: 800; color: #134E4A;">Team Report: ${teamName}</h1>
                <p style="font-size: 16pt; margin: 8px 0 0 0; color: #1F2937;">Program-Based Registrations</p>
            </header>
            ${contentHTML}
        </div>
    `;
}

    printArea.innerHTML = printHTML;
    window.print();
    printArea.innerHTML = ''; // Clean up after printing
}

        function printAllRegistrations(stageFilter = 'all', categoryFilter = 'all') {
            const activeRegProgramIds = Object.keys(appData.registrationPrograms || appData.registrationProgramss || {});
            let activePrograms = getDataAsArray('programs')
                .filter(p => activeRegProgramIds.includes(p.id));

            if (stageFilter === 'stage') {
                activePrograms = activePrograms.filter(p => (p.stageType || 'stage') !== 'non-stage');
            } else if (stageFilter === 'non-stage') {
                activePrograms = activePrograms.filter(p => (p.stageType || 'stage') === 'non-stage');
            }
            if (categoryFilter !== 'all') {
                activePrograms = activePrograms.filter(p => p.category === categoryFilter);
            }

            // Sort: Stage events first, then Category (CATEGORIES order), then Name
            activePrograms.sort((a, b) => {
                const aStage = (a.stageType || 'stage') !== 'non-stage' ? 0 : 1;
                const bStage = (b.stageType || 'stage') !== 'non-stage' ? 0 : 1;
                if (aStage !== bStage) return aStage - bStage;

                const aCatIdx = CATEGORIES.indexOf(a.category);
                const bCatIdx = CATEGORIES.indexOf(b.category);
                if (aCatIdx !== bCatIdx) return aCatIdx - bCatIdx;

                return a.name.localeCompare(b.name);
            });

            const allRegistrations = getDataAsArray('registrations');

            if (activePrograms.length === 0) {
                alert('No active programs match the selected filter.');
                return;
            }

            let allPagesHTML = '';
            activePrograms.forEach(program => {
                const registrationsForProgram = allRegistrations.filter(r => r.programId === program.id);
                if (registrationsForProgram.length > 0) {
                    allPagesHTML += generatePrintPageHTML(program, registrationsForProgram);
                }
            });

            if (allPagesHTML === '') {
                alert('There are no registrations for the selected active programs.');
                return;
            }

            const printArea = document.getElementById('print-area');
            printArea.innerHTML = allPagesHTML;
            window.print();
            printArea.innerHTML = ''; // Clean up after printing
        }

                try {
                    await db.ref('registrations').push(registrationData);
                    if (messageEl) {
                        messageEl.textContent = 'Registration submitted successfully!';
                        messageEl.className = 'text-xs font-semibold text-center mt-2 min-h-[1.25rem] text-green-600';
                    }
                    setTimeout(() => {
                        openProgramRegistrationModal(programId, teamName);
                    }, 500);
                } catch (err) {
                    if (messageEl) {
                        messageEl.textContent = 'Error: ' + err.message;
                        messageEl.className = 'text-xs font-semibold text-center mt-2 min-h-[1.25rem] text-red-500';
                    }
                    if (submitBtn) {
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = '<i class="fas fa-user-plus"></i> Submit Registration';
                    }
                }
            }

            if (e.target.id === 'edit-registration-form') {
                e.preventDefault();
                const form = e.target;
                const regId = form.elements.registrationId.value;
                const programId = form.elements.programId?.value || selectedProgramId;
                const studentId = form.elements.studentId.value;
                const student = appData.students[studentId];

                const updatedData = {
                    studentId: studentId,
                    studentName: student ? student.name : 'Unknown',
                    pieceTitle: form.elements.pieceTitle?.value || '',
                    firstLine: form.elements.firstLine?.value || '',
                    youtubeLink: form.elements.youtubeLink?.value || ''
                };

                try {
                    await db.ref('registrations/' + regId).update(updatedData);
                    if (programId) {
                        openProgramRegistrationModal(programId, currentModalTeamName);
                    } else {
                        closeModal();
                    }
                } catch (err) {
                    alert('Error updating registration: ' + err.message);
                }
            }
        });

        document.addEventListener('click', async (e) => {
            if (e.target.id === 'logout-btn') {
                currentUser = null;
                sessionStorage.removeItem('user');
                window.location.href = 'index.html';
            }
            if (e.target.closest('.admin-tab')) {
                activeAdminTab = e.target.closest('.admin-tab').dataset.tab;
                renderApp();
            }
            const programButton = e.target.closest('.program-select-btn');
            if (programButton) {
                const progId = programButton.dataset.programId;
                openProgramRegistrationModal(progId);
            }
            if (e.target.id === 'print-registrations-btn') {
                if (selectedProgramId) {
                    printRegistrations(selectedProgramId);
                }
            }
            if (e.target.id === 'print-all-registrations-btn') {
                printAllRegistrations();
            }
            if (e.target.id === 'print-team-registrations-btn') {
                openTeamPrintModal();
            }
            const teamPrintOptionBtn = e.target.closest('.team-print-option-btn');
            if (teamPrintOptionBtn) {
                const printType = teamPrintOptionBtn.dataset.printType;
                closeModal();
                if (printType === 'program') {
                    printTeamRegistrations();
                } else {
                    printTeamRegistrations();
                }
            }
            const editButton = e.target.closest('.edit-reg-btn');
            if (editButton) {
                openEditModal(editButton.dataset.regId);
            }
            const deleteButton = e.target.closest('.delete-reg-btn');
            if (deleteButton) {
                const regId = deleteButton.dataset.regId;
                if (confirm('Are you sure you want to remove this registration?')) {
                    try {
                        await db.ref('registrations/' + regId).remove();
                        if (selectedProgramId) {
                            openProgramRegistrationModal(selectedProgramId, currentModalTeamName);
                        }
                    } catch(err) {
                        alert('Error removing registration: ' + err.message);
                    }
                }
            }
            const closeEditModalBtn = e.target.closest('.close-edit-modal-btn');
            if (closeEditModalBtn) {
                if (selectedProgramId) {
                    openProgramRegistrationModal(selectedProgramId, currentModalTeamName);
                } else {
                    closeModal();
                }
            }
            const closeModalBtn = e.target.closest('.close-modal-btn');
            if (closeModalBtn) {
                closeModal();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        document.addEventListener('change', e => {
            if (e.target.matches('.toggle-checkbox[name="reg-toggle"]')) {
                const programId = e.target.dataset.programId;
                if (e.target.checked) {
                    db.ref(`registrationProgramss/${programId}`).set(true);
                } else {
                    db.ref(`registrationProgramss/${programId}`).remove();
                }
            }
            if (e.target.matches('.reg-type-select')) {
                const programId = e.target.dataset.programId;
                const type = e.target.value;
                db.ref(`programs/${programId}/registrationType`).set(type);
            }
        });

        // --- INITIALIZATION ---
        function initializeApp() {
            const storedUser = sessionStorage.getItem('user');
            if (!storedUser) {
                window.location.replace('index.html');
                return;
            }
            currentUser = JSON.parse(storedUser);

            db.ref().on('value', snapshot => {
                const data = snapshot.val() || {};
                appData = {
                    students: data.students || {},
                    teams: data.teams || {},
                    programs: data.programs || {},
                    registrationProgramss: data.registrationProgramss || {},
                    registrations: data.registrations || {},
                    settings: data.settings || {}
                };
                
                if (currentUser.type !== 'admin' && !appData.settings?.portals?.item) {
                    window.location.replace('index.html');
                    return;
                }

                // If user currently has the program registration modal open, update roster in-place only
                // This protects active form inputs (pieceTitle, firstLine, youtubeLink, student selection) from being wiped!
                if (selectedProgramId) {
                    const modalContainer = document.getElementById('modal-container');
                    if (modalContainer && !modalContainer.classList.contains('hidden')) {
                        const editOverlay = document.getElementById('edit-modal-overlay');
                        if (!editOverlay) {
                            updateModalRosterInPlace(selectedProgramId, currentModalTeamName);
                        }
                        return;
                    }
                }

                // If user has an edit modal open, don't wipe active edits
                if (document.getElementById('edit-modal-overlay')) {
                    return;
                }

                // If user is actively typing in any input, select, or textarea, protect their focus and input
                const activeEl = document.activeElement;
                if (activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'SELECT' || activeEl.tagName === 'TEXTAREA')) {
                    return;
                }

                renderApp();
            });
        }

        initializeApp();
    </script>
</body>

</html>
