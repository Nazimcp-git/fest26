<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Participant Registration</title>
    <!-- Favicons -->
    <link rel="icon" type="image/png" href="../logo/logo.png" />
    <link rel="icon" type="image/webp" href="../logo/logo.webp" />
    <link rel="apple-touch-icon" href="../logo/logo.png" />
    
    <!-- Tailwind CSS for modern styling -->
    <link rel="stylesheet" href="../results/styles/tailwind.css" />
    
    <!-- Google Fonts: Inter for a clean UI -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .program-select-btn.active {
            box-shadow: 0 0 0 3px #f97316;
            transform: scale(1.02);
            background-color: #fffaf5;
        }
        .admin-tab.active, .team-tab.active { 
            border-color: #f97316; 
            color: #f97316; 
            background-color: #fffaf5; 
        }
        .category-filter-btn.active {
            background-color: #f97316;
            color: white;
        }
        /* Print Styles */
        @media print {
            body > *:not(#print-area) {
                display: none !important;
            }
            #print-area {
                display: block !important;
                visibility: visible !important;
                position: static !important;
                width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
            }
            .print-page {
                page-break-after: always;
            }
            .print-page:last-child {
                page-break-after: avoid;
            }
            @page {
                size: auto;
                margin: 10mm;
            }
        }
        /* Animation for detail view */
        .detail-view {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s ease-in-out;
        }
         .detail-view.visible {
            max-height: 1500px; /* Adjust as needed */
        }
        #modal-container.hidden { display: none; }

        /* Toggle Switch Styles */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #f97316;
        }
        /* Custom styled student selection cards */
        .student-select-card {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
        }
        .student-select-card:hover {
            transform: translateY(-2px);
            border-color: #f97316;
            box-shadow: 0 4px 12px rgba(249, 115, 22, 0.08);
        }
        .student-select-card:has(input[type="checkbox"]:checked) {
            border-color: #f97316;
            background: linear-gradient(135deg, rgba(255, 247, 237, 0.95) 0%, rgba(255, 237, 213, 0.7) 100%);
            box-shadow: 0 4px 16px rgba(249, 115, 22, 0.14);
        }
        .student-select-card:has(input[type="checkbox"]:checked) .card-check-box {
            background-color: #f97316;
            border-color: #f97316;
            color: white;
        }
        .student-select-card:has(input[type="checkbox"]:checked) .card-check-icon {
            opacity: 1;
            transform: scale(1);
        }
        .card-check-icon {
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.15s ease;
        }
        /* Custom scrollbar */
        .custom-scroll::-webkit-scrollbar {
            width: 5px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.02);
            border-radius: 8px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: rgba(0,0,0,0.15);
            border-radius: 8px;
        }
        .custom-scroll::-webkit-scrollbar-thumb:hover {
            background: rgba(0,0,0,0.25);
        }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        if (typeof tailwind !== 'undefined') {
            tailwind.config = {
                theme: {
                    extend: {
                        fontFamily: { sans: ['Inter', 'sans-serif'] },
                        animation: {
                            'fade-in': 'fadeIn 0.2s ease-out forwards',
                            'blob': 'blob 7s infinite alternate ease-in-out',
                        },
                        keyframes: {
                            fadeIn: {
                                '0%': { opacity: '0', transform: 'translateY(4px)' },
                                '100%': { opacity: '1', transform: 'translateY(0)' },
                            },
                            blob: {
                                '0%': { transform: 'translate(0px, 0px) scale(1)' },
                                '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                                '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                                '100%': { transform: 'translate(0px, 0px) scale(1)' }
                            }
                        }
                    }
                }
            };
        }
    </script>
</head>
<body class="bg-[#f5f3ef] font-sans text-gray-800 antialiased selection:bg-orange-200 overflow-y-scroll relative" style="background-image: radial-gradient(at 0% 0%, hsla(28,100%,74%,0.15) 0px, transparent 50%), radial-gradient(at 100% 0%, hsla(189,100%,56%,0.15) 0px, transparent 50%), radial-gradient(at 100% 100%, hsla(355,100%,93%,0.15) 0px, transparent 50%), radial-gradient(at 0% 100%, hsla(340,100%,76%,0.15) 0px, transparent 50%);">

    <!-- Aurora Background -->
    <div class="fixed inset-0 pointer-events-none z-0">
        <div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] rounded-full bg-pink-400/30 mix-blend-multiply filter blur-[120px] animate-blob"></div>
        <div class="absolute top-[-10%] right-[-10%] w-[50%] h-[50%] rounded-full bg-orange-400/30 mix-blend-multiply filter blur-[120px] animate-blob" style="animation-delay: 2s;"></div>
        <div class="absolute bottom-[-20%] left-[20%] w-[50%] h-[50%] rounded-full bg-teal-400/30 mix-blend-multiply filter blur-[120px] animate-blob" style="animation-delay: 4s;"></div>
    </div>

    <div id="app" class="min-h-screen relative z-10">
        <!-- Branded Loading Screen -->
        <div id="loading-screen" class="fixed inset-0 z-[9999] flex flex-col items-center justify-center bg-[#f5f3ef]" style="background-image: radial-gradient(at 50% 40%, hsla(28,100%,74%,0.18) 0px, transparent 60%);">
            <style>
                @keyframes horizontalLoad {
                    0% { left: -40%; width: 30%; }
                    50% { left: 25%; width: 55%; }
                    100% { left: 100%; width: 30%; }
                }
                @keyframes loaderPulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.88; transform: scale(0.98); } }
                @keyframes loaderFadeOut { 0% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(0.98); pointer-events: none; visibility: hidden; } }
                .loader-logo { 
                    animation: loaderPulse 2.4s ease-in-out infinite; 
                    filter: drop-shadow(0 4px 14px rgba(0, 0, 0, 0.55)) drop-shadow(0 1px 2px rgba(0, 0, 0, 0.8));
                }
                .loader-progress-bar { animation: horizontalLoad 1.4s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
                .loader-hide { animation: loaderFadeOut 0.4s ease-out forwards; }
            </style>
            <div class="flex flex-col items-center">
                <div class="mb-5 flex items-center justify-center">
                    <img src="../logo/logo.webp" onerror="this.onerror=null;this.src='../logo/logo.png'" alt="Alert 2k26" class="loader-logo h-16 sm:h-20 w-auto max-w-[260px] object-contain select-none" style="filter: drop-shadow(0 4px 14px rgba(0, 0, 0, 0.55)) drop-shadow(0 1px 2px rgba(0, 0, 0, 0.8));" />
                </div>
                <h1 class="text-xl sm:text-2xl font-black text-gray-900 tracking-tight mb-1">Alert 2k26</h1>
                <p class="text-xs sm:text-sm font-medium text-gray-400 tracking-wide">Loading Participant Registration...</p>
                <!-- Horizontal Loading Bar -->
                <div class="w-48 sm:w-56 h-1.5 bg-orange-100/70 border border-orange-200/50 rounded-full overflow-hidden relative mt-4 shadow-inner">
                    <div class="loader-progress-bar absolute top-0 bottom-0 bg-gradient-to-r from-orange-500 via-amber-500 to-orange-600 rounded-full shadow-[0_0_10px_rgba(249,115,22,0.5)]"></div>
                </div>
            </div>
        </div>
        <!-- App content will be rendered here -->
    </div>

    <script>
        // Safety fallback: ensure loading screen dismisses even under slow network
        setTimeout(function() {
            var l = document.getElementById('loading-screen');
            if (l) {
                l.classList.add('loader-hide');
                setTimeout(function() { if (l && l.parentNode) l.remove(); }, 450);
            }
        }, 5000);
    </script>
    <div id="modal-container" class="hidden"></div>
    
    <!-- Hidden container for printing -->
    <div id="print-area" class="hidden"></div>

    <!-- Firebase SDKs (Version 8.10.0) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/security.js"></script>
    <script src="../js/auth-config.js"></script>

    <script type="module">
        // --- APPLICATION STATE ---
        let appData = { students: {}, teams: {}, programs: {}, participantRegistrations: {}, registrationPrograms: {}, settings: {} };
        let currentUser = null;
        let selectedProgramId = null;
        let selectedCategory = null;
        let activeAdminTab = 'overview';
        let activeTeamTab = 'register';
        let studentStatsFilter = 'All';
        let adminSelectedTeamId = null;
        let currentModalTeamId = null;
        let candidateCategoryFilter = 'All';
        let candidateStageFilter = 'all';
        let candidateSearchQuery = '';

        // --- UI COMPONENTS & TEMPLATES ---
        const AppShell = (content) => `
            <div class="min-h-screen flex flex-col">
                <nav class="fixed top-4 left-1/2 -translate-x-1/2 w-[calc(100%-2rem)] max-w-6xl bg-white/20 backdrop-blur-3xl backdrop-saturate-[2.5] border-[0.5px] border-white/60 shadow-[0_8px_32px_0_rgba(0,0,0,0.05),inset_0_1px_1px_rgba(255,255,255,0.8)] rounded-[2rem] z-50 transition-all">
                    <div class="px-6">
                        <div class="flex items-center justify-between h-16">
                            <div class="flex items-center gap-3">
                                <a href="index.html" class="w-10 h-10 rounded-[1.25rem] bg-gray-500/10 text-gray-600 hover:text-gray-900 hover:bg-white/50 border border-transparent hover:border-white/60 flex items-center justify-center transition-all">
                                    <i class="fas fa-arrow-left text-sm"></i>
                                </a>
                                <img src="../logo/logo.webp" onerror="this.onerror=null;this.src='../logo/logo.png'" alt="Alert 2k26" class="h-9 w-auto max-h-9 object-contain select-none ml-1" style="filter: drop-shadow(0 2px 6px rgba(0,0,0,0.55)) drop-shadow(0 0 1.5px rgba(0,0,0,0.75));" />
                                <span class="font-bold text-gray-900 text-lg tracking-tight hidden sm:block">Participant Registration</span>
                            </div>
                            ${currentUser ? `<button id="logout-btn" class="px-4 py-2 rounded-xl text-sm font-bold text-red-600 hover:text-red-700 hover:bg-red-50 transition-colors border border-transparent hover:border-red-100"><i class="fas fa-sign-out-alt mr-1.5"></i>Logout</button>` : ''}
                        </div>
                    </div>
                </nav>
                <main id="main-content" class="flex-grow pt-28 pb-10">
                    <div class="max-w-7xl mx-auto sm:px-6 lg:px-8 px-6 animate-fade-in">
                        ${content}
                    </div>
                </main>
            </div>
        `;
        
        // --- HELPER FUNCTIONS ---
        function getDataAsArray(entity) {
            if (!appData[entity]) return [];
            return Object.entries(appData[entity]).map(([id, value]) => ({ id, ...value }));
        }

        // --- RENDER FUNCTIONS ---
        function renderApp() {
            const appContainer = document.getElementById('app');
            let content = '';
            if (currentUser.type === 'admin') {
                content = renderAdminPortal();
            } else if (currentUser.type === 'team') {
                content = renderTeamPortal();
            }
            appContainer.innerHTML = AppShell(content);
            // Dismiss loading screen
            const loader = document.getElementById('loading-screen');
            if (loader) {
                loader.classList.add('loader-hide');
                setTimeout(() => loader.remove(), 450);
            }
        }

        function renderLoginPage() {
            return `
                <div class="flex items-center justify-center min-h-screen animate-fade-in">
                    <div class="w-full max-w-md p-8 space-y-6 bg-white/60 backdrop-blur-xl border border-white/60 rounded-3xl shadow-[0_8px_32px_0_rgba(0,0,0,0.08)]">
                        <div class="flex flex-col items-center">
                            <img src="../logo/logo.webp" onerror="this.onerror=null;this.src='../logo/logo.png'" alt="Alert 2k26" class="h-14 sm:h-16 w-auto max-w-[220px] object-contain select-none mb-3" style="filter: drop-shadow(0 2px 8px rgba(0,0,0,0.5)) drop-shadow(0 0 1.5px rgba(0,0,0,0.75));" />
                            <h2 class="text-center text-3xl font-black text-gray-900 tracking-tight">Participant Portal</h2>
                            <p class="mt-2 text-center text-sm font-medium text-gray-500">Enter your access code to continue.</p>
                        </div>
                        <form id="login-form" class="mt-8 space-y-6">
                            <div>
                                <input id="access-code-input" type="password" required class="appearance-none block w-full px-4 py-3.5 bg-white/50 border border-white/60 rounded-xl shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-orange-500 focus:bg-white sm:text-sm font-medium transition-all" placeholder="Access Code">
                            </div>
                            <div>
                                <button type="submit" class="w-full flex justify-center py-3.5 px-4 border border-transparent text-sm font-bold rounded-xl text-white bg-gradient-to-r from-orange-500 to-orange-600 hover:from-orange-600 hover:to-orange-700 shadow-md hover:shadow-lg transition-all transform hover:-translate-y-0.5">Login</button>
                            </div>
                            <p id="login-error" class="text-red-500 text-sm mt-2 text-center font-medium"></p>
                        </form>
                    </div>
                </div>
            `;
        }
        
        function renderAdminPortal() {
            let content = '';
            switch(activeAdminTab) {
                case 'overview':
                    content = renderAdminOverview();
                    break;
                case 'teams':
                    content = renderAdminTeamRegistrations();
                    break;
                case 'settings':
                    content = renderAdminSettings();
                    break;
                case 'stats':
                    content = renderStudentStatsPage();
                    break;
            }
             return `
                <div>
                    <header class="flex flex-col sm:flex-row justify-between sm:items-center gap-4 mb-8">
                        <div>
                            <h1 class="text-4xl font-bold text-gray-900">Admin Panel</h1>
                            <p class="text-xs text-gray-500 mt-1">Manage participant assignments and monitor registration status.</p>
                        </div>
                        <div>
                            <a href="contradiction-checker.html" class="inline-flex items-center gap-2 px-4 py-2.5 rounded-2xl bg-gradient-to-r from-orange-500 to-amber-500 text-white font-bold text-sm shadow-md shadow-orange-500/20 hover:from-orange-600 hover:to-amber-600 transition-all transform hover:-translate-y-0.5">
                                <i class="fas fa-user-check"></i>
                                <span>Contradiction Checker</span>
                            </a>
                        </div>
                    </header>
                    <div class="border-b border-gray-200 mb-6">
                        <nav id="admin-tabs" class="-mb-px flex space-x-8 overflow-x-auto" aria-label="Tabs">
                            <button data-tab="overview" class="admin-tab whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm ${activeAdminTab === 'overview' ? 'active' : ''}">Registration Overview</button>
                            <button data-tab="teams" class="admin-tab whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm ${activeAdminTab === 'teams' ? 'active' : ''}"><i class="fas fa-user-edit mr-1.5 text-indigo-600"></i>Edit Team Registrations</button>
                            <button data-tab="stats" class="admin-tab whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm ${activeAdminTab === 'stats' ? 'active' : ''}">Student Stats</button>
                            <button data-tab="settings" class="admin-tab whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm ${activeAdminTab === 'settings' ? 'active' : ''}">Settings</button>
                        </nav>
                    </div>
                    <main id="admin-tab-content">
                       ${content}
                    </main>
                </div>
            `;
        }

        function renderAdminOverview() {
            const allPrograms = getDataAsArray('programs');
            const activeRegProgramIds = Object.keys(appData.registrationPrograms || {});
            const activePrograms = allPrograms.filter(p => activeRegProgramIds.includes(p.id)).sort((a,b) => a.name.localeCompare(b.name));
            const registrations = appData.participantRegistrations || {};
            const teams = getDataAsArray('teams');

            const teamRegistrationStatus = teams.map(team => {
                let count = 0;
                activeRegProgramIds.forEach(progId => {
                    if (registrations[progId] && registrations[progId][team.id] && registrations[progId][team.id].length > 0) {
                        count++;
                    }
                });
                const totalActive = activeRegProgramIds.length;
                const percentage = totalActive > 0 ? Math.round((count / totalActive) * 100) : 0;
                return { name: team.name, count, total: totalActive, percentage };
            });

            return `
                 <div>
                    <div class="mb-8">
                        <h2 class="text-3xl font-bold text-gray-900 mb-4">Team Registration Status</h2>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                            ${teamRegistrationStatus.map(team => {
                                const tObj = teams.find(t => t.name === team.name) || {};
                                return `
                                <div class="bg-white/60 backdrop-blur-xl border border-white/60 p-6 rounded-3xl shadow-lg text-center flex flex-col justify-between hover:shadow-xl transition-all">
                                    <div>
                                        <h3 class="text-xl font-bold text-gray-800">${team.name}</h3>
                                        <p class="text-6xl font-bold text-indigo-600 my-4">${team.count}<span class="text-3xl text-gray-400">/${team.total}</span></p>
                                        <p class="text-lg font-semibold text-gray-500">${team.percentage}% Complete</p>
                                    </div>
                                    <div class="mt-4">
                                        <div class="w-full bg-gray-200 rounded-full h-2.5">
                                            <div class="bg-indigo-600 h-2.5 rounded-full" style="width: ${team.percentage}%"></div>
                                        </div>
                                        <button type="button" onclick="adminSelectAndEditTeam('${tObj.id || ''}')" class="mt-4 w-full py-2.5 px-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold shadow-md shadow-indigo-600/20 active:scale-95 transition-all flex items-center justify-center gap-1.5 cursor-pointer">
                                            <i class="fas fa-user-edit"></i>
                                            <span>Edit ${team.name} Registrations</span>
                                        </button>
                                    </div>
                                </div>
                            `}).join('')}
                        </div>
                    </div>
                    <div class="bg-white/60 backdrop-blur-xl border border-white/60 p-6 rounded-3xl shadow-lg">
                         <div class="flex flex-col md:flex-row justify-between md:items-center mb-4 gap-4">
                            <div>
                                <h2 class="text-2xl font-bold text-gray-900">Active Program Details</h2>
                                <p class="text-xs font-semibold text-gray-500 mt-1">
                                    <span class="text-indigo-600 font-bold">${activePrograms.length} Total</span> &bull; 
                                    <span class="text-purple-600 font-bold">${activePrograms.filter(p => (p.stageType || 'stage') !== 'non-stage').length} Stage</span> &bull; 
                                    <span class="text-amber-600 font-bold">${activePrograms.filter(p => (p.stageType || 'stage') === 'non-stage').length} Non-Stage</span>
                                </p>
                            </div>
                            <div class="flex flex-wrap items-center gap-2">
                                <button type="button" onclick="openProgramPrintModal()" class="bg-gradient-to-r from-orange-500 to-indigo-600 hover:from-orange-600 hover:to-indigo-700 text-white px-4 py-2 text-xs font-bold rounded-xl shadow-md flex items-center gap-2 transition-all active:scale-95">
                                    <i class="fas fa-print"></i>
                                    <span>Program Print Center</span>
                                </button>
                                <button type="button" onclick="printTotalProgramList('all', 'all', false)" class="bg-white border border-gray-200 text-gray-700 hover:bg-gray-50 hover:text-indigo-600 px-3 py-2 text-xs font-bold rounded-xl shadow-sm flex items-center gap-1.5 transition-all">
                                    <i class="fas fa-list-check text-indigo-600"></i>
                                    <span>Master Directory</span>
                                </button>
                                <button type="button" onclick="printAllParticipantLists('all', 'all', true)" class="bg-white border border-gray-200 text-gray-700 hover:bg-gray-50 hover:text-purple-600 px-3 py-2 text-xs font-bold rounded-xl shadow-sm flex items-center gap-1.5 transition-all">
                                    <i class="fas fa-file-signature text-purple-600"></i>
                                    <span>Judging Sheets</span>
                                </button>
                            </div>
                         </div>
                        <div class="space-y-2 max-h-[60vh] overflow-y-auto">
                           ${activePrograms.length === 0 ? `<p class="text-center text-gray-500 py-4">No programs activated in Settings.</p>` : 
                           activePrograms.map(p => {
                                const programRegs = registrations[p.id] || {};
                                return `
                                <div class="p-3.5 rounded-2xl bg-gray-50/80 border border-gray-100 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                                    <div>
                                        <p class="font-bold text-gray-900 text-sm">${p.name}</p>
                                        <div class="flex items-center gap-2 mt-0.5">
                                            <span class="text-xs text-gray-500">${p.category}</span>
                                            <span class="text-[10px] font-bold px-1.5 py-0.5 rounded ${(p.stageType || 'stage') !== 'non-stage' ? 'bg-purple-100 text-purple-700' : 'bg-amber-100 text-amber-700'}">
                                                ${(p.stageType || 'stage') !== 'non-stage' ? 'Stage' : 'Non-Stage'}
                                            </span>
                                            ${p.isGroup ? '<span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-blue-100 text-blue-700">Group</span>' : ''}
                                        </div>
                                    </div>
                                    <div class="flex flex-wrap gap-1.5 text-xs items-center">
                                        ${teams.map(team => {
                                            const count = programRegs[team.id]?.length || 0;
                                            const color = count > 0 ? 'bg-emerald-50 text-emerald-800 border-emerald-200 hover:bg-emerald-100' : 'bg-gray-100 text-gray-600 border-gray-200 hover:bg-gray-200';
                                            return `
                                            <button type="button" onclick="openRegistrationModal('${p.id}', '${team.id}')" class="${color} border px-2.5 py-1 rounded-xl font-bold transition-all hover:scale-105 active:scale-95 cursor-pointer flex items-center gap-1.5 shadow-xs" title="Click to edit ${team.name} candidates for ${p.name}">
                                                <span>${team.name}: ${count}</span>
                                                <i class="fas fa-edit text-[9px] opacity-70"></i>
                                            </button>
                                            `;
                                        }).join('')}
                                    </div>
                                </div>
                                `
                            }).join('')}
                        </div>
                    </div>
                </div>
            `;
        }
        
        function renderAdminSettings() {
            const allPrograms = getDataAsArray('programs').sort((a,b) => a.category.localeCompare(b.category) || a.name.localeCompare(b.name));
            const activeRegProgramIds = Object.keys(appData.registrationPrograms || {});

            return `

        function renderStudentStatsPage(activeCategory = studentStatsFilter) {
            const allStudents = getDataAsArray('students');
            const registrations = appData.participantRegistrations || {};
            const activeRegProgramIds = Object.keys(appData.registrationPrograms || {});

            allStudents.forEach(student => {
                student.stageCount = 0;
                student.nonStageCount = 0;
                student.registrationCount = 0;
                activeRegProgramIds.forEach(progId => {
                    const program = appData.programs[progId];
                    if(program && !program.isGroup) { // Only count if not a group event
                        const programRegs = registrations[progId] || {};
                        const teamRegs = programRegs[student.teamId] || [];
                        if (teamRegs.includes(student.id)) {
                            const isStage = (program.stageType || 'stage') !== 'non-stage';
                            if (isStage) {
                                student.stageCount++;
                            } else {
                                student.nonStageCount++;
                            }
                            student.registrationCount++;
                        }
                    }
                });
            });

            const filteredStudents = activeCategory === 'All'
                ? allStudents
                : allStudents.filter(s => s.category === activeCategory);

            filteredStudents.sort((a, b) => b.registrationCount - a.registrationCount);

            const filterButtons = ['All', ...CATEGORIES];

            return `
                <div class="bg-white/60 backdrop-blur-xl border border-white/60 p-6 rounded-3xl shadow-lg">

                                    <th class="px-5 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Team</th>
                                    ${activeCategory === 'All' ? `<th class="px-5 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Category</th>` : ''}

        function renderTeamCandidatesPage() {
            const teamId = currentUser?.teamId || (currentUser?.teamName && Object.keys(appData.teams || {}).find(id => appData.teams[id]?.name === currentUser.teamName)) || Object.keys(appData.teams || {})[0];
            const currentTeam = appData.teams?.[teamId];
            const currentTeamName = currentTeam ? currentTeam.name : 'Your Team';
            const registrationPrograms = getDataAsArray('programs').filter(p => appData.registrationPrograms && appData.registrationPrograms[p.id]);
            const registrations = appData.participantRegistrations || {};
            const categories = ['All', ...CATEGORIES];
            
            let filteredPrograms = registrationPrograms.filter(p => {
                if (candidateCategoryFilter !== 'All' && p.category !== candidateCategoryFilter) return false;
                const isStage = (p.stageType || 'stage') !== 'non-stage';
                if (candidateStageFilter === 'stage' && !isStage) return false;
                if (candidateStageFilter === 'non-stage' && isStage) return false;
                if (candidateSearchQuery) {
                    const q = candidateSearchQuery.toLowerCase();
                    const nameMatch = (p.name || '').toLowerCase().includes(q);
                    // ONLY search within this team's candidates - NEVER other teams
                    const myProgRegs = registrations[p.id]?.[teamId] || [];
                    const hasStudentMatch = myProgRegs.some(sId => {
                        const s = appData.students?.[sId];
                        return s && ((s.name || '').toLowerCase().includes(q) || String(s.chestNo || '').includes(q));
                    });
                    if (!nameMatch && !hasStudentMatch) return false;
                }
                return true;
            }).sort((a, b) => {
                const ca = CATEGORIES.indexOf(a.category);
                const cb = CATEGORIES.indexOf(b.category);
                if (ca !== cb) return ca - cb;
                return a.name.localeCompare(b.name);
            });

            return `
                <div class="space-y-6 animate-fade-in">
                    <!-- Filters & Search Toolbar -->
                    <div class="bg-white/80 backdrop-blur-xl border border-white/60 p-5 sm:p-6 rounded-3xl shadow-lg">
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                            <!-- Search -->

                                <i class="fas fa-search absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
                                <input type="text" id="candidate-search-input" value="${candidateSearchQuery}" oninput="handleCandidateSearch(this.value)" placeholder="Search program or ${currentTeamName} candidate..." class="w-full pl-9 pr-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-xs font-medium focus:bg-white focus:outline-none focus:ring-2 focus:ring-orange-500/30 focus:border-orange-500 transition-all">
                            </div>

                            <!-- Team Privacy Badge -->

                                <i class="fas fa-shield-halved text-orange-600"></i>
                                <span>${currentTeamName} Candidates Only</span>
                            </div>
                        </div>

                        <!-- Secondary Filters: Category & Stage -->
                        <div class="flex flex-wrap items-center gap-2 mt-4 pt-4 border-t border-gray-100">
                            <span class="text-xs font-bold text-gray-500 mr-1">Category:</span>
                            ${categories.map(c => `
                                <button type="button" onclick="setCandidateCategoryFilter('${c}')" class="px-3 py-1 rounded-xl text-xs font-bold transition-all cursor-pointer ${candidateCategoryFilter === c ? 'bg-orange-500 text-white shadow-sm' : 'bg-gray-100 hover:bg-gray-200 text-gray-600'}">
                                    ${c}
                                </button>
                            `).join('')}

                            <div class="h-4 w-px bg-gray-200 mx-2 hidden sm:block"></div>

                            <span class="text-xs font-bold text-gray-500 mr-1">Stage:</span>

                            <button type="button" onclick="setCandidateStageFilter('stage')" class="px-3 py-1 rounded-xl text-xs font-bold transition-all cursor-pointer ${candidateStageFilter === 'stage' ? 'bg-purple-600 text-white shadow-sm' : 'bg-gray-100 hover:bg-gray-200 text-gray-600'}">Stage</button>

                                    <div>
                                        <div class="flex items-start justify-between gap-3 mb-3">
                                            <div>
                                                <h3 class="font-black text-gray-900 text-base leading-tight">${p.name}</h3>
                                                <div class="flex flex-wrap items-center gap-1.5 mt-1.5">
                                                    <span class="px-2 py-0.5 rounded-md text-[10px] font-bold ${isStage ? 'bg-purple-50 text-purple-700 border border-purple-200' : 'bg-amber-50 text-amber-700 border border-amber-200'}">
                                                        ${isStage ? 'Stage' : 'Non-Stage'}
                                                    </span>
                                                    <span class="px-2 py-0.5 rounded-md text-[10px] font-bold bg-gray-100 text-gray-700 border border-gray-200">

                                            </div>
                                            <button type="button" onclick="openRegistrationModal('${p.id}')" class="px-3 py-1.5 rounded-xl bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold text-xs transition-colors flex items-center gap-1.5 flex-shrink-0 cursor-pointer" title="View candidates for this event">
                                                <i class="fas fa-eye text-[11px]"></i>
                                                <span>View</span>
                                            </button>
                                        </div>

                                        <!-- Registered Candidates List for this team only -->
                                        <div class="mt-4 pt-3 border-t border-gray-100">
                                            <div class="flex items-center justify-between mb-2">
                                                <span class="text-[11px] font-bold uppercase tracking-wider text-gray-500">
                                                    ${currentTeamName} Candidates (${displayList.length})
                                                </span>

                                                <p class="text-xs text-gray-400 italic py-2">No candidates enrolled from your team yet.</p>

                                                            <div class="flex items-center gap-2 min-w-0 pr-2">
                                                                <span class="w-6 h-6 rounded-lg bg-orange-100 text-orange-700 font-black text-[10px] flex items-center justify-center flex-shrink-0">

                                        </div>
                                    </div>
                                </div>

                    `}
                </div>
            `;

        function renderTeamPortal() {
            const isRegistrationClosed = currentUser.type !== 'admin' && appData.settings?.portals?.participant === false;
            let content = '';
            switch(activeTeamTab) {
                case 'register':
                    content = renderTeamRegistrationPage();
                    break;
                case 'candidates':
                    content = renderTeamCandidatesPage();
                    break;
                case 'roster':
                    content = renderTeamRosterPage();
                    break;
            }
             return `
                <div>
                    <header class="flex flex-col sm:flex-row justify-between sm:items-center gap-4 mb-6">
                        <div>
                            <div class="flex items-center gap-3">
                                <h1 class="text-3xl sm:text-4xl font-black text-gray-900 tracking-tight">Team Portal: ${currentUser.teamName}</h1>
                                ${isRegistrationClosed 
                                    ? `<span class="px-3 py-1 rounded-xl text-xs font-black bg-amber-100 text-amber-800 border border-amber-300 flex items-center gap-1.5 shadow-sm"><i class="fas fa-eye text-amber-600"></i> View Mode</span>` 
                                    : `<span class="px-3 py-1 rounded-xl text-xs font-black bg-emerald-100 text-emerald-800 border border-emerald-300 flex items-center gap-1.5 shadow-sm"><i class="fas fa-check-circle text-emerald-600"></i> Registration Open</span>`
                                }
                            </div>
                            <p class="text-xs text-gray-500 mt-1">Manage, verify, and inspect your team registrations</p>
                        </div>
                    </header>
                    
                    ${isRegistrationClosed ? `
                        <div class="bg-amber-50/90 backdrop-blur-xl border border-amber-200/80 p-4 sm:p-5 rounded-3xl mb-6 shadow-sm flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 animate-fade-in">
                            <div class="flex items-center gap-3.5">
                                <div class="w-10 h-10 rounded-2xl bg-amber-500 text-white flex items-center justify-center font-bold text-base flex-shrink-0 shadow-sm shadow-amber-500/20">
                                    <i class="fas fa-eye"></i>
                                </div>
                                <div>
                                    <h4 class="font-bold text-gray-900 text-sm sm:text-base">Candidate Viewing Mode Active</h4>
                                    <p class="text-xs text-amber-800 mt-0.5">The participant registration portal has been closed by administration. You can browse all program candidates, but editing is disabled.</p>
                                </div>
                            </div>
                            <span class="px-3.5 py-1.5 rounded-xl bg-amber-200 text-amber-900 border border-amber-300 font-bold text-xs flex items-center gap-1.5 flex-shrink-0">
                                <i class="fas fa-lock text-amber-700"></i> Read-Only
                            </span>
                        </div>
                    ` : ''}

                    <div class="border-b border-gray-200 mb-6">
                        <nav id="team-tabs" class="-mb-px flex space-x-8 overflow-x-auto" aria-label="Tabs">
                            <button data-tab="register" class="team-tab whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm ${activeTeamTab === 'register' ? 'active' : ''}">
                                <i class="fas fa-list-check mr-1.5 ${activeTeamTab === 'register' ? 'text-orange-600' : 'text-gray-400'}"></i>${isRegistrationClosed ? 'Candidate Status' : 'Overview'}
                            </button>
                            <button data-tab="candidates" class="team-tab whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm ${activeTeamTab === 'candidates' ? 'active' : ''}">
                                <i class="fas fa-users-viewfinder mr-1.5 ${activeTeamTab === 'candidates' ? 'text-orange-600' : 'text-gray-400'}"></i>Program Candidates
                            </button>
                            <button data-tab="roster" class="team-tab whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm ${activeTeamTab === 'roster' ? 'active' : ''}">
                                <i class="fas fa-id-card-clip mr-1.5 ${activeTeamTab === 'roster' ? 'text-orange-600' : 'text-gray-400'}"></i>My Roster
                            </button>
                        </nav>
                    </div>
                    <main id="team-tab-content">
                       ${content}
                    </main>
                </div>
             `;
        }

        function renderTeamRegistrationPage() {
             const { teamName } = currentUser;
             const registrationPrograms = getDataAsArray('programs').filter(p => appData.registrationPrograms && appData.registrationPrograms[p.id]);
             const teamId = Object.keys(appData.teams).find(id => appData.teams[id].name === teamName);
             const activeRegProgramIds = Object.keys(appData.registrationPrograms || {});
             const totalActivePrograms = activeRegProgramIds.length;
             const isRegistrationClosed = currentUser.type !== 'admin' && appData.settings?.portals?.participant === false;
             
             let teamRegisteredCount = 0;
             let stageTotal = 0, stageRegistered = 0;
             let nonStageTotal = 0, nonStageRegistered = 0;

             activeRegProgramIds.forEach(progId => {
                const program = appData.programs[progId];
                if (!program) return;
                const isStage = (program.stageType || 'stage') !== 'non-stage';
                if (isStage) stageTotal++;
                else nonStageTotal++;

                const isReg = appData.participantRegistrations && appData.participantRegistrations[progId] && appData.participantRegistrations[progId][teamId] && appData.participantRegistrations[progId][teamId].length > 0;
                if (isReg) {
                    teamRegisteredCount++;
                    if (isStage) stageRegistered++;
                    else nonStageRegistered++;
                }
             });

             const percentage = totalActivePrograms > 0 ? Math.round((teamRegisteredCount / totalActivePrograms) * 100) : 0;
             const stagePercentage = stageTotal > 0 ? Math.round((stageRegistered / stageTotal) * 100) : 0;
             const nonStagePercentage = nonStageTotal > 0 ? Math.round((nonStageRegistered / nonStageTotal) * 100) : 0;

             const categoriesWithPrograms = CATEGORIES.map(category => {
                 const progs = registrationPrograms.filter(p => p.category === category);
                 return {
                     name: category,
                     programs: progs,
                     stagePrograms: progs.filter(p => (p.stageType || 'stage') !== 'non-stage'),
                     nonStagePrograms: progs.filter(p => (p.stageType || 'stage') === 'non-stage')
                 };
             }).filter(c => c.programs.length > 0);

             return `
                 <div>
                    <div class="bg-white/60 backdrop-blur-xl border border-white/60 p-6 rounded-3xl shadow-lg mb-8">
                        <div class="flex flex-col md:flex-row justify-between md:items-center mb-4 gap-4">
                            <div>
                                <h2 class="text-2xl font-bold text-gray-900">${teamName} Registration Progress</h2>
                                <p class="text-gray-500 text-sm mt-1">Total: ${teamRegisteredCount} of ${totalActivePrograms} events registered (${percentage}%)</p>
                            </div>
                            <div class="flex flex-wrap gap-2">
                                <span class="px-3 py-1.5 rounded-xl text-xs font-bold bg-purple-50 text-purple-700 border border-purple-200/60 shadow-xs">
                                    Stage: ${stageRegistered}/${stageTotal} (${stagePercentage}%)
                                </span>
                                <span class="px-3 py-1.5 rounded-xl text-xs font-bold bg-amber-50 text-amber-700 border border-amber-200/60 shadow-xs">
                                    Non-Stage: ${nonStageRegistered}/${nonStageTotal} (${nonStagePercentage}%)
                                </span>
                            </div>
                        </div>
                        <div class="w-full bg-gray-200 rounded-full h-3 overflow-hidden">
                            <div class="bg-gradient-to-r from-orange-500 to-amber-500 h-3 rounded-full transition-all duration-500" style="width: ${percentage}%"></div>
                        </div>
                    </div>

                    <main>
                       ${categoriesWithPrograms.length === 0 
                         ? `<div class="bg-white/60 backdrop-blur-xl border border-white/60 p-8 rounded-3xl shadow-md text-center"><p class="text-gray-600">No programs are currently open for registration. Please check back later.</p></div>`
                         : categoriesWithPrograms.map(cat => `
                            <div class="mb-8">
                                <details class="bg-white/60 backdrop-blur-xl border border-white/60 rounded-3xl shadow-md overflow-hidden" open>
                                    <summary class="text-2xl font-bold p-5 cursor-pointer list-none flex justify-between items-center bg-white/30 hover:bg-white/50 transition-colors">
                                        <div class="flex items-center gap-3">
                                            <span>${cat.name}</span>
                                            <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-gray-100 text-gray-600">${cat.programs.length} Programs</span>
                                        </div>
                                        <i class="fas fa-chevron-down transform transition-transform text-gray-500"></i>
                                    </summary>
                                    <div class="p-6 border-t border-gray-100 space-y-6">
                                        ${cat.stagePrograms.length > 0 ? `
                                            <div>
                                                <div class="flex items-center gap-2 mb-3">
                                                    <span class="w-2.5 h-2.5 rounded-full bg-purple-600"></span>
                                                    <h4 class="text-xs font-bold uppercase tracking-wider text-purple-800">Stage Programs (${cat.stagePrograms.length})</h4>
                                                </div>
                                                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
                                                    ${cat.stagePrograms.map(p => {
                                                        const teamRegs = appData.participantRegistrations?.[p.id]?.[teamId] || [];
                                                        const isRegistered = teamRegs.length > 0;
                                                        return `
                                                        <button type="button" onclick="openRegistrationModal('${p.id}')" class="program-select-btn text-left p-4 rounded-2xl shadow-sm border transition-all duration-200 bg-white/80 border-gray-100 hover:bg-white hover:border-purple-300 hover:shadow-md group flex items-center justify-between cursor-pointer" data-program-id="${p.id}">
                                                            <div class="min-w-0 pr-2">
                                                                <span class="font-bold text-gray-900 text-sm block truncate group-hover:text-purple-700 transition-colors">${p.name}</span>
                                                                <span class="text-[11px] font-semibold text-gray-400">${isRegistered ? `<span class="text-emerald-600 font-bold">${teamRegs.length} registered</span>` : (isRegistrationClosed ? 'None registered' : 'Click to register')}</span>
                                                            </div>
                                                            <div class="flex-shrink-0">
                                                                ${isRegistered 
                                                                    ? `<span class="w-8 h-8 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-xs font-bold shadow-sm"><i class="fas fa-check"></i></span>` 
                                                                    : (isRegistrationClosed 
                                                                        ? `<span class="w-8 h-8 rounded-xl bg-gray-100 text-gray-400 flex items-center justify-center text-xs"><i class="fas fa-eye"></i></span>`
                                                                        : `<span class="w-8 h-8 rounded-xl bg-gray-100 text-gray-400 group-hover:bg-purple-100 group-hover:text-purple-600 flex items-center justify-center text-xs transition-colors"><i class="fas fa-user-plus"></i></span>`
                                                                    )
                                                                }
                                                            </div>
                                                        </button>
                                                    `}).join('')}
                                                </div>
                                            </div>
                                        ` : ''}
                                        ${cat.nonStagePrograms.length > 0 ? `
                                            <div>
                                                <div class="flex items-center gap-2 mb-3">
                                                    <span class="w-2.5 h-2.5 rounded-full bg-amber-600"></span>
                                                    <h4 class="text-xs font-bold uppercase tracking-wider text-amber-800">Non-Stage Programs (${cat.nonStagePrograms.length})</h4>
                                                </div>
                                                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
                                                    ${cat.nonStagePrograms.map(p => {
                                                        const teamRegs = appData.participantRegistrations?.[p.id]?.[teamId] || [];
                                                        const isRegistered = teamRegs.length > 0;
                                                        return `
                                                        <button type="button" onclick="openRegistrationModal('${p.id}')" class="program-select-btn text-left p-4 rounded-2xl shadow-sm border transition-all duration-200 bg-white/80 border-gray-100 hover:bg-white hover:border-amber-300 hover:shadow-md group flex items-center justify-between cursor-pointer" data-program-id="${p.id}">
                                                            <div class="min-w-0 pr-2">
                                                                <span class="font-bold text-gray-900 text-sm block truncate group-hover:text-amber-700 transition-colors">${p.name}</span>
                                                                <span class="text-[11px] font-semibold text-gray-400">${isRegistered ? `<span class="text-emerald-600 font-bold">${teamRegs.length} registered</span>` : (isRegistrationClosed ? 'None registered' : 'Click to register')}</span>
                                                            </div>
                                                            <div class="flex-shrink-0">
                                                                ${isRegistered 
                                                                    ? `<span class="w-8 h-8 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-xs font-bold shadow-sm"><i class="fas fa-check"></i></span>` 
                                                                    : (isRegistrationClosed 
                                                                        ? `<span class="w-8 h-8 rounded-xl bg-gray-100 text-gray-400 flex items-center justify-center text-xs"><i class="fas fa-eye"></i></span>`
                                                                        : `<span class="w-8 h-8 rounded-xl bg-gray-100 text-gray-400 group-hover:bg-amber-100 group-hover:text-amber-600 flex items-center justify-center text-xs transition-colors"><i class="fas fa-user-plus"></i></span>`
                                                                    )
                                                                }
                                                            </div>
                                                        </button>
                                                    `}).join('')}
                                                </div>
                                            </div>
                                        ` : ''}
                                    </div>
                                </details>
                            </div>
                       `).join('')}
                    </main>
                 </div>
              `;
        }

        function renderTeamRosterPage() {
            const teamId = currentUser?.teamId || (currentUser?.teamName && Object.keys(appData.teams || {}).find(id => appData.teams[id]?.name === currentUser.teamName)) || Object.keys(appData.teams || {})[0];
            const activeRegProgramIds = Object.keys(appData.registrationPrograms || {});
            const registrations = appData.participantRegistrations || {};

            const teamStudents = getDataAsArray('students').filter(s => s.teamId === teamId).map(student => {
                let stageCount = 0;
                let nonStageCount = 0;
                activeRegProgramIds.forEach(progId => {
                    const program = appData.programs[progId];
                    if (program && !program.isGroup && registrations[progId]?.[teamId]?.includes(student.id)) {
                        if ((program.stageType || 'stage') === 'non-stage') {
                            nonStageCount++;
                        } else {
                            stageCount++;
                        }
                    }
                });
                return {
                    ...student,
                    stageCount,
                    nonStageCount,
                    totalCount: stageCount + nonStageCount
                };
            }).sort((a, b) => (String(a.chestNo || '')).localeCompare(String(b.chestNo || ''), undefined, { numeric: true }) || (a.name || '').localeCompare(b.name || ''));

            const totalTeamStage = teamStudents.reduce((sum, s) => sum + s.stageCount, 0);
            const totalTeamNonStage = teamStudents.reduce((sum, s) => sum + s.nonStageCount, 0);
            const totalRegisteredStudents = teamStudents.filter(s => s.totalCount > 0).length;

            return `
                <div class="bg-white/60 backdrop-blur-xl border border-white/60 p-4 sm:p-6 rounded-3xl shadow-lg">
                    <div class="flex flex-col md:flex-row justify-between md:items-center mb-6 gap-4">
                        <div>
                            <div class="flex items-center gap-3">
                                <h2 class="text-2xl font-black text-gray-900 tracking-tight">My Roster (${teamStudents.length} Students)</h2>
                            </div>
                            <p class="text-xs text-gray-500 mt-1">Live participation breakdown for your team members</p>
                        </div>
                        <div class="flex flex-wrap items-center gap-2">
                            <span class="px-3 py-1.5 rounded-xl text-xs font-bold bg-purple-50 text-purple-700 border border-purple-200 shadow-sm flex items-center gap-1.5">
                                <i class="fas fa-theater-masks"></i> Stage: ${totalTeamStage}
                            </span>
                            <span class="px-3 py-1.5 rounded-xl text-xs font-bold bg-amber-50 text-amber-700 border border-amber-200 shadow-sm flex items-center gap-1.5">
                                <i class="fas fa-pen-nib"></i> Non-Stage: ${totalTeamNonStage}
                            </span>
                            <span class="px-3 py-1.5 rounded-xl text-xs font-bold bg-indigo-50 text-indigo-700 border border-indigo-200 shadow-sm flex items-center gap-1.5">
                                <i class="fas fa-user-check"></i> Active: ${totalRegisteredStudents}/${teamStudents.length}
                            </span>
                            <button type="button" onclick="printTeamRoster()" id="print-team-registrations-btn" class="print-team-roster-btn bg-gradient-to-r from-gray-700 to-gray-800 text-white px-4 py-2 text-xs font-bold rounded-xl hover:from-gray-800 hover:to-gray-900 active:scale-95 transition-all flex items-center gap-2 shadow-sm ml-auto md:ml-2">
                                <i class="fas fa-print"></i>
                                <span>Print Roster</span>
                            </button>
                        </div>
                    </div>

                    <div class="overflow-x-auto rounded-2xl border border-gray-200/80 bg-white shadow-sm">
                        <table class="min-w-full divide-y divide-gray-200">
                             <thead class="bg-gray-50/80">
                                <tr>
                                    <th class="px-4 py-3.5 text-left text-xs font-bold text-gray-600 uppercase tracking-wider">Chest No</th>
                                    <th class="px-4 py-3.5 text-left text-xs font-bold text-gray-600 uppercase tracking-wider">Student Name</th>
                                    <th class="px-4 py-3.5 text-left text-xs font-bold text-gray-600 uppercase tracking-wider">Category</th>
                                    <th class="px-4 py-3.5 text-center text-xs font-bold text-purple-700 uppercase tracking-wider">Stage</th>
                                    <th class="px-4 py-3.5 text-center text-xs font-bold text-amber-700 uppercase tracking-wider">Non-Stage</th>
                                    <th class="px-4 py-3.5 text-center text-xs font-bold text-gray-700 uppercase tracking-wider">Total</th>
                                    <th class="px-4 py-3.5 text-right text-xs font-bold text-gray-600 uppercase tracking-wider">Actions</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-100 bg-white">
                                ${teamStudents.length === 0 ? `
                                    <tr>
                                        <td colspan="7" class="px-6 py-8 text-center text-sm text-gray-500">No students registered in your team roster.</td>
                                    </tr>
                                ` : teamStudents.map(student => `
                                    <tr class="hover:bg-orange-50/30 transition-colors">
                                        <td class="px-4 py-3.5 whitespace-nowrap text-sm font-bold text-gray-900">
                                            <span class="px-2.5 py-1 rounded-lg bg-gray-100 text-gray-800 text-xs font-bold border border-gray-200/60">#${student.chestNo || '-'}</span>
                                        </td>
                                        <td class="px-4 py-3.5 whitespace-nowrap">
                                            <button class="student-info-btn text-left group" data-student-id="${student.id}">
                                                <span class="font-bold text-gray-900 text-sm group-hover:text-orange-600 transition-colors">${student.name}</span>
                                            </button>
                                        </td>
                                        <td class="px-4 py-3.5 whitespace-nowrap text-xs font-semibold text-gray-600">
                                            <span class="px-2.5 py-0.5 rounded-full bg-gray-100 text-gray-700">${student.category}</span>
                                        </td>
                                        <td class="px-4 py-3.5 whitespace-nowrap text-sm text-center">
                                            <span class="inline-flex items-center justify-center min-w-[28px] px-2 py-0.5 rounded-full text-xs font-bold ${student.stageCount > 0 ? 'bg-purple-100 text-purple-700 border border-purple-200' : 'text-gray-400 bg-gray-50'}">${student.stageCount}</span>
                                        </td>

        function printAllParticipantLists(stageFilter = 'all', categoryFilter = 'all', onlyWithRegs = true) {
            const allPrograms = getDataAsArray('programs');
            const registrations = appData.participantRegistrations || {};
            const teams = getDataAsArray('teams').sort((a, b) => a.name.localeCompare(b.name));
            const logoBase64 = FEST_LOGO_BASE64;

            let programsToPrint = allPrograms.filter(p => {
                if (onlyWithRegs) {
                    const hasRegs = registrations[p.id] && Object.values(registrations[p.id]).flat().length > 0;

        document.addEventListener('submit', async (e) => {
             if (e.target.id === 'login-form') {
                e.preventDefault();
                const input = document.getElementById('access-code-input');
                const errorEl = document.getElementById('login-error');
                const code = input.value.trim().toUpperCase();
                
                const codeHash = await SecurityEngine.hashPasscode(code);
                const user = AuthConfig.getUserByHash(codeHash);
                if (user) {
                    currentUser = user;
                    sessionStorage.setItem('user', JSON.stringify(user));
                    renderApp();
                } else {
                    errorEl.textContent = "Invalid access code.";
                }
            }
             if (e.target.id === 'registration-form') {
                e.preventDefault();
                const isAdmin = currentUser?.type === 'admin';
                if (!isAdmin && appData.settings?.portals?.participant === false) {
                    return;
                }
                const form = e.target;
                const messageEl = document.getElementById('reg-form-message');
                const selectedStudentIds = Array.from(form.querySelectorAll('input[name="studentIds"]:checked')).map(cb => cb.value);
                
                const formTeamId = (form.elements.teamId && form.elements.teamId.value) || currentModalTeamId || (currentUser?.teamName && Object.keys(appData.teams).find(id => appData.teams[id].name === currentUser.teamName)) || currentUser?.teamId || Object.keys(appData.teams)[0];
                const programId = form.elements.programId.value;

                try {
                    await db.ref(`participantRegistrations/${programId}/${formTeamId}`).set(selectedStudentIds);
                    if (messageEl) {
                        messageEl.textContent = '✓ Registrations saved successfully!';
                        messageEl.className = 'text-xs font-semibold mt-1 text-center text-emerald-600 animate-fade-in';
                    }
                    setTimeout(() => {
                        if (selectedProgramId === programId) {
                            openRegistrationModal(programId, formTeamId);
                        }
                    }, 400);
                } catch(err) {
                    if (messageEl) {
                        messageEl.textContent = 'Error: ' + err.message;
                        messageEl.className = 'text-xs font-semibold mt-1 text-center text-red-500 animate-fade-in';
                    }
                }
            }
        });

            if (e.target.id === 'student-search-input') {
                const query = e.target.value.trim().toLowerCase();
                const cards = document.querySelectorAll('.student-select-card');
                let visibleCount = 0;
                cards.forEach(card => {
                    const name = card.dataset.name || '';
                    const chest = card.dataset.chest || '';
                    if (name.includes(query) || chest.includes(query)) {
                        card.style.display = 'flex';
                        visibleCount++;
                    } else {
                        card.style.display = 'none';
                    }
                });
                const noResults = document.getElementById('no-search-results');
                if (noResults) {
                    noResults.classList.toggle('hidden', visibleCount > 0 || cards.length === 0);
                }
            }
        });

            if (e.key === 'Escape') {

                if (modal && !modal.classList.contains('hidden')) {
                    closeModal();
                    selectedProgramId = null;
                }
            }
        });

        document.addEventListener('click', async (e) => {
             if (e.target.id === 'logout-btn') {
                currentUser = null;
                sessionStorage.removeItem('user');
                window.location.href = 'index.html';
            }
            if (e.target.closest('.admin-tab')) {
                activeAdminTab = e.target.closest('.admin-tab').dataset.tab;
                renderApp();
            }
            if (e.target.closest('.team-tab')) {
                activeTeamTab = e.target.closest('.team-tab').dataset.tab;
                renderApp();
            }
            if (e.target.closest('.modal-tab-btn')) {
                const btn = e.target.closest('.modal-tab-btn');
                const tab = btn.dataset.modalTab;
                switchModalTab(tab);
            }
            if (e.target.id === 'clear-all-students-btn') {
                clearAllSelectedStudents();
            }
            const programButton = e.target.closest('.program-select-btn');
            if(programButton) {
                selectedProgramId = programButton.dataset.programId;
                selectedCategory = appData.programs[selectedProgramId]?.category;
                openRegistrationModal(selectedProgramId);
            }
            if (e.target.id === 'close-registration-modal-btn' || e.target.id === 'modal-cancel-btn' || e.target.id === 'registration-modal-overlay') {
                closeModal();
            }
            if (e.target.closest('.remove-participant-modal-btn')) {
                const button = e.target.closest('.remove-participant-modal-btn');
                const studentIdToRemove = button.dataset.studentId;
                removeParticipantFromModal(studentIdToRemove, e);
            }
            if (e.target.closest('.remove-participant-btn')) {
                const isAdmin = currentUser?.type === 'admin';
                if (!isAdmin && appData.settings?.portals?.participant === false) return;
                const button = e.target.closest('.remove-participant-btn');
                const studentIdToRemove = button.dataset.studentId;
                const teamId = currentModalTeamId || (currentUser?.teamName && Object.keys(appData.teams).find(id => appData.teams[id].name === currentUser.teamName)) || currentUser?.teamId || Object.keys(appData.teams)[0];
                const currentRegs = appData.participantRegistrations?.[selectedProgramId]?.[teamId] || [];
                const newRegs = currentRegs.filter(id => id !== studentIdToRemove);
                db.ref(`participantRegistrations/${selectedProgramId}/${teamId}`).set(newRegs);
            }
            if (e.target.id === 'print-all-btn') {
                printAllParticipantLists();
            }
            if (e.target.closest('#print-team-registrations-btn') || e.target.closest('.print-team-roster-btn')) {
                printTeamRoster();
            }
            if (e.target.matches('#student-stats-filter-container .category-filter-btn')) {
                studentStatsFilter = e.target.dataset.status;
                renderApp();
            }
             if (e.target.closest('.student-info-btn')) {
                openStudentRegistrationsModal(e.target.closest('.student-info-btn').dataset.studentId);
            }
            if (e.target.closest('.close-modal-btn')) {
                closeModal();
            }
        });
        
        document.addEventListener('change', e => {
            if (e.target.name === 'studentIds') {
                updateSelectedCounter();
            }
            if (e.target.matches('.toggle-checkbox')) {
                const programId = e.target.dataset.programId;
                if(e.target.name === 'reg-toggle') {
                    if (e.target.checked) {
                        db.ref(`registrationPrograms/${programId}`).set(true);
                    } else {
                        db.ref(`registrationPrograms/${programId}`).remove();
                    }
                } else if (e.target.name === 'group-toggle') {
                    db.ref(`programs/${programId}/isGroup`).set(e.target.checked);

            }

        function updateSelectedCounter() {
            const checkedBoxes = document.querySelectorAll('#student-cards-list input[name="studentIds"]:checked');
            const badge = document.getElementById('selected-counter-badge');
            const submitBtnText = document.getElementById('submit-btn-counter');
            const count = checkedBoxes.length;
            if (badge) {
                badge.textContent = `${count} Selected`;
            }
            if (submitBtnText) {
                submitBtnText.textContent = count > 0 ? `Save (${count} Selected)` : 'Save Registrations';
            }
        }

            const checkboxes = document.querySelectorAll('#student-cards-list input[name="studentIds"]');
            checkboxes.forEach(cb => {
                cb.checked = false;

            updateSelectedCounter();

        function switchModalTab(tab) {
            const pickerPanel = document.getElementById('modal-picker-panel');
            const rosterPanel = document.getElementById('modal-roster-panel');
            const tabBtns = document.querySelectorAll('.modal-tab-btn');
            
            tabBtns.forEach(b => {
                const isActive = b.dataset.modalTab === tab;
                if (isActive) {
                    b.className = 'modal-tab-btn flex-1 py-2.5 px-3 rounded-xl text-xs font-bold transition-all text-center bg-orange-500 text-white shadow-sm';
                } else {
                    b.className = 'modal-tab-btn flex-1 py-2.5 px-3 rounded-xl text-xs font-bold transition-all text-center bg-gray-100 text-gray-600 hover:text-gray-900';
                }
            });

            if (pickerPanel && rosterPanel) {
                if (tab === 'select') {
                    pickerPanel.classList.remove('hidden');
                    pickerPanel.classList.add('flex');
                    rosterPanel.classList.add('hidden');
                    rosterPanel.classList.remove('flex');
                    pickerPanel.style.display = '';
                    rosterPanel.style.display = '';
                } else {
                    pickerPanel.classList.add('hidden');
                    pickerPanel.classList.remove('flex');
                    rosterPanel.classList.remove('hidden');
                    rosterPanel.classList.add('flex');

                    rosterPanel.style.display = 'flex';

            }

            if (e) {
                e.preventDefault();
                e.stopPropagation();
            }
            try {
                if (!selectedProgramId) return;
                const isAdmin = currentUser?.type === 'admin';
                if (!isAdmin && appData.settings?.portals?.participant === false) return;

                const teamId = currentModalTeamId || (currentUser?.teamId || (currentUser?.teamName && Object.keys(appData.teams || {}).find(id => appData.teams[id]?.name === currentUser.teamName)) || Object.keys(appData.teams || {})[0]);
                if (!teamId) return;

                const currentRegs = appData.participantRegistrations?.[selectedProgramId]?.[teamId] || [];
                const newRegs = currentRegs.filter(id => id !== studentId);
                await db.ref(`participantRegistrations/${selectedProgramId}/${teamId}`).set(newRegs);
                
                openRegistrationModal(selectedProgramId, teamId);
                if (window.innerWidth < 1024) {
