                                        </div>

                                        <!-- Bottom Actions -->
                                        <div class="pt-3 mt-2 border-t border-gray-100 flex items-center gap-2 sm:gap-3 flex-shrink-0">
                                            ${isRegistrationClosed ? `
                                                <div class="flex items-center gap-2 text-xs font-semibold text-amber-800 bg-amber-50 px-3.5 py-2.5 rounded-xl border border-amber-200 flex-1">
                                                    <i class="fas fa-lock text-amber-600"></i>
                                                    <span>Portal closed by admin. Viewing candidate list only.</span>
                                                </div>
                                                <button type="button" onclick="closeModal()" class="px-5 py-2.5 rounded-xl text-xs font-bold text-white bg-gray-800 hover:bg-gray-900 active:scale-95 transition-all cursor-pointer">
                                                    Close
                                                </button>
                                            ` : `
                                                <button type="submit" class="flex-1 flex items-center justify-center gap-2 py-3.5 px-4 rounded-xl text-sm font-bold text-white bg-gradient-to-r from-orange-500 to-amber-600 hover:from-orange-600 hover:to-amber-700 shadow-md active:scale-95 transition-all cursor-pointer">
                                                    <i class="fas fa-check-double"></i>
                                                    <span id="submit-btn-counter">${teamRegistrationsForProgram.length > 0 ? `Save (${teamRegistrationsForProgram.length} Selected)` : 'Save Registrations'}</span>
                                                </button>
                                                <button type="button" id="modal-cancel-btn" onclick="closeModal()" class="px-4 py-3.5 rounded-xl text-sm font-bold text-gray-600 bg-gray-100 hover:bg-gray-200 active:scale-95 transition-colors cursor-pointer">
                                                    Close
                                                </button>
                                            `}
                                        </div>
                                        <p id="reg-form-message" class="text-xs font-semibold text-center h-4 mt-1"></p>
                                    </form>
                                </div>

                                <!-- Panel 2: Live Registered Roster (5 cols on lg, hidden by default on mobile unless tab is active) -->
                                <div id="modal-roster-panel" class="hidden lg:flex lg:col-span-5 flex-col h-full overflow-hidden bg-white rounded-2xl sm:rounded-3xl border border-gray-200/80 p-3 sm:p-5 shadow-sm">
                                    <div class="flex items-center justify-between pb-3 border-b border-gray-200/70 mb-3 flex-shrink-0">
                                        <h4 class="text-xs font-black text-gray-800 uppercase tracking-wider flex items-center gap-2">
                                            <i class="fas fa-users text-orange-500"></i>
                                            Enrolled (${teamRegistrationsForProgram.length})
                                        </h4>
                                        <span class="text-[11px] font-bold px-2 py-0.5 rounded-md bg-emerald-50 text-emerald-700 border border-emerald-200">${teamName}</span>
                                    </div>

                                    <div class="flex-1 overflow-y-auto space-y-2 pr-1 custom-scroll" id="modal-roster-list">
                                        ${teamRegistrationsForProgram.length === 0 ? `
                                            <div class="h-full min-h-[200px] flex flex-col items-center justify-center p-6 text-center">
                                                <div class="w-12 h-12 rounded-2xl bg-orange-100/60 text-orange-500 flex items-center justify-center text-lg mb-3">
                                                    <i class="fas fa-user-plus"></i>
                                                </div>
                                                <p class="text-sm font-bold text-gray-700">No Participants Registered</p>
                                                <p class="text-xs text-gray-400 mt-1 max-w-[220px]">${isRegistrationClosed ? 'No students were enrolled for this program.' : 'Select students from the roster and tap Save to enroll them.'}</p>
                                            </div>
                                        ` : `
                                            <div class="space-y-2">
                                                ${teamRegistrationsForProgram.map(studentId => {
                                                    const student = appData.students?.[studentId];
                                                    if (!student) return '';
                                                    const sName = student.name || 'Unnamed';
                                                    const sChest = (student.chestNo !== undefined && student.chestNo !== null) ? String(student.chestNo) : '';
                                                    const initial = sName.charAt(0).toUpperCase();
                                                    return `
                                                    <div class="flex items-center justify-between p-3 bg-gray-50/80 rounded-xl border border-gray-100 hover:bg-white shadow-sm transition-all group">
                                                        <div class="flex items-center gap-3 min-w-0 flex-1 pr-2">
                                                            <div class="w-9 h-9 rounded-xl bg-orange-100 text-orange-700 font-black text-xs flex items-center justify-center flex-shrink-0">
                                                                ${initial}
                                                            </div>
                                                            <div class="min-w-0 flex-1">
                                                                <p class="font-bold text-gray-900 text-sm truncate">${sName}</p>
                                                                ${sChest ? `<p class="text-[11px] font-bold text-orange-600">Chest #${sChest}</p>` : ''}
                                                            </div>
                                                        </div>
                                                        ${!isRegistrationClosed ? `
                                                            <button type="button" onclick="removeParticipantFromModal('${studentId}', event)" class="remove-participant-modal-btn w-9 h-9 rounded-xl text-gray-400 hover:text-red-600 hover:bg-red-50 flex items-center justify-center active:scale-90 transition-all text-sm flex-shrink-0 cursor-pointer" data-student-id="${studentId}" title="Remove Participant">
                                                                <i class="fas fa-trash-alt"></i>
                                                            </button>
                                                        ` : `
                                                            <span class="w-8 h-8 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-xs shadow-xs font-bold" title="Registered">
                                                                <i class="fas fa-check"></i>
                                                            </span>
                                                        `}
                                                    </div>
                                                    `;
                                                }).join('')}
                                            </div>
                                        `}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;

                const modalContainer = document.getElementById('modal-container');
                if (modalContainer) {
                    modalContainer.innerHTML = modalHTML;
                    modalContainer.classList.remove('hidden');
                }
            } catch(err) {
                console.error("Error opening registration modal:", err);
            }
        }
        window.openRegistrationModal = openRegistrationModal;
        
        function openStudentRegistrationsModal(studentId) {
            const student = appData.students[studentId];
            if (!student) return;

            // Strict privacy: Team users cannot inspect student registrations of other teams
            if (currentUser?.type !== 'admin') {
                const myTeamId = currentUser?.teamId || (currentUser?.teamName && Object.keys(appData.teams || {}).find(id => appData.teams[id]?.name === currentUser.teamName));
                if (student.teamId !== myTeamId) {
                    console.warn("Unauthorized: Cannot view student data of another team.");
                    return;
                }
            }

            const registrations = appData.participantRegistrations || {};
            const studentRegistrations = [];
            
            Object.entries(registrations).forEach(([programId, teamRegs]) => {
                const program = appData.programs[programId];
                if (program && teamRegs[student.teamId]?.includes(studentId)) {
                    studentRegistrations.push(program);
                }
            });

            const stageCount = studentRegistrations.filter(p => !p.isGroup && (p.stageType || 'stage') !== 'non-stage').length;
            const nonStageCount = studentRegistrations.filter(p => !p.isGroup && (p.stageType || 'stage') === 'non-stage').length;

            const modalHTML = `
                <div class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                    <div class="bg-white/90 backdrop-blur-2xl border border-white/60 rounded-3xl shadow-2xl w-full max-w-lg p-8 relative transform transition-all" style="animation: fadeIn 0.3s ease-out;">
                        <button class="close-modal-btn absolute top-4 right-4 w-8 h-8 rounded-full bg-gray-100 hover:bg-gray-200 text-gray-500 hover:text-gray-800 flex items-center justify-center text-lg font-bold transition-all">&times;</button>
                        <h3 class="text-2xl font-bold text-gray-900 mb-1">${student.name}</h3>
                        <p class="text-gray-500 text-sm mb-4">Chest No: <span class="font-semibold text-gray-800">${student.chestNo}</span> • Team: <span class="font-semibold text-gray-800">${appData.teams[student.teamId]?.name || 'N/A'}</span></p>
                        
                        <div class="flex items-center gap-2 mb-4">
                            <span class="px-2.5 py-1 rounded-lg text-xs font-bold bg-purple-50 text-purple-700 border border-purple-200/60">Stage: ${stageCount}</span>
                            <span class="px-2.5 py-1 rounded-lg text-xs font-bold bg-amber-50 text-amber-700 border border-amber-200/60">Non-Stage: ${nonStageCount}</span>
                            <span class="px-2.5 py-1 rounded-lg text-xs font-bold bg-indigo-50 text-indigo-700 border border-indigo-200/60">Total: ${studentRegistrations.length}</span>
                        </div>

                        <h4 class="text-sm font-bold text-gray-700 uppercase tracking-wider mb-2">Registered Programs (${studentRegistrations.length})</h4>
                        <div class="space-y-2 max-h-64 overflow-y-auto pr-1">
                            ${studentRegistrations.length > 0 ? studentRegistrations.map(p => {
                                const isStage = (p.stageType || 'stage') !== 'non-stage';
                                return `
                                <div class="bg-white/80 border border-gray-100 p-3 rounded-xl flex items-center justify-between shadow-sm">
                                    <div>
                                        <p class="font-bold text-gray-800 text-sm">${p.name}</p>
                                        <p class="text-xs text-gray-500">${p.category}${p.isGroup ? ' • <span class="text-blue-600 font-medium">Group</span>' : ''}</p>
                                    </div>
                                    <span class="px-2 py-0.5 rounded text-[11px] font-bold ${isStage ? 'bg-purple-100 text-purple-700' : 'bg-amber-100 text-amber-700'}">
                                        ${isStage ? 'Stage' : 'Non-Stage'}
                                    </span>
                                </div>
                                `;
                            }).join('') : '<p class="text-gray-500 text-sm py-4 text-center">This student has not been registered for any programs yet.</p>'}
                        </div>
                    </div>
                </div>
            `;
            const modalContainer = document.getElementById('modal-container');
            modalContainer.innerHTML = modalHTML;
            modalContainer.classList.remove('hidden');
        }

        function closeModal() {
            selectedProgramId = null;
            currentModalTeamId = null;
            const modalContainer = document.getElementById('modal-container');
            if (modalContainer) {
                modalContainer.classList.add('hidden');
                modalContainer.innerHTML = '';
            }
            renderApp();
        }
        window.closeModal = closeModal;

        window.handleCandidateSearch = function(val) {
            candidateSearchQuery = val || '';
            renderApp();
        };
        window.setCandidateCategoryFilter = function(cat) {
            candidateCategoryFilter = cat;
            renderApp();
        };
        window.setCandidateStageFilter = function(stage) {
            candidateStageFilter = stage;
            renderApp();
        };
        window.adminSelectTeam = function(teamId) {
            adminSelectedTeamId = teamId;
            renderApp();
        };
        window.adminSelectAndEditTeam = function(teamId) {
            adminSelectedTeamId = teamId;
            activeAdminTab = 'teams';
            renderApp();
        };

        // --- INITIALIZATION ---
        function initializeApp() {
            const storedUser = sessionStorage.getItem('user');
            if (!storedUser) {
                window.location.replace('index.html');
                return;
            }
            currentUser = JSON.parse(storedUser);

            const partPortalCols = ['students', 'teams', 'programs', 'participantRegistrations', 'registrationPrograms', 'settings'];
            partPortalCols.forEach(col => {
                db.ref(col).on('value', snap => {
                    appData[col] = snap.val() || {};

                    // Teams are allowed to stay in view-only mode even if appData.settings?.portals?.participant is false
                    
                    // If this user currently has a registration modal open, DO NOT re-render the app or modal.
                    // This protects unsaved checkbox selections from being wiped when other teams save their data concurrently!
                    if (selectedProgramId) {
                        const teamName = currentUser?.teamName;
                        const teamId = currentModalTeamId || currentUser?.teamId || (teamName && Object.keys(appData.teams || {}).find(id => appData.teams[id]?.name === teamName)) || Object.keys(appData.teams || {})[0];
                        const teamRegs = appData.participantRegistrations?.[selectedProgramId]?.[teamId] || [];
                        const rosterTabBtn = document.querySelector('.modal-tab-btn[data-modal-tab="roster"]');
                        if (rosterTabBtn) {
                            rosterTabBtn.innerHTML = `<i class="fas fa-users mr-1.5"></i>Enrolled (${teamRegs.length})`;
                        }
                        return;
                    }
                    
                    // If user is actively typing in any input, select, or textarea, protect their focus and input
                    const activeEl = document.activeElement;
                    if (activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'SELECT' || activeEl.tagName === 'TEXTAREA')) {
                        return;
                    }
                    
                    renderApp();
                });
            });
        }
        
        initializeApp();
    </script>
</body>
</html>
