<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alert 2k26 - Festival Management</title>

  <!-- Preconnect to external origins for faster DNS/TLS -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>

  <!-- External Styles -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" /></noscript>
  <link rel="stylesheet" href="styles/print.css" media="print" />
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind (pre-built, no runtime JIT) -->
  <link rel="stylesheet" href="styles/tailwind.css" />

  <!-- Custom Scrollbar -->
  <style>
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: #e5e7eb;
      border-radius: 20px;
    }
    .custom-scrollbar:hover::-webkit-scrollbar-thumb {
      background-color: #d1d5db;
    }
    
    html {
      scroll-behavior: smooth;
    }
    .animation-delay-2000 {
      animation-delay: 2s;
    }
    .animation-delay-4000 {
      animation-delay: 4s;
    }

    /* TV Display ticker animation */
    @keyframes ticker {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    .animate-ticker {
      animation: ticker 30s linear infinite;
    }

    /* Hide scrollbar utility */
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>

  <!-- External Libraries -->
  <!-- Firebase (compat version) - critical, loaded sync -->
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
  <!-- SheetJS - deferred, only needed for admin export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>

</head>
<body class="bg-[#fafafa] font-sans text-gray-900 antialiased selection:bg-indigo-100 selection:text-indigo-900 overflow-y-scroll">

  <!-- SPA Mount Point -->
  <div id="app">
    <!-- Branded Loading Screen -->
    <div id="loading-screen" class="fixed inset-0 z-[9999] flex flex-col items-center justify-center bg-[#fafafa]" style="background-image: radial-gradient(at 50% 40%, hsla(230,80%,70%,0.12) 0px, transparent 60%);">
      <style>
        @keyframes loaderSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes loaderPulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.85; transform: scale(0.97); } }
        @keyframes loaderFadeOut { 0% { opacity: 1; } 100% { opacity: 0; pointer-events: none; visibility: hidden; } }
        .loader-logo { animation: loaderPulse 2.5s ease-in-out infinite; }
        .loader-ring { animation: loaderSpin 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite; }
        .loader-hide { animation: loaderFadeOut 0.4s ease-out forwards; }
      </style>
      <div class="relative mb-6">
        <img src="../registrations/prelogo.webp" alt="Alert 2k26" class="loader-logo w-24 h-24 sm:w-28 sm:h-28 rounded-full object-cover shadow-xl border-2 border-white/60" />
        <svg class="loader-ring absolute -inset-2 w-[calc(100%+16px)] h-[calc(100%+16px)]" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="46" fill="none" stroke="#6366f120" stroke-width="3" />
          <circle cx="50" cy="50" r="46" fill="none" stroke="#6366f1" stroke-width="3" stroke-linecap="round" stroke-dasharray="72 220" />
        </svg>
      </div>
      <h1 class="text-xl sm:text-2xl font-black text-gray-900 tracking-tight mb-1" style="font-family: Inter, sans-serif;">Alert 2k26</h1>
      <p class="text-xs sm:text-sm font-medium text-gray-400 tracking-wide" style="font-family: Inter, sans-serif;">Loading Festival Management...</p>
    </div>
  </div>

  <!-- Application Logic Modules -->
  <!-- 1. Infrastructure -->
  <script src="../js/firebase-config.js"></script>
  <script src="../js/security.js"></script>
  <script src="../js/state.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/modals.js"></script>
  
  <!-- 2. Data & Calculations -->
  <script src="../js/calculations.js"></script>
  <script src="../js/data.js"></script>

  <!-- 3. Views -->
  <script src="../js/pages-public.js"></script>
  <script src="../js/pages-admin.js"></script>
  <script src="../js/pages-admin-tabs.js"></script>
  <script src="../js/admin-forms.js"></script>
  <script src="../js/admin-actions.js"></script>
  <script src="../js/print.js"></script>

  <!-- 4. Router & Bootstrap -->
  <script src="../js/router.js"></script>
  <script src="../js/events.js"></script>

</body>
</html>
